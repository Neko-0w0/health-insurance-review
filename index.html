<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>健保技術員考前複習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Pinyon+Script&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: Char Show exhibition sheets on cool paper; sticky tab bar; notes = chapter rail + reading sheet. */
:root {
  --paper: #f6f6f4; --card: #ffffff; --tint: #ecedef; --ink: #1b1c21; --ink2: #5f626b; --ink3: #b9bcc3; --hair: #d4d6db;
  --rose: #d9919f; --rose-ink: #9b4257; --mist: #7d97ba; --ok: #2f7a82; --ok-soft: #e3efef; --bad: #9b4257; --bad-soft: #f6e6ea;
  --must: #fbeec2; --must-ink: #5c4a12;
  --f-display: "Cormorant Garamond", "Noto Serif TC", Georgia, serif;
  --f-script: "Pinyon Script", "Cormorant Garamond", cursive;
  --f-mono: "Space Mono", ui-monospace, monospace;
  --f-serif: "Noto Serif TC", "Songti TC", serif;
  --f-sans: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14161b; --card: #1d2027; --tint: #272b33; --ink: #eef0f3; --ink2: #a6aab3; --ink3: #4a4f5a; --hair: #353a44;
  --rose: #e3a2ae; --rose-ink: #efb6c1; --mist: #93abcb; --ok: #6cc0c6; --ok-soft: #1f3335; --bad: #efb6c1; --bad-soft: #3a2429;
  --must: #4a3f18; --must-ink: #f6ecc8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #14161b; --card: #1d2027; --tint: #272b33; --ink: #eef0f3; --ink2: #a6aab3; --ink3: #4a4f5a; --hair: #353a44;
  --rose: #e3a2ae; --rose-ink: #efb6c1; --mist: #93abcb; --ok: #6cc0c6; --ok-soft: #1f3335; --bad: #efb6c1; --bad-soft: #3a2429;
  --must: #4a3f18; --must-ink: #f6ecc8; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-sans); font-size: 15px; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--rose-ink); outline-offset: 2px; }
.micro { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.dia { display: inline-block; width: 8px; height: 8px; transform: rotate(45deg); background: var(--rose); }
.dia--b { background: var(--mist); }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: .75px solid var(--hair);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top__in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
.brand b { font-family: var(--f-serif); font-weight: 500; font-size: 16px; letter-spacing: .14em; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tab { font-family: var(--f-serif); font-size: 14px; letter-spacing: .12em; padding: 6px 12px; border-radius: 999px; border: .75px solid transparent; text-decoration: none; }
.tab:hover { border-color: var(--hair); }
.tab[aria-current="page"] { background: var(--ink); color: var(--card); }
.sync { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; color: var(--ink2); }

main { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }

/* sheet + ornaments */
.sheet { position: relative; background: var(--card); border: 1.5px solid var(--hair); border-radius: 18px; padding: 32px; min-width: 0; }
.sheet::before { content: ""; position: absolute; inset: 8px; border: .75px solid var(--rose); border-radius: 12px; pointer-events: none; }
.sheet > * { position: relative; }
.tag { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; font-family: var(--f-mono); font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.tag > span { padding: 5px 10px; }
.tag__no { background: var(--ink); color: var(--card); }
.tag__tx { background: var(--card); }
.ribbon { position: relative; z-index: 0; display: inline-block; margin: 0 18px; padding: 6px 26px; background: var(--card); color: var(--rose-ink); font-family: var(--f-serif); font-size: 14px; letter-spacing: .26em; border-top: 1.5px solid var(--rose); border-bottom: 1.5px solid var(--rose); }
.ribbon::before, .ribbon::after { content: ""; position: absolute; top: 6px; bottom: -8px; width: 24px; background: var(--rose); z-index: -1; }
.ribbon::before { left: -16px; clip-path: polygon(0 0,100% 0,100% 100%,0 100%,9px 50%); }
.ribbon::after { right: -16px; clip-path: polygon(0 0,100% 0,calc(100% - 9px) 50%,100% 100%,0 100%); }
.h2 { margin: 0; font-family: var(--f-serif); font-weight: 500; font-size: 22px; letter-spacing: .14em; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
.btn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--card); border-radius: 999px; padding: 9px 18px; font-family: var(--f-mono); font-size: 12px; font-weight: 700; letter-spacing: .14em; }
.btn--ghost { background: var(--card); color: var(--ink); }
.btn[aria-pressed="true"] { background: var(--card); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.chip { border: .75px solid var(--ink); background: var(--card); padding: 5px 12px; font-size: 13px; border-radius: 999px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.script { font-family: var(--f-script); font-size: 38px; line-height: 1; }

/* home hero */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 24px; padding: 40px 34px 34px; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.rail__tx { writing-mode: vertical-rl; font-family: var(--f-display); font-style: italic; font-size: 15px; letter-spacing: .06em; white-space: nowrap; }
.rail__line { flex: 1; min-height: 32px; border-left: .75px solid var(--ink); }
.rail__cjk { writing-mode: vertical-rl; font-family: var(--f-serif); font-size: 12px; letter-spacing: .24em; color: var(--ink2); white-space: nowrap; }
.hero__main { display: grid; gap: 18px; align-content: start; min-width: 0; }
.hero__top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.title { margin: 0; font-family: var(--f-serif); font-weight: 500; font-size: clamp(26px, 4vw, 38px); letter-spacing: .12em; line-height: 1.3; text-wrap: balance; }
.title small { display: block; font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: .55em; letter-spacing: .04em; color: var(--ink2); }
.count { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 28px; }
.count__big { font-family: var(--f-display); font-size: clamp(72px, 12vw, 120px); line-height: .85; font-weight: 500; font-variant-numeric: tabular-nums; }
.count__big small { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; margin-left: 8px; }
.count__meta { display: grid; gap: 4px; padding-bottom: 6px; }
.count__meta b { font-family: var(--f-serif); font-weight: 500; font-size: 15px; letter-spacing: .1em; }
.today { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; align-items: center; border-top: .75px solid var(--ink); padding-top: 16px; }
.today__task { font-family: var(--f-serif); font-size: 18px; letter-spacing: .06em; line-height: 1.6; }
.today__task a { text-decoration: none; border-bottom: .75px solid var(--rose); }
.today__alert { color: var(--rose-ink); font-size: 14px; margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { border-left: .75px solid var(--hair); padding-left: 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 30px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.palette { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.swatch { width: 22px; height: 30px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--ink); }

/* chapter progress list */
.prog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
.prow { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 12px; padding: 14px 0; border-top: .75px solid var(--hair); text-decoration: none; align-items: center; }
.prow:hover .prow__t { color: var(--rose-ink); }
.prow__n { font-family: var(--f-display); font-size: 30px; line-height: 1; grid-row: span 2; }
.prow__t { font-family: var(--f-serif); font-size: 15px; letter-spacing: .06em; display: flex; justify-content: space-between; gap: 8px; }
.prow__t span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; color: var(--ink2); white-space: nowrap; }
.bar { height: 4px; background: var(--tint); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--rose); }
.bar i.q { background: var(--mist); }
.bars { display: grid; gap: 4px; }
.dist { display: grid; gap: 10px; }
.dist__row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 28px; gap: 12px; align-items: center; font-size: 14px; }
.dist__row .bar { height: 10px; }
.dist__row b { font-family: var(--f-display); font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }

/* notes */
.notes { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.chlist { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 2px; max-height: calc(100vh - 100px); overflow: auto; padding: 18px 12px; }
.chlist a { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px; padding: 8px 8px; text-decoration: none; font-size: 14px; line-height: 1.4; border-radius: 8px; }
.chlist a span { font-family: var(--f-display); font-size: 18px; color: var(--ink2); }
.chlist a:hover { background: var(--tint); }
.chlist a[aria-current="true"] { background: var(--ink); color: var(--card); }
.chlist a[aria-current="true"] span { color: var(--card); }
.chsel { display: none; width: 100%; padding: 10px 12px; font: inherit; font-family: var(--f-serif); background: var(--card); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 999px; }
.chhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 24px; align-items: end; padding-bottom: 20px; border-bottom: .75px solid var(--ink); }
.chnum { font-family: var(--f-display); font-size: 84px; line-height: .85; }
.chhead h1 { margin: 0; font-family: var(--f-serif); font-weight: 500; font-size: clamp(22px, 3vw, 30px); letter-spacing: .1em; line-height: 1.35; text-wrap: balance; }
.chhead p { margin: 6px 0 0; font-size: 13px; color: var(--ink2); line-height: 1.7; }
.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 14px 0; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; }
.toc a { font-size: 12px; text-decoration: none; padding: 3px 9px; border: .75px solid var(--hair); border-radius: 999px; }
.toc a.done { border-color: var(--rose); color: var(--rose-ink); }
.sec { padding: 28px 0 8px; border-top: .75px solid var(--hair); scroll-margin-top: 80px; }
.sec h3 { margin: 0 0 16px; font-family: var(--f-serif); font-weight: 500; font-size: 21px; letter-spacing: .1em; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.sec h3 span { font-family: var(--f-display); font-size: 26px; letter-spacing: 0; color: var(--rose-ink); }
.body { display: grid; gap: 14px; min-width: 0; }
.body h4 { margin: 10px 0 0; font-family: var(--f-serif); font-weight: 500; font-size: 16px; letter-spacing: .12em; display: flex; align-items: center; gap: 10px; }
.body h4::before { content: ""; width: 7px; height: 7px; transform: rotate(45deg); background: var(--mist); flex: none; }
.body p { margin: 0; line-height: 1.9; max-width: 70ch; }
.body ul { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; line-height: 1.85; max-width: 74ch; }
.body li::marker { color: var(--rose); }
.box { border: .75px solid var(--ink); padding: 12px 16px; display: grid; gap: 6px; line-height: 1.85; }
.box p { margin: 0; max-width: none; }
.box__k { justify-self: start; font-family: var(--f-mono); font-size: 10px; font-weight: 700; letter-spacing: .18em; padding: 2px 8px; background: var(--ink); color: var(--card); }
.box--must { background: var(--must); color: var(--must-ink); border-color: var(--must-ink); }
.box--must .box__k { background: var(--must-ink); color: var(--must); }
.box--warn .box__k { background: var(--rose-ink); color: var(--card); }
.box--warn { border-color: var(--rose-ink); }
.box--mnem { border-style: dashed; }
.box--mnem .box__k { background: transparent; color: var(--ink); border: .75px solid var(--ink); }
.box--more { border-color: var(--hair); color: var(--ink2); }
.box--more .box__k { background: var(--tint); color: var(--ink2); }
.tbl { overflow-x: auto; border-top: .75px solid var(--ink); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: .75px solid var(--hair); text-align: left; vertical-align: top; line-height: 1.65; min-width: 4.5em; }
.tbl th { font-family: var(--f-serif); font-weight: 500; font-size: 13px; letter-spacing: .06em; color: var(--ink2); background: var(--tint); }
.secfoot { display: flex; justify-content: flex-end; padding: 18px 0 12px; }
.must-only .body > :not(.box--must):not(.box--warn):not(.box--mnem) { display: none; }
.must-only .sec[data-key="0"] { display: none; }
.must-only .intro > :not(.box--must):not(.box--warn):not(.box--mnem) { display: none; }
.must-note { display: none; font-size: 13px; color: var(--ink2); }
.must-only .must-note { display: block; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 20px; border-top: .75px solid var(--ink); margin-top: 20px; }
.pager a { text-decoration: none; font-family: var(--f-serif); letter-spacing: .08em; display: grid; gap: 2px; }
.pager a:last-child { text-align: right; margin-left: auto; }

/* quiz */
.q { display: grid; gap: 12px; padding: 20px 0; border-top: .75px solid var(--hair); }
.q__src { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; color: var(--rose-ink); font-weight: 700; display: flex; gap: 10px; flex-wrap: wrap; }
.q__src span { color: var(--ink2); font-weight: 400; }
.q__stem { margin: 0; font-family: var(--f-serif); font-size: 17px; line-height: 1.75; letter-spacing: .03em; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { text-align: left; border: .75px solid var(--ink); background: var(--card); padding: 10px 12px; font-size: 14px; line-height: 1.65; display: flex; gap: 10px; }
.opt span { font-family: var(--f-display); font-size: 17px; line-height: 1.45; flex: none; }
.opt:hover:not([disabled]) { background: var(--tint); }
.opt[disabled] { cursor: default; }
.opt.is-pick { box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--tint); }
.opt.is-right { border: 1.5px solid var(--ok); background: var(--ok-soft); }
.opt.is-wrong { border: 1.5px solid var(--bad); background: var(--bad-soft); }
.opt.is-wrong div { text-decoration: line-through; }
.expl { font-size: 14px; line-height: 1.85; padding: 12px 14px; background: var(--tint); }
.expl b { font-family: var(--f-serif); font-weight: 500; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.mode { text-align: left; border: .75px solid var(--ink); padding: 18px; display: grid; gap: 8px; align-content: start; background: var(--card); }
.mode:hover { background: var(--tint); }
.mode b { font-family: var(--f-serif); font-weight: 500; font-size: 18px; letter-spacing: .1em; }
.mode .num { font-family: var(--f-display); font-size: 40px; line-height: 1; }
.mode p { margin: 0; font-size: 13px; color: var(--ink2); line-height: 1.7; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.qbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 5; background: var(--card); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: .75px solid var(--ink); }
.timer { font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--rose-ink); }
.score { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: flex-end; padding: 18px 0; }
.score__big { font-family: var(--f-display); font-size: 84px; line-height: .85; }
.empty { padding: 24px 0; color: var(--ink2); line-height: 1.8; }

/* cards */
.fc { display: grid; gap: 18px; }
.fc__card { border: 1.5px solid var(--ink); padding: 28px; display: grid; gap: 16px; min-height: 260px; align-content: start; background: var(--card); }
.fc__no { font-family: var(--f-display); font-size: 52px; line-height: .9; }
.fc__q { margin: 0; font-family: var(--f-serif); font-size: clamp(18px, 2.4vw, 23px); line-height: 1.6; letter-spacing: .06em; font-weight: 500; }
.fc__a { margin: 0; padding: 16px 0 0 1.3em; border-top: .75px dashed var(--ink); display: grid; gap: 8px; line-height: 1.85; }
.fc__a li::marker { color: var(--rose); }
.fc__ctl { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 22px; height: 22px; border-radius: 999px; border: .75px solid var(--ink); font-family: var(--f-mono); font-size: 9px; display: grid; place-items: center; }
.dot.ok { background: var(--ok); border-color: var(--ok); color: var(--card); }
.dot.no { background: var(--rose); border-color: var(--rose); color: var(--ink); }
.dot.cur { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--ink); }

/* calendar */
.calhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.month { font-family: var(--f-display); font-size: 48px; line-height: 1; }
.month small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .18em; margin-left: 10px; color: var(--ink2); }
.calnav { display: flex; gap: 6px; }
.calnav button { border: .75px solid var(--ink); background: var(--card); padding: 5px 12px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; }
.calnav button[disabled] { opacity: .35; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: .75px solid var(--ink); border-left: .75px solid var(--hair); }
.dow { font-family: var(--f-mono); font-size: 10px; letter-spacing: .16em; padding: 8px; border-right: .75px solid var(--hair); border-bottom: .75px solid var(--hair); color: var(--ink2); }
.day { min-height: 98px; padding: 6px 8px; border-right: .75px solid var(--hair); border-bottom: .75px solid var(--hair); display: grid; align-content: start; gap: 4px; min-width: 0; text-align: left; text-decoration: none; }
a.day:hover { background: var(--tint); }
.day__n { font-family: var(--f-display); font-size: 20px; line-height: 1; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.day__n i { font-style: normal; font-size: 13px; color: var(--rose-ink); }
.day__t { font-size: 11px; line-height: 1.45; color: var(--ink2); overflow-wrap: anywhere; }
.day.is-out { background: var(--paper); }
.day.is-out .day__n { color: var(--ink3); }
.day.is-today { box-shadow: inset 0 0 0 2px var(--rose); }
.day.is-exam { background: var(--ink); color: var(--card); }
.day.is-exam .day__t { color: var(--card); }
.day.is-miss .day__t { color: var(--rose-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--ink2); align-items: center; margin-top: 14px; }
.phases { display: grid; gap: 0; }
.phase { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: .75px solid var(--hair); font-size: 14px; line-height: 1.7; }

<script type="application/json" id="data">{"chapters":[{"id":"ch0","label":"第 0 章","title":"考前須知","sub":"日期、題型、及格標準、試場規則","meta":"依據：115 年度甄試報名簡章、試場規則（113.09.25 修正）","intro":"","secs":[{"id":"ch0-0","no":"0-1","title":"重要日期與題型","html":"<div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>報名截止：115 年 10 月 30 日（五），以郵戳為憑。考試日：115 年 12 月 20 日（日）。考前一週上協會網站（www.hia.org.tw）看最新公告與考場地點。<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>時間<\/th><th>事項<\/th><th>備註<\/th><\/tr><\/thead><tbody><tr><td>10/1–10/30<\/td><td>報名<\/td><td>郵戳為憑<\/td><\/tr><tr><td>12/13 前後<\/td><td>考前一週<\/td><td>看公告、印准考證<\/td><\/tr><tr><td>12/20（日）<\/td><td>考試<\/td><td>13:00 專業／14:30 實務<\/td><\/tr><tr><td>116/2/26（五）<\/td><td>成績公布<\/td><td>協會網站<\/td><\/tr><tr><td>收到成績單 10 日內<\/td><td>複查<\/td><td>200 元、限一次<\/td><\/tr><\/tbody><\/table><\/div><h4>節次與配分<\/h4><div class=\"tbl\"><table><thead><tr><th>節次<\/th><th>時間<\/th><th>科目<\/th><th>題型與配分<\/th><\/tr><\/thead><tbody><tr><td>第一節<\/td><td>13:00～14:00（60 分鐘）<\/td><td>專業（學科）<\/td><td>單選 50 題，每題 2 分，共 100 分<\/td><\/tr><tr><td>第二節<\/td><td>14:30～16:00（90 分鐘）<\/td><td>實務（術科）<\/td><td>單選 25 題 50 分＋簡答 5 題 20 分＋健保申報實例演練 2 題 30 分<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>及格：專業 ≧ 60 分、實務 ≧ 60 分，且總分 ≧ 120 分，三個條件都要達到。<\/p><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>實務科有 50 分是手寫題：單選建議 25 分鐘內寫完，剩 65 分鐘給簡答與申報演練。<\/p><\/div>"},{"id":"ch0-1","no":"0-2","title":"報名重點","html":"<h4>報名資格（三項都要符合）<\/h4><ul><li>協會個人會員，並已依期繳交年度會費<\/li><li>就讀醫療相關科系，或從事健康保險相關工作一年以上<\/li><li>參加協會主辦之健康保險申報人員基礎班，並取得該次完整學分<\/li><\/ul><h4>應繳資料（線上申請＋掛號郵寄）<\/h4><ul><li>① 報名信封封面，黏貼於信封資料袋封面<\/li><li>② 報名表正表，填妥並貼相片<\/li><li>③ 成績通知單，填妥收件人資料<\/li><li>④ 服務證明書（工作一年以上）或醫療相關科系學歷證明影本<\/li><li>掛號寄：23561 新北市中和區中正路 291 號 台灣健康保險協會 收<\/li><\/ul><h4>費用與成績保留<\/h4><ul><li>報名費 800 元；申請單科及格成績保留者 600 元。<\/li><li>劃撥 19306396（戶名：台灣健康保險協會），通訊欄註明會員編號、姓名、繳交甄試報名費用；或轉帳台新銀行建北分行（812）2068-01-0018387-2，並於報名表正表下方註明匯款日期、帳號後 5 碼、金額。<\/li><li>單科成績保留：限 112、113、114 年考過未錄取者之單科及格成績；仍須報名繳費並考未及格科目。報名表沒註明保留科目，視同兩科都要考。<\/li><li>考區分北、中、南區；考區報考不足 20 人得併區。協會電話（02）2249-1056。<\/li><\/ul>"},{"id":"ch0-2","no":"0-3","title":"考試當天","html":"<h4>一定要帶<\/h4><ul><li>國民身分證<\/li><li>准考證（務必自行列印，協會不寄送）<\/li><li>藍色或黑色原子筆（多帶一支）<\/li><li>手錶（非智慧型）<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>手機及具傳輸、掃描、交換或儲存資料功能之電子產品：考試期間嚴禁使用，違者該科零分；務必關機或靜音。<\/p><\/div><h4>時間規則<\/h4><ul><li>預備鈴響 → 依座號就座<\/li><li>考試開始後 <b>15 分鐘內<\/b>才得入場（遲到超過 15 分鐘不能入場）<\/li><li>考試開始後 <b>30 分鐘內<\/b>不得出場<\/li><li>開始鈴響前不得在試卷上書寫；結束鈴響後應立即停筆<\/li><li>規定時間未繳卷者一律收繳<\/li><\/ul><h4>試場規則：會被罰的行為<\/h4><div class=\"tbl\"><table><thead><tr><th>第 5 條：扣考，已考各科成績無效<\/th><th>第 6 條：該科不予計分<\/th><\/tr><\/thead><tbody><tr><td>冒名頂替<\/td><td>誤坐或誤用他人試卷作答<\/td><\/tr><tr><td>互換座位或試卷<\/td><td>裁割試卷用紙、稿紙；在試卷寫姓名或不應有之標記、自備稿紙、污損試卷<\/td><\/tr><tr><td>傳遞文稿、參考資料、有關文字之物件或信號<\/td><td>窺視他人試卷、散發試題後交談，或抄寫試題答案帶出考場<\/td><\/tr><tr><td>夾帶其他書籍及參考文件<\/td><td>開始鈴響前即書寫、結束鈴響後仍作答、繳卷後未即出場<\/td><\/tr><tr><td>在桌椅、文具、肢體等處書寫有關文字<\/td><td>不依試卷、試題說明作答；攜帶規定以外物品<\/td><\/tr><tr><td>不遵守規則、不接受勸導、繳卷後仍逗留擾亂秩序<\/td><td>未經許可擅離試場或移動座位<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>書籍文件應放試場前方或指定場所，不得置於抽屜、桌椅下、座位旁或隨身攜帶，違者依第 5 條第 4 款（夾帶）論處，是扣考，不只是該科不計分。<\/p><\/div><ul><li>入座後把准考證放在桌面左前角，自行檢查試卷上的座號、姓名、科目；有錯立即告知監場人員。<\/li><li>繳卷須經監場人員驗收試卷及試題後才可出場；試題與答案卷需一併繳回，未繳回或毀損者該科零分。<\/li><li>對試題有疑義，應當場提出。<\/li><\/ul>"},{"id":"ch0-3","no":"0-4","title":"考試範圍與章節對應","html":"<div class=\"tbl\"><table><thead><tr><th>簡章範圍<\/th><th>對應章節<\/th><\/tr><\/thead><tbody><tr><td>專業 1. 全民健康保險概論<\/td><td>第 4 章＋附錄 A<\/td><\/tr><tr><td>專業 2. 全民健康保險法及相關法規<\/td><td>第 4、7 章＋附錄 A<\/td><\/tr><tr><td>專業 3. 醫療費用支付標準<\/td><td>第 6 章<\/td><\/tr><tr><td>專業 4. 藥品、特材相關法規與審查注意事項<\/td><td>第 5 章＋附錄 A<\/td><\/tr><tr><td>專業 5. 支付制度之相關規定<\/td><td>第 1、4 章<\/td><\/tr><tr><td>專業 6. 疾病分類發展與應用<\/td><td>第 3 章<\/td><\/tr><tr><td>專業 7. 資訊安全管理法規<\/td><td>第 2 章（今年新列範圍）<\/td><\/tr><tr><td>實務 1. 就醫相關作業規定<\/td><td>第 8 章＋附錄 A<\/td><\/tr><tr><td>實務 2. 醫療費用申報作業<\/td><td>第 6、8 章＋最終章<\/td><\/tr><tr><td>實務 3. DRG 支付制度申報作業<\/td><td>第 1、8 章＋最終章<\/td><\/tr><tr><td>實務 4. 特殊診療項目及藥材事前審查<\/td><td>第 6、7 章<\/td><\/tr><tr><td>實務 5. 醫療費用審查及申復、爭審<\/td><td>第 5、7 章<\/td><\/tr><tr><td>實務 6. 健保申報資訊安全管理應用<\/td><td>第 2 章<\/td><\/tr><\/tbody><\/table><\/div><h4>112 年考題分布（專業 50＋實務 25）<\/h4><div class=\"tbl\"><table><thead><tr><th>主題<\/th><th>題數<\/th><\/tr><\/thead><tbody><tr><td>Tw-DRG（第 1 章）<\/td><td>12<\/td><\/tr><tr><td>支付標準（第 6 章）<\/td><td>9<\/td><\/tr><tr><td>健保概論、支付制度（第 4 章）<\/td><td>9<\/td><\/tr><tr><td>審查辦法（第 7 章）<\/td><td>7<\/td><\/tr><tr><td>專業審查（第 5 章）<\/td><td>6<\/td><\/tr><tr><td>申報格式（第 8 章）<\/td><td>4<\/td><\/tr><tr><td>疾病分類（第 3 章）<\/td><td>4<\/td><\/tr><tr><td>講義未涵蓋（附錄 A）<\/td><td>24<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--more\" data-key=\"1\"><span class=\"box__k\">延伸<\/span><p>資安 112 年 0 題，但今年新列範圍；「講義未涵蓋」多為健保法、醫療辦法、藥事、政策趨勢。<\/p><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>隨機抽樣回推，立意抽樣不回推。<\/p><\/div>"}]},{"id":"ch1","label":"第 1 章","title":"Tw-DRG 住院診斷關聯群支付制度","sub":"沿革、分類架構、支付原則","meta":"講師：魏秀美（臺北榮總醫務企管部）｜112 年專業 10 題、實務 2 題，全卷最多","intro":"","secs":[{"id":"ch1-0","no":"1-1","title":"DRG 發展沿革","html":"<h4>法源依據（健保法）<\/h4><div class=\"tbl\"><table><thead><tr><th>條文<\/th><th>內容重點<\/th><\/tr><\/thead><tbody><tr><td>第 42 條第 1 項<\/td><td>支付標準以相對點數反應各項服務成本，以同病、同品質同酬為原則；得以論量、論病例、論品質、論人或論日等方式訂定。<\/td><\/tr><tr><td>第 60 條<\/td><td>每年度醫療給付費用總額：主管機關於年度開始 6 個月前擬訂範圍 → 諮詢健保會 → 報行政院核定。<\/td><\/tr><tr><td>第 61 條第 1 項<\/td><td>健保會於年度開始 3 個月前，在行政院核定範圍內協議訂定總額及其分配方式，報主管機關核定。<\/td><\/tr><\/tbody><\/table><\/div><h4>政策目的 vs. 設計原則<\/h4><div class=\"tbl\"><table><thead><tr><th>政策目的：提升價值<\/th><th>設計原則：穩健過渡<\/th><\/tr><\/thead><tbody><tr><td>提升效率、減少浪費：包裹式給付，改善論量計酬缺點<\/td><td>保障重症、減少衝擊<\/td><\/tr><tr><td>促進流程優化與品質：鼓勵導入臨床路徑<\/td><td>維持總額點值穩定<\/td><\/tr><tr><td>建立品質可比較性：統一支付制度，跨院公平透明<\/td><td>總點數中平原則：實施前後整體醫療費用總點數保持平衡<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>Tw-DRGs 適用範圍：限住院案件（112 實務第 20 題答「住診」）。<\/p><\/div><h4>發展進程<\/h4><div class=\"tbl\"><table><thead><tr><th>時間<\/th><th>事件<\/th><\/tr><\/thead><tbody><tr><td>84.3<\/td><td>健保開辦，論病例計酬 54 項（占住院費用 11%）<\/td><\/tr><tr><td>91.4<\/td><td>第 1 版 499 項<\/td><\/tr><tr><td>93.10／94.9<\/td><td>第 2／3 版 976／969 項<\/td><\/tr><tr><td>99.1 第一階段<\/td><td>170 項上路，占費用 17%（水晶體、闌尾切除、疝氣修補）<\/td><\/tr><tr><td>103.7 第二階段<\/td><td>再加 237 項（累計 407 項），占費用 23%（循環、骨骼肌肉、生殖系統）<\/td><\/tr><tr><td>105.1<\/td><td>4.0 版草案 1,700 項<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>現行 3.4 版 1,068 項；第三～五階段尚未實施（112 專業第 36 題：「目前實施到第三階段」為錯）。<\/p><\/div><ul><li>美國 DRG 家族：HCFA-DRGs（Health Care Financing Administration）、CMS-DRGs（Centers of Medicare &amp; Medicaid Services）、MS-DRGs（Medicare Severity DRGs）。<\/li><li>論量（FFS）：做多少給多少 → 資源過度耗用。DRG（包裹）：預先訂定給付標準、「同病同酬」，資源耗用相似者歸同一群，以定額給付。<\/li><li>DRG 核心精神不是限制治療，而是透過預期成本管理鼓勵更有效率的治癒路徑。<\/li><\/ul>"},{"id":"ch1-1","no":"1-2","title":"DRG 分類架構","html":"<ul><li>住院案件 → 主診斷決定落在哪個 MDC → DRG（1,068 項）→ RW 相對權重。<\/li><li>分類依據：疾病診斷、手術種類、併發症／合併症、出院狀況、性別、年齡、體重。25 MDC＋Pre-MDC，以器官系統區分。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>分類三大原則：① 周延互斥 ② 易於管理 ③ DRG 內個案資源耗用相近（組內 variance 小）。<\/p><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>112 專業第 43 題陷阱：「組間差異小」是錯的，應該是<b>組內差異小、組間差異大<\/b>。<\/p><\/div><h4>名詞定義（超高頻考點）<\/h4><div class=\"tbl\"><table><thead><tr><th>名詞<\/th><th>定義／公式<\/th><\/tr><\/thead><tbody><tr><td>MDC 主要診斷類別<\/td><td>以器官及系統分類的大類別：Pre-MDC、MDC 1～MDC 24。講義註明排除 MDC 19（精神疾病）、MDC 20（物質誘發精神病）、MDC 25（HIV 感染）不適用 DRG。<\/td><\/tr><tr><td>RW 相對權重<\/td><td>反映各 DRG 資源耗用情形的指數。RW ＝ 某 Tw-DRG 平均每人次點數 ÷ 全國平均每人次點數<\/td><\/tr><tr><td>CMI 病例組合指標<\/td><td>醫院收治病患疾病嚴重度的總體指數；越高代表病人越複雜。CMI ＝ Σ(RWi × 案件數i) ÷ Σ案件數i<\/td><\/tr><tr><td>SPR 標準給付額<\/td><td>每一權重的全國統一基準價，依「實施前後總點數中平」與「超過上限點數占 5.1%」原則計算。115 年 9–12 月 3.4 版 SPR = 53,793 點（全國平均點數 57,804）<\/td><\/tr><tr><td>下限臨界點<\/td><td>該 DRG 醫療服務點數之 2.5 百分位。低於下限 → 核實申報（實支實付）<\/td><\/tr><tr><td>上限臨界點<\/td><td>以總點數中平計算；全國超額總支付點數占率 5.1%；附表 7.3 上限為醫療點數之 90 百分位<\/td><\/tr><tr><td>幾何平均住院日<\/td><td>依相對權重計算範疇，排除不適用案件。用於 AAD／轉院的論日支付<\/td><\/tr><tr><td>HBR<\/td><td>以疾病嚴重度校正後之平均住院費用。HBR ＝ 某醫院所有個案平均費用 ÷ 某醫院 CMI<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>112 專業第 22 題：RW 不是「嚴重度指數」（那是 CMI）；SPR 不是「平均點數比值」（那是 RW）；CMI 不是「各 DRG 資源耗用」（那是 RW）。✔ 正確：MDC 為 Pre-MDC、MDC1～24。<\/p><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>「以疾病嚴重度校正後之平均住院費用」＝ HBR（112 專業第 48 題）。<\/p><\/div><h4>編審順序<\/h4><ul><li>① Pre-MDC 優先攔截：心、肝、肺、骨髓、胰移植，氣管造口術<\/li><li>② MDC 24 多重外傷：主診斷為外傷，且至少 2 個不同部位外傷（頭、胸、腹、骨盆）<\/li><li>③ MDC 1～23 常規分流：外科系（P）優先看 ORP，內科系（M）無手術室處置<\/li><\/ul><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>編審依序：Pre-MDC → MDC 24 → MDC 1–23；複合條件（AND／WITH 連結 2 項以上）優先於單一條件。<\/p><\/div><ul><li>Pre-MDC 中 48201、48202、48301、48302（氣管造口）若同時符合 MDC1～24 之條件，以權重高者認定。<\/li><li>Pre-MDC DRG：心臟移植 10301-10302、肝 48001-48002、骨髓 48101-48102、肺 49501-49502、胰 512、氣管造口 48201-48202（臉口頸疾患）／48301-48302（其他）；腎臟移植屬 MDC 11（30201-30202）。<\/li><\/ul><h4>主要診斷／次要診斷／主要處置<\/h4><div class=\"tbl\"><table><thead><tr><th>主要診斷（Principal Dx）<\/th><th>次要診斷（Secondary Dx）<\/th><\/tr><\/thead><tbody><tr><td>引起此次住院醫療的主要原因<\/td><td>影響照護、延長住院或增加護理監視的病況<\/td><\/tr><tr><td>僅限 1 個；多重診斷時取醫療資源耗用高者<\/td><td>健保申報最多可達 19 個<\/td><\/tr><tr><td>住院中產生的併發症（術後感染）或跌倒，不得為主要診斷<\/td><td>入院前存在或住院中發展皆可<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>主要處置依據主要診斷來選，而非把治療性處置都列為主要處置。<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>情境<\/th><th>主處置選擇<\/th><th>例子<\/th><\/tr><\/thead><tbody><tr><td>主／次診斷皆有治療性處置<\/td><td>選與主診斷相關者<\/td><td>PTCA＋跌倒股骨骨折（ORIF）→ PTCA<\/td><\/tr><tr><td>主／次皆有治療與診斷處置<\/td><td>選主診斷的治療性處置<\/td><td>乳癌（乳房切除）＋ORIF → 乳房切除<\/td><\/tr><tr><td>主只有診斷性、次有治療<\/td><td>選主診斷的診斷性處置<\/td><td>十二指腸潰瘍（胃鏡）＋ESRD（血液透析）→ 胃鏡<\/td><\/tr><tr><td>主無處置、次有處置<\/td><td>選次診斷之處置<\/td><td>腰椎 HIVD＋ESRD（血液透析）→ 血液透析<\/td><\/tr><\/tbody><\/table><\/div><h4>合併症／併發症（CC）<\/h4><ul><li>Complication 併發症：入院前不存在、住院後才發生。Comorbidity 合併症：入院前已存在。<\/li><li>Significant CC：次診斷預期會使 ≥ 75% 病人住院日延長至少 1 天。<\/li><li>主診斷符合附表 7.1.4.2 所列者，不論有無次診斷，皆視為「合併症或併發症」。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>有效 CC 的判斷邏輯：<b>次診斷對主診斷的關係<\/b>（112 實務第 24 題）。<\/p><\/div><h4>附表一覽<\/h4><div class=\"tbl\"><table><thead><tr><th>附表<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>7.1<\/td><td>Tw-DRGs 分類表（MDC 目錄）<\/td><\/tr><tr><td>7.1.1／7.1.2<\/td><td>診斷碼／手術處置碼編碼限制<\/td><\/tr><tr><td>7.1.3<\/td><td>各 MDC 主診斷碼<\/td><\/tr><tr><td>7.1.4<\/td><td>合併症或併發症診斷碼（7.1.4.1、7.1.4.2）<\/td><\/tr><tr><td>7.1.5<\/td><td>主診斷與手術不相關 DRG<\/td><\/tr><tr><td>7.1.6<\/td><td>MDC2 複雜性診斷<\/td><\/tr><tr><td>7.1.7／7.1.8<\/td><td>MDC15 Major／Minor Problem<\/td><\/tr><tr><td>7.1.9／7.1.10<\/td><td>MDC22 Significant Trauma／MDC24 各部位外傷診斷碼<\/td><\/tr><tr><td>7.1.11／7.1.12<\/td><td>DRG 流程圖／MDC8 開放、閉鎖性骨折<\/td><\/tr><tr><td>7.2／7.3<\/td><td>科系對照表（P 外科、M 內科）／權重表<\/td><\/tr><\/tbody><\/table><\/div><h4>編碼限制代號<\/h4><div class=\"tbl\"><table><thead><tr><th>代號<\/th><th>意義<\/th><th>代號<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>F<\/td><td>限女性<\/td><td>M<\/td><td>限男性<\/td><\/tr><tr><td>B<\/td><td>依性別進不同 MDC（如 N393）<\/td><td>H<\/td><td>限新生兒（&lt;12 個月）<\/td><\/tr><tr><td>I<\/td><td>限 0～17 歲<\/td><td>J<\/td><td>限女性 9～64 歲<\/td><\/tr><tr><td>K<\/td><td>限 15～124 歲<\/td><td>N<\/td><td>不能為主診斷<\/td><\/tr><tr><td>V<\/td><td>無次診斷時不可為主<\/td><td>O<\/td><td>不允許為主診斷<\/td><\/tr><tr><td>Q<\/td><td>避免為主診斷<\/td><td>X<\/td><td>非屬健保給付範圍<\/td><\/tr><\/tbody><\/table><\/div><ul><li>手術碼限制（7.1.2）：Y＝Operating Room Procedure（ORP）、N＝Non-ORP、F 限女性、M 限男性、X 非屬健保給付範圍之處置。<\/li><li>附表 7.3 權重表（115 年 9–12 月）：無權重者 74 項 → 核實申報；個案數 &lt;20（201 項）→ 暫以核實申報；邏輯註記 44 項；DRG 513 = SPR × 權重，不得加成；資料期間 113.01–113.12。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>性別影響 DRG 落點：MDC 12 男性生殖系統、MDC 13 女性生殖系統（112 專業第 25 題答 MDC 12）。E25.x、Q56.0–Q56.4、F64.1、Z87.890 不檢查性別。<\/p><\/div><h4>主要診斷與手術不相關的 DRG<\/h4><div class=\"tbl\"><table><thead><tr><th>DRG<\/th><th>名稱<\/th><\/tr><\/thead><tbody><tr><td>468（46801-46804）<\/td><td>與主要診斷無關的廣泛性手術<\/td><\/tr><tr><td>476（47601-47602）<\/td><td>與主要診斷無關的攝護腺手術<\/td><\/tr><tr><td>477（47701-47704）<\/td><td>與主要診斷無關的非廣泛性手術<\/td><\/tr><\/tbody><\/table><\/div><ul><li>判斷：只有 1 個 ORP 且在 477 表列 → 477；2 個以上且都在 477 表列 → 477；2 個以上但只有一個在 477 表列 → 468；都不在 477 表列 → 468。<\/li><\/ul><h4>不適用 DRG（維持論量計酬）<\/h4><div class=\"tbl\"><table><thead><tr><th>疾病類別排除<\/th><th>重大處置排除<\/th><th>狀態與計畫排除<\/th><\/tr><\/thead><tbody><tr><td>癌症、性態未明腫瘤<\/td><td>臟器移植併發症及後續住院<\/td><td>住院日超過 30 日<\/td><\/tr><tr><td>精神科（MDC 19、20）<\/td><td>葉克膜 ECMO（5A15223）<\/td><td>住院安寧療護<\/td><\/tr><tr><td>愛滋病、罕見疾病、凝血因子異常<\/td><td>主動脈內氣球幫浦 IABP<\/td><td>試辦計畫<\/td><\/tr><tr><td>生產合併植入性胎盤／產後大出血（自然產 &gt;500 ml、剖腹產 &gt;1000 ml）<\/td><td>複雜性多重骨盆腔器官脫垂及重建<\/td><td>非屬醫院總額範圍<\/td><\/tr><\/tbody><\/table><\/div><h4>不適用註記（d102）代碼<\/h4><div class=\"tbl\"><table><thead><tr><th>代碼<\/th><th>意義<\/th><th>代碼<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Tw-DRGs 案件<\/td><td>9<\/td><td>住院 30 日內未出院之切帳（仍為健保給付）<\/td><\/tr><tr><td>1<\/td><td>主診斷為癌症、性態未明腫瘤<\/td><td>A<\/td><td>30 日內切帳且出院之非 DRG 案件<\/td><\/tr><tr><td>2<\/td><td>臟器移植併發症及後續住院<\/td><td>B<\/td><td>非屬醫院總額範圍<\/td><\/tr><tr><td>3<\/td><td>MDC19、MDC20 精神科<\/td><td>C<\/td><td>未實施之 Tw-DRGs 案件<\/td><\/tr><tr><td>4<\/td><td>愛滋病、凝血因子異常<\/td><td>D／E<\/td><td>機構代號改變（舊／新代號）或停約切帳<\/td><\/tr><tr><td>5<\/td><td>罕見疾病<\/td><td>F<\/td><td>使用葉克膜 ECMO<\/td><\/tr><tr><td>6<\/td><td>試辦計畫、安寧療護<\/td><td>G<\/td><td>原屬 DRG 暫以論量申報<\/td><\/tr><tr><td>7<\/td><td>住院超過 30 日（急性＋慢性）<\/td><td>J／K／L<\/td><td>IABP／高危險生產／骨盆腔多器官重建<\/td><\/tr><tr><td>8<\/td><td>案件分類改變之切帳<\/td><td>M／N<\/td><td>HTA 論量申報／多胎一胎自然產其餘改剖腹<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"ch1-2","no":"1-3","title":"DRG 支付原則","html":"<ul><li>實際醫療點數落在哪一區，決定怎麼給付。下限臨界點 2.5 百分位、上限臨界點 90 百分位。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>區<\/th><th>條件<\/th><th>支付方式<\/th><\/tr><\/thead><tbody><tr><td>A 區<\/td><td>低於下限臨界點<\/td><td>實支實付<\/td><\/tr><tr><td>B1／B2 區<\/td><td>介於上下限之間<\/td><td>定額 = RW × SPR ×（1＋基本診療＋CMI＋兒童＋山地離島加成）<\/td><\/tr><tr><td>C 區<\/td><td>超過上限臨界點<\/td><td>定額＋超過上限部分 × 80%<\/td><\/tr><\/tbody><\/table><\/div><ul><li>特例：&lt;18 歲先天性疾病或腦麻個案，超過上限部分 100% 全額支付。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>實際醫療費用低於下限臨界點 → 實支實付（核實申報）（112 專業第 44 題）。<\/p><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>下限 2.5、上限 90；低於下限照實付，超過上限多的打八折。<\/p><\/div><h4>加成率一覽<\/h4><div class=\"tbl\"><table><thead><tr><th>基本診療加成（醫院層級）<\/th><th>加成<\/th><th>CMI 值<\/th><th>CMI 加成<\/th><\/tr><\/thead><tbody><tr><td>醫學中心<\/td><td>7.1%<\/td><td>&gt;1.1 且 ≦1.2<\/td><td>1%<\/td><\/tr><tr><td>區域醫院<\/td><td>6.1%<\/td><td>&gt;1.2 且 ≦1.3<\/td><td>2%<\/td><\/tr><tr><td>地區醫院<\/td><td>5.0%<\/td><td>&gt;1.3<\/td><td>3%<\/td><\/tr><tr><td>兒童年齡<\/td><td>MDC15<\/td><td>非 MDC15 內科<\/td><td>非 MDC15 外科<\/td><\/tr><tr><td>&lt;6 個月<\/td><td>91%<\/td><td>66%<\/td><td>23%<\/td><\/tr><tr><td>≧6 個月，&lt;2 歲<\/td><td>23%<\/td><td>21%<\/td><td>9%<\/td><\/tr><tr><td>≧2 歲，≦6 歲<\/td><td>15%<\/td><td>10%<\/td><td>10%<\/td><\/tr><\/tbody><\/table><\/div><ul><li>保障不同年齡兒童於全部 DRG 導入支付點數增加 15%。山地離島地區醫院加成 2%。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>CMI ≦ 1.1 沒有加成（112 專業第 29 題 D「CMI &gt;1.0 ≦1.1 加成 1%」為錯）。<\/p><\/div><h4>核實申報項目（DRG 定額之外另計）<\/h4><div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>呼吸器使用<\/td><td>依時數分級：&lt;24h、24–96h、&gt;96h（PCS 第 6 碼 Device 5 = Ventilation；第 5 碼 3/4/5 代表時數）<\/td><\/tr><tr><td>洗腎費用<\/td><td>處置碼含洗腎（5A1D70Z、5A1D80Z、5A1D90Z）＋核實申報代碼 58001C。間歇性每週 3 次、每次約 4 小時；CRRT 連續 &gt;18 小時（58007C、58014C、58018C）；延長間歇 6–18h（58030B）<\/td><\/tr><tr><td>其他<\/td><td>雙胞胎以上新生兒費、安胎費用、癌症放化療、生物製劑<\/td><\/tr><tr><td>新增診療項目且無替代既有項目<\/td><td>無法做點數差額校正 → 自實施日起核實申報（附表 2）；核實申報迄日之次日起回到 DRG 內申報<\/td><\/tr><tr><td>全新功能類別／改良功能特材<\/td><td>使用量不同或占率高且價差大 → 另行核實申報（附表 3）<\/td><\/tr><\/tbody><\/table><\/div><h4>特材 Add-on 與自費代碼<\/h4><ul><li>特材單價 &lt; 3 萬點：特材管理費加計 5%；≧ 3 萬點：特材管理費定額 1,500 點。<\/li><li>Add-on 第 1 類（新特材導致術式改變）：暫以論量申報，87 項。Add-on 第 2 類（術式不變）：DRG 定額＋額外加計點數，1,053 項。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>醫令類別<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>D<\/td><td>被替代之健保給付特材<\/td><\/tr><tr><td>E<\/td><td>自費特材－未支付<\/td><\/tr><tr><td>F<\/td><td>自費特材－不符給付規定<\/td><\/tr><tr><td>H／X<\/td><td>HTA 自費診療項目<\/td><\/tr><\/tbody><\/table><\/div><ul><li>HTA 期間或評估後不納入給付之項目：不適用註記填「M」，手術費及特材由民眾全額自費，其他住院費用仍以論量向健保申請（不得要求民眾自費）。<\/li><\/ul><h4>費用涵蓋範圍、AAD／轉院<\/h4><ul><li>DRG 給付已包含當次住院所有相關服務與藥物費用。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>不得移轉至門診、急診，不得拆次住院；違反者整筆醫療費用不予支付。<\/p><\/div><ul><li>一般自動出院（AAD）或轉院：住院日數 &lt; 該 DRG 幾何平均住院日，且實際費用介於上下限臨界點 → 論日支付。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>論日支付 ＝ Tw-DRG 支付定額 ÷ 該 DRG 幾何平均住院日 × 實際住院日數。<\/p><\/div><h4>Tw-DRGs 專業審查 7 大重點<\/h4><ul><li>入院或主手術（處置）必要性<\/li><li>診斷與處置之適當性<\/li><li>診斷與處置編碼正確性<\/li><li>出院狀況是否穩定<\/li><li>醫療品質之適當性<\/li><li>超過上限臨界值（Outlier）費用之適當性<\/li><li>住院範圍相關費用之轉移<\/li><\/ul><div class=\"box box--more\" data-key=\"1\"><span class=\"box__k\">延伸<\/span><p>DRG 新制下的困境：自負額提高（自費特材增加）、健保給付不足（重症成本虧損）、醫療品質滑落（提前出院、分次手術）、人球危機（高風險病人被推諉）。112 專業第 3 題：醫院經營對策是病歷記載完整（不是提高住院日、延後出院）。<\/p><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>同類手術 1、半、半、零。<\/p><\/div>"}]},{"id":"ch2","label":"第 2 章","title":"健保申報業務之資安管理實務","sub":"個資法、資安法、ISO、事故應變","meta":"講師：毛政賢（北醫附醫醫品部）｜112 年無此科考題，115 年新列範圍","intro":"<div class=\"box box--more\" data-key=\"1\"><span class=\"box__k\">延伸<\/span><p>今年新列入：專業科「資訊安全管理法規」、實務科「健保申報業務資訊安全管理應用」。重點在個資法條文、特種個資、罰則金額、CIA 三要素、事故應變步驟。<\/p><\/div>","secs":[{"id":"ch2-0","no":"2-1","title":"個資與資安風險、威脅","html":"<div class=\"tbl\"><table><thead><tr><th>攻擊者類型<\/th><th>資安事故對醫院的損害<\/th><\/tr><\/thead><tbody><tr><td>外部：競爭對手、駭客（Lamer／Script Kids、Ethical hacker、Cracker）<\/td><td>形象受損：病患信任下降<\/td><\/tr><tr><td>內部：粗心大意的員工、心生不滿的員工<\/td><td>財務損失：贖金、業務中斷（付錢也不一定能拿回資料）<\/td><\/tr><tr><td>醫院常見事故原因：硬體老舊、軟體未更新、員工誤開釣魚信、駭客利用漏洞攻擊內網<\/td><td>個資外洩受罰：依個資法裁罰<\/td><\/tr><\/tbody><\/table><\/div><h4>全球資安威脅六大類（111 年報告）<\/h4><ul><li>1. 社交工程技術多樣化，詐騙盛行（釣魚、魚叉式、AI／深偽）<\/li><li>2. 雲端環境複雜性產生風險（如惡意檔放雲端硬碟分享）<\/li><li>3. IoT 與行動裝置弱點威脅升高<\/li><li>4. 關鍵基礎設施與 OT 設施鎖定式攻擊<\/li><li>5. 資安供應商遭駭，破壞供應鏈安全<\/li><li>6. 勒索軟體攻擊激增（RaaS 勒索軟體即服務、間歇性加密）<\/li><\/ul><div class=\"box box--more\" data-key=\"1\"><span class=\"box__k\">延伸<\/span><p>WEF 2022 調查最關注前三名：勒索軟體、社交工程、惡意內部使用者。不要告訴 ChatGPT 等 AI 的 5 種資訊：身分、醫療、財務、登入憑證、公司機密；可關閉「改善模型」、使用「臨時交談」、提出「個資刪除」請求。<\/p><\/div><h4>醫事第一線常見風險情境<\/h4><div class=\"tbl\"><table><thead><tr><th>作業情境<\/th><th>潛在風險<\/th><th>可能後果<\/th><\/tr><\/thead><tbody><tr><td>系統查詢健保資料、病人個資<\/td><td>弱密碼、未登出<\/td><td>帳號遭盜用、竄改資料<\/td><\/tr><tr><td>撈取／下載大量資料<\/td><td>查詢範圍過大、未控管<\/td><td>集中外洩、擴大損害<\/td><\/tr><tr><td>列印病人或帳務資料<\/td><td>紙本遺失、隨意放置<\/td><td>紙本外洩<\/td><\/tr><tr><td>Email／傳真／LINE 傳送<\/td><td>未加密、誤傳收件人<\/td><td>敏感資料外洩<\/td><\/tr><tr><td>個人電腦、隨身碟存檔<\/td><td>未加密、遺失、中毒<\/td><td>資料遭竊<\/td><\/tr><tr><td>多系統用同一組弱密碼<\/td><td>撞庫<\/td><td>多系統連環遭攻擊<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>違規行為：把病人照片／病況分享到社群；好奇查詢非自己負責的病人；病歷寄私人信箱或帶回家；公共場合討論可識別病況；含個資文件未銷毀就丟棄。<\/p><\/div>"},{"id":"ch2-1","no":"2-2","title":"個資與資安相關法規","html":"<h4>醫療三大法律<\/h4><div class=\"tbl\"><table><thead><tr><th>法律<\/th><th>目的／規範內容<\/th><\/tr><\/thead><tbody><tr><td>醫療法<\/td><td>醫事機構（業務）管理：醫療機構與業務管理、病人權利保護、均衡醫療資源；醫事人員管理：資格、執業、義務、公會<\/td><\/tr><tr><td>個資法<\/td><td>① 避免人格權受侵害 ② 促進個人資料之合理利用<\/td><\/tr><tr><td>資通安全管理法<\/td><td>推動國家資通安全政策，加速建構國家資通安全環境，保障國家安全、維護社會公共利益<\/td><\/tr><\/tbody><\/table><\/div><ul><li>醫療紀錄相關：醫療法、醫療機構電子病歷製作及管理辦法、電子簽章法、個資法。<\/li><li>醫事人員憑證 IC 卡＝醫事人員的「印鑑證明」（權限控管、電子病歷簽章）；健保 IC 卡＝身分辨識與就醫紀錄（須結合醫師卡存取）。<\/li><li>醫院適用：《個資法》《個資法施行細則》《醫院個人資料檔案安全維護計畫實施辦法》。<\/li><\/ul><h4>何謂個資（第 2、6 條）<\/h4><div class=\"tbl\"><table><thead><tr><th>一般個資<\/th><th>特種個資（第 6 條）<\/th><\/tr><\/thead><tbody><tr><td>姓名、出生年月日、身分證統一編號、護照號碼、特徵、指紋、婚姻、家庭、教育、職業、聯絡方式、財務情況、社會活動及其他得以直接或間接識別該個人之資料<\/td><td>病歷、醫療、基因、性生活、健康檢查、犯罪前科<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>特種個資 6 項：「病、醫、基、性、健、犯」（病歷、醫療、基因、性生活、健檢、前科）。<\/p><\/div><ul><li>特種個資原則不得蒐集、處理、利用，例外：① 法律明文規定 ② 執行法定職務／義務所必要且有安全維護措施 ③ 當事人自行公開或已合法公開 ④ 公務機關或學研機構基於醫療、衛生或犯罪預防目的之統計／學術研究，且無從識別當事人 ⑤ 經當事人書面同意（但逾越特定目的必要範圍不得僅依同意）。<\/li><\/ul><h4>個資法的行為定義<\/h4><div class=\"tbl\"><table><thead><tr><th>行為<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>蒐集<\/td><td>以任何方式取得個人資料<\/td><\/tr><tr><td>處理<\/td><td>為建立或利用個資檔案所為之記錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結或內部傳送<\/td><\/tr><tr><td>利用<\/td><td>將蒐集之個資為處理以外之使用<\/td><\/tr><tr><td>國際傳輸<\/td><td>將個資作跨國（境）之處理或利用<\/td><\/tr><\/tbody><\/table><\/div><h4>重要條文速查<\/h4><div class=\"tbl\"><table><thead><tr><th>條文<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>§3<\/td><td>當事人權利（不得預先拋棄）：查詢或請求閱覽、請求製給複製本、補充或更正、停止蒐集處理利用、請求刪除<\/td><\/tr><tr><td>§8<\/td><td>向當事人蒐集時應告知機關名稱、目的、當事人權利等<\/td><\/tr><tr><td>§19、§20<\/td><td>非公務機關蒐集處理須有特定目的；利用須在特定目的必要範圍內（目的外利用須符合例外）<\/td><\/tr><tr><td>§22<\/td><td>主管機關得派員進入檢查，可率資訊、電信、法律專業人員；非公務機關不得規避、妨礙或拒絕<\/td><\/tr><tr><td>§27<\/td><td>非公務機關保有個資檔案應採適當安全措施，防止竊取、竄改、毀損、滅失或洩漏；主管機關得指定訂定安全維護計畫<\/td><\/tr><tr><td>施行細則 §12<\/td><td>適當安全措施＝技術上及組織上之措施：配置管理人員、風險評估、事故預防通報應變、稽核、使用紀錄軌跡保存、設備安全管理等（具適當比例原則）<\/td><\/tr><tr><td>§29<\/td><td>民事損害賠償：非公務機關違法致當事人受害應賠償，但能證明無故意或過失者不在此限（舉證責任倒置）<\/td><\/tr><tr><td>§48<\/td><td>行政罰（2023.05.31 修正，改為直接處罰並加重）<\/td><\/tr><\/tbody><\/table><\/div><h4>罰則（§48 第 2、3 項，2023.05.31 修正）<\/h4><div class=\"tbl\"><table><thead><tr><th>舊法（修正前）<\/th><th>新法（現行）<\/th><\/tr><\/thead><tbody><tr><td>① 先限期改正<\/td><td>① 直接處 2 萬～200 萬＋限期改正<\/td><\/tr><tr><td>② 屆期未改正 → 按次處 2 萬～20 萬<\/td><td>② 屆期未改正 → 按次處 15 萬～1,500 萬<\/td><\/tr><tr><td>—<\/td><td>③ 情節重大 → 15 萬～1,500 萬＋限期改正，屆期未改正按次處罰<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>個資法罰則：從「先改正再罰」變成「直接罰＋限期改正」。一般 2 萬～200 萬；屆期未改正或情節重大 15 萬～1,500 萬。<\/p><\/div><h4>兩種責任<\/h4><ul><li>民事損害賠償（§29）：公務機關＝無過失責任（除天災、事變、不可抗力）；非公務機關＝舉證責任倒置（由被告證明有適當安全措施）。<\/li><li>行政裁罰（§48）：故意或過失皆罰。<\/li><li>民事責任 4 個思考點：① 被害人個資是否來自該業者 ② 業者是否有故意、過失 ③ 財產損害與侵害行為是否有相當因果關係 ④ 被害人是否與有過失、非財產上損害。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>公務機關＝無過失責任；非公務機關（醫院）＝舉證責任倒置的過失責任。<\/p><\/div><ul><li>行政檢查常態化（2023.03 行政院精進措施）：事前＝常設個資行政檢查小組、每年例行檢查；事中＝知悉重大矚目案件後 <b>3 日內<\/b>行政調查、<b>10 日內<\/b>完成調查報告，數位部參與；事後＝限期改正、§25 處分、高風險事業檢查。<\/li><\/ul><h4>個資保護八大原則（OECD）<\/h4><div class=\"tbl\"><table><thead><tr><th>原則<\/th><th>內容<\/th><th>原則<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>限制蒐集<\/td><td>合法手段取得、得當事人同意<\/td><td>目的明確<\/td><td>目的明確並在目的內使用<\/td><\/tr><tr><td>限制利用<\/td><td>不得為目的外利用<\/td><td>內容正確<\/td><td>正確、完整、更新（§11）<\/td><\/tr><tr><td>安全保護<\/td><td>適當安全防護（§12、18、27）<\/td><td>公開<\/td><td>公開蒐集處理利用作法（§7-9）<\/td><\/tr><tr><td>個人參加<\/td><td>當事人得行使權利（§3 等）<\/td><td>責任<\/td><td>資料擁有者負法律遵循責任<\/td><\/tr><\/tbody><\/table><\/div><h4>資通安全管理法體系<\/h4><ul><li>資通安全責任等級分級辦法（分級提報）→ 施行細則（訂定資安維護計畫）→ 特定非公務機關資安維護計畫實施情形稽核辦法（稽核、改善報告）→ 資通安全情資分享辦法 → 資通安全事件通報及應變辦法（通報、事件調查改善報告）→ 公務機關所屬人員資通安全事項獎懲辦法。<\/li><\/ul>"},{"id":"ch2-2","no":"2-3","title":"常見資安事件案例","html":"<div class=\"tbl\"><table><thead><tr><th>案例類型<\/th><th>情境<\/th><th>防護建議<\/th><\/tr><\/thead><tbody><tr><td>網通設備疏於更新<\/td><td>舊韌體漏洞被植入 Mirai 殭屍網路<\/td><td>定期更新韌體；汰換已停止支援產品<\/td><\/tr><tr><td>弱密碼遭暴力破解<\/td><td>密碼 Aa123456 或與帳號相似，帳號被用來寄惡意信<\/td><td>清查停用未使用帳號；符合密碼複雜性<\/td><\/tr><tr><td>撞庫攻擊<\/td><td>從其他外洩來源取得帳密，嘗試登入其他服務<\/td><td>不同系統用不同密碼、多因子驗證<\/td><\/tr><tr><td>社交工程郵件<\/td><td>Webmail 零時差漏洞 XSS、偽冒機關信箱<\/td><td>注意寄件來源，勿開不明附件連結<\/td><\/tr><tr><td>Google 表單蒐集個資<\/td><td>表單權限設定錯誤，個資可公開瀏覽<\/td><td>檢查分享權限<\/td><\/tr><tr><td>變臉詐騙（BEC）<\/td><td>假冒主管或合作夥伴要求轉帳<\/td><td>電話二次確認<\/td><\/tr><tr><td>廠商維護疏失<\/td><td>廠商被駭成為跳板；金鑰免密碼登入<\/td><td>遠端存取「原則禁止、例外允許」、多因子、短天期、結束後關閉並換密碼<\/td><\/tr><tr><td>勒索軟體<\/td><td>加密檔案、竊取資料、索取贖金；可在內網橫向蔓延<\/td><td>備份、斷網、通報<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>\"The security is as strong as the weakest link\"：系統安全強度＝最弱的環節（通常是人）。<\/p><\/div>"},{"id":"ch2-3","no":"2-4","title":"醫院的防護與因應","html":"<h4>資訊安全三要素 CIA<\/h4><div class=\"tbl\"><table><thead><tr><th>要素<\/th><th>意義<\/th><th>例子<\/th><\/tr><\/thead><tbody><tr><td>機密性 Confidentiality<\/td><td>只有被授權者能取用<\/td><td>① 驗證 ② 授權 ③ 加密<\/td><\/tr><tr><td>完整性 Integrity<\/td><td>僅授權者可更改<\/td><td>數位簽章<\/td><\/tr><tr><td>可用性 Availability<\/td><td>授權者隨時可存取<\/td><td>重複建置、容錯移轉<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>CIA：機密性（驗證、授權、加密）、完整性（數位簽章）、可用性（重複建置、容錯移轉）。<\/p><\/div><h4>制度面：個資保護工作<\/h4><div class=\"tbl\"><table><thead><tr><th>平時維護<\/th><th>事故發生時<\/th><th>事故發生後<\/th><\/tr><\/thead><tbody><tr><td>訂定個資檔案安全維護計畫、配置管理人員、界定個資範圍、風險評估、事故通報應變機制、內部管理程序、資安防護、教育訓練、保存軌跡紀錄、委外監督<\/td><td>採取應變補救措施、通報主管機關、通知當事人<\/td><td>改善安全措施、改善蒐集處理利用方式、更新安全維護計畫<\/td><\/tr><tr><td>具體作為<\/td><td>內容<\/td><td><\/td><\/tr><tr><td>資料盤點<\/td><td>個資種類；蒐集、處理、利用目的；目的消失之刪除銷毀<\/td><td><\/td><\/tr><tr><td>人員管理<\/td><td>取用權限、儲存媒介物、保密義務、離職人員管理<\/td><td><\/td><\/tr><tr><td>教育訓練<\/td><td>所屬人員、負責人及個資管理人員，<b>每年至少一次<\/b><\/td><td><\/td><\/tr><tr><td>記錄保存<\/td><td>蒐集處理利用紀錄、軌跡資料、執行安全維護計畫之證據，<b>至少 5 年<\/b><\/td><td><\/td><\/tr><tr><td>委外監督<\/td><td>契約載明監督內容；請廠商繳自評表、稽核廠商。未監督→廠商外洩業主也要負責<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><ul><li>適當安全措施 11 項依 PDCA：Plan（配置人員資源、界定範圍、風險評估、事故預防通報、內部管理程序）→ Do（資料安全管理與人員訓練、認知宣導、設備安全管理）→ Check（資料安全稽核、使用紀錄軌跡證據保存）→ Action（整體持續改善）。<\/li><\/ul><h4>管理面<\/h4><ul><li>第三方資訊系統：ISO 27001 資訊安全管理系統驗證。<\/li><li>營運持續管理 BCM：地震、火災、斷電、系統故障時盡速回復關鍵業務；事前預防準備 → 緊急應變 → 業務持續 → 復原，維持「最小可接受服務水準」。<\/li><li>資產管理與 IoT：定期盤點（含網通、門禁、攝影機）、導入 VANS 弱點通報機制、啟用時第一時間更改預設帳密、不購買來源不明品牌。<\/li><li>委外管理：遵循 SSDLC 安全軟體開發生命週期；上線前資安檢測；最小權限原則。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>密碼：大小寫＋特殊符號、長度至少 12 碼、不可與前 3 次相同。<\/p><\/div><h4>緊急應變：資安事故發生時 7 步驟<\/h4><div class=\"tbl\"><table><thead><tr><th>①<\/th><th>②<\/th><th>③<\/th><th>④<\/th><th>⑤<\/th><th>⑥<\/th><th>⑦<\/th><\/tr><\/thead><tbody><tr><td>中斷網路連線<\/td><td>關機並拔插頭<\/td><td>緊急宣導、清查<\/td><td>評估災情、備份<\/td><td>保存現場求協助<\/td><td>系統格式化重灌<\/td><td>報案通報＋通知<\/td><\/tr><\/tbody><\/table><\/div><ul><li>涉及個資外洩：向檢警報案、通報主管機關、通知當事人。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>螢幕出現勒索畫面要求付比特幣：❌ 自己處理、只告訴同事、繼續操作；✅ 立即停止操作、不關機（講義此情境）、拔網路線或關 Wi-Fi、撥資訊緊急電話等待指示。<\/p><\/div><ul><li>要立即通報的狀況：中毒／勒索、帳號疑遭盜用、個資疑外洩、設備遺失、系統異常、已點擊釣魚連結。<\/li><\/ul>"},{"id":"ch2-4","no":"2-5","title":"個人的保護行為","html":"<div class=\"tbl\"><table><thead><tr><th>密碼<\/th><th>做法<\/th><\/tr><\/thead><tbody><tr><td>❌ 不要<\/td><td>生日、手機號、姓名縮寫；多系統同密碼；便利貼；共用帳號；超過 6 個月未換<\/td><\/tr><tr><td>✅ 要<\/td><td>≥12 碼含大小寫、數字、符號；每系統不同密碼（密碼管理器如 KeePass）；雙重驗證 2FA<\/td><\/tr><\/tbody><\/table><\/div><ul><li>資料保存：BitLocker 加密、敏感資料加密傳送與遮罩、開啟稽核紀錄、去識別化。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>3-2-1 備份原則：至少 3 份、2 種媒體、1 份異地，並定期檢查可還原。<\/p><\/div><ul><li>蒐集：無特定目的不蒐集、最小化原則、不逾越必要範圍、與目的有正當合理關聯；特種個資需書面同意。<\/li><li>處理：不交給不相干人員、確保正確、遵守資安規定、桌面淨空、廢棄徹底銷毀。<\/li><li>利用：不逾越特定目的；他機關索取需述明目的與法令依據，交付取簽收；最小化或去識別化；公務盡量不家辦。<\/li><\/ul><h4>HIS 使用原則<\/h4><div class=\"tbl\"><table><thead><tr><th>原則<\/th><th>行為要求<\/th><\/tr><\/thead><tbody><tr><td>最小授權原則<\/td><td>只看「有需要」的，不是「有權限」就能看<\/td><\/tr><tr><td>離席鎖定<\/td><td>Win+L；螢幕防窺片<\/td><\/tr><tr><td>列印管控<\/td><td>不遺留在印表機<\/td><\/tr><tr><td>查詢記錄<\/td><td>所有查詢都有 Log，異常會被稽核<\/td><\/tr><tr><td>禁止截圖外傳<\/td><td>不得拍攝螢幕傳個人裝置或社群<\/td><\/tr><tr><td>LINE 風險<\/td><td>不傳病人姓名、病歷號、病況照片；用院內加密通訊；「院長」要轉帳務必電話確認<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"id":"ch3","label":"第 3 章","title":"疾病分類通則簡介與申報規定","sub":"ICD-10-CM／PCS、主次診斷","meta":"講師：賴淑芬｜112 年專業 4 題（CM 代碼結構、PCS 7 位碼、新增章節、死因統計）","intro":"","secs":[{"id":"ch3-0","no":"3-1","title":"疾病分類概論","html":"<ul><li>疾病分類：將疾病診斷及處置資訊編碼整合，產生統計性分類資料。疾病分類員（coder）參照病歷摘要、主訴、病史、檢驗報告、會診單等，把醫師的診斷與處置轉譯為代碼。例：Ca. of lung、Pulmonary ca.、Lung carcinoma 都編 C34.90。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>法源<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>醫療法第 67 條<\/td><td>病歷應清晰、詳實、完整；包括醫師病歷、檢查檢驗報告、其他醫事人員紀錄；醫院應製作各項索引及統計分析<\/td><\/tr><tr><td>醫療法施行細則第 49 條<\/td><td>醫院、診所對疾病之診斷，應依國際疾病傷害及死因分類之規定<\/td><\/tr><tr><td>醫院評鑑基準 1.4.7<\/td><td>建立疾病與手術檢索系統<\/td><\/tr><\/tbody><\/table><\/div><ul><li>重要性：疾病登記、院際國際統計比較、臨床研究教學、衛生政策、醫院經營決策與品質指標、保險醫療給付依據。<\/li><li>有效分類系統的必備條件：由單一分類原則衍生、內容包括每一疾病或處置、編碼內容周延互斥（Mutually exclusive）。<\/li><\/ul><h4>國際與臺灣沿革<\/h4><div class=\"tbl\"><table><thead><tr><th>用途<\/th><th>沿革<\/th><\/tr><\/thead><tbody><tr><td>死因統計<\/td><td>1952-60 ICD-6 → ICD-7／ICD-8 → 1981-2008 ICD-9 → 2008～ ICD-10<\/td><\/tr><tr><td>疾病分類（健保申報）<\/td><td>1995.1 ICD-9-CM（1992 版）→ 2004.1 ICD-9-CM（2001 版）→ 2016.1 ICD-10-CM/PCS（2014 版）→ 2025.1 2023 年版<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>死因統計用 ICD-10（WHO 版）；健保疾病申報用 ICD-10-CM/PCS（美國臨床修訂版）（112 專業第 49 題）。<\/p><\/div><ul><li>各國 ICD-10 修訂版：澳洲 AM、加拿大 CA、德國 GM、韓國 KM、泰國 TM、美國 CM（2015.10.1）、臺灣 CM（2016.1.1）。<\/li><li>美國維護分工：NCHS（國家衛生統計中心）負責疾病代碼 CM；CMS 負責處置代碼 PCS；AHIMA 負責教育訓練、專業認證；AHA 出版 Coding Clinic（官方編碼指引）。每年版本 10 月 1 日公布，隔年 1 月 1 日實施。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>ICD-10-CM<\/th><th>ICD-10-PCS<\/th><\/tr><\/thead><tbody><tr><td>用途<\/td><td>疾病、外傷、中毒診斷<\/td><td>處置、手術<\/td><\/tr><tr><td>發展<\/td><td>NCHS（依 WHO ICD-10）<\/td><td>CMS（依 ICD-9-CM 第三冊發展）<\/td><\/tr><tr><td>位數<\/td><td>3～7 碼，小數點在第 3 碼後<\/td><td>固定 7 碼<\/td><\/tr><tr><td>代碼數<\/td><td>約 69,823<\/td><td>約 71,957<\/td><\/tr><tr><td>適用<\/td><td>門、住診<\/td><td>門、住診<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"ch3-1","no":"3-2","title":"ICD-10-CM","html":"<h4>21 章<\/h4><div class=\"tbl\"><table><thead><tr><th>章<\/th><th>名稱<\/th><th>章<\/th><th>名稱<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>感染症與寄生蟲 A00-B99<\/td><td>12<\/td><td>皮膚及皮下組織 L00-L99<\/td><\/tr><tr><td>2<\/td><td>腫瘤 C00-D49<\/td><td>13<\/td><td>肌肉骨骼及結締組織 M00-M99<\/td><\/tr><tr><td>3<\/td><td>血液、造血、免疫 D50-D89<\/td><td>14<\/td><td>生殖泌尿 N00-N99<\/td><\/tr><tr><td>4<\/td><td>內分泌營養代謝 E00-E89<\/td><td>15<\/td><td>妊娠分娩產褥 O00-O9A<\/td><\/tr><tr><td>5<\/td><td>精神與行為 F01-F99<\/td><td>16<\/td><td>周產期病況 P00-P96<\/td><\/tr><tr><td>6<\/td><td>神經系統 G00-G99<\/td><td>17<\/td><td>先天畸形染色體異常 Q00-Q99<\/td><\/tr><tr><td>7<\/td><td>眼及附屬器 H00-H59<\/td><td>18<\/td><td>症狀、徵候、異常發現 R00-R99<\/td><\/tr><tr><td>8<\/td><td>耳及乳突 H60-H95<\/td><td>19<\/td><td>損傷、中毒 S00-T88<\/td><\/tr><tr><td>9<\/td><td>循環系統 I00-I99<\/td><td>20<\/td><td>罹病外因 V00-Y99<\/td><\/tr><tr><td>10<\/td><td>呼吸系統 J00-J99<\/td><td>21<\/td><td>影響健康狀況及使用醫療服務因素 Z00-Z99<\/td><\/tr><tr><td>11<\/td><td>消化系統 K00-K95<\/td><td>|<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h4>代碼結構<\/h4><div class=\"tbl\"><table><thead><tr><th>位置<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>第 1～3 碼（類目碼）<\/td><td>類別，例 J12<\/td><\/tr><tr><td>第 4～6 碼<\/td><td>病源、解剖部位、嚴重度<\/td><\/tr><tr><td>第 7 碼（擴充）<\/td><td>產科、外傷、外因<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>CM 至少 3 碼、最多 7 碼；類目碼 A00～Z99 大多依解剖學為分類主軸，腫瘤以病因學為主軸；代碼有第 7 位碼而未編到第 7 位，即不是有效代碼（112 專業第 10 題答「以上皆是」）。<\/p><\/div><ul><li>代碼列表（Tabular List）：類目碼 3 碼、次類目碼 4 或 5 碼、代碼 4～7 碼。<\/li><li>.8 = Other specified（其他特定）：病歷資料詳細但無特定代碼可表示時用。<\/li><li>.9 = Unspecified（未明示）：病歷資料不足、無法得到更明確代碼時用。<\/li><li>保留碼 X（Placeholder）：代碼不足 7 碼但需要第 7 碼時，空位填 X，例 S02.0XXA（顱骨骨折）。<\/li><\/ul><h4>工具書與索引<\/h4><div class=\"tbl\"><table><thead><tr><th>工具<\/th><th>排列方式／重點<\/th><\/tr><\/thead><tbody><tr><td>疾病與損傷索引<\/td><td>依疾病英文字母排列；關鍵字為黑體字，依「狀況」找（急性十二指腸潰瘍 → Ulcer）；次要字內縮；圓括弧內為非必要修飾語，不影響代碼。第 21 章常用關鍵字：Admission、Aftercare、Examination、History、Status、Vaccination<\/td><\/tr><tr><td>腫瘤列表<\/td><td>依解剖部位排列，六欄：惡性原發、惡性續發、原位癌、良性、性態未明、未明示<\/td><\/tr><tr><td>藥物及化學物質列表<\/td><td>依藥名字母排列，六欄：意外誤食、自殺、他人下毒、未確定、副作用、低劑量。未知意圖視為意外<\/td><\/tr><tr><td>外因碼索引<\/td><td>主要字及修飾語表示意外型態、事故車輛、發生地點等（如 Fall from a chair）<\/td><\/tr><tr><td>疾病代碼列表<\/td><td>依代碼排列<\/td><\/tr><\/tbody><\/table><\/div><h4>指引性註解（Notes）<\/h4><div class=\"tbl\"><table><thead><tr><th>註解<\/th><th>意義<\/th><th>例<\/th><\/tr><\/thead><tbody><tr><td>Use additional code 使用附加碼<\/td><td>病因碼優先、病癥需加附加碼完整描述；若有合併碼則用合併碼<\/td><td>組織胞漿菌病＋I39／I32<\/td><\/tr><tr><td>Code also 亦需編碼<\/td><td>需兩個代碼才能完整描述，不指定順序，依實際情形決定主診斷<\/td><td>H26.211＋H20.11<\/td><\/tr><tr><td>Code first 優先編碼<\/td><td>病因碼必須優先於病徵碼；標題含 \"in diseases classified elsewhere\" 的代碼絕不能當第一個或主診斷<\/td><td>高血壓致左心衰 I11.0＋I50.1；阿茲海默失智 G30.9＋F02.80<\/td><\/tr><tr><td>Excludes 1 \"Not coded here!\"<\/td><td>互斥，不可同時使用（如同一狀況的先天 vs. 後天）<\/td><td>橫膈疝氣<\/td><\/tr><tr><td>Excludes 2 \"Not included here\"<\/td><td>不同病況，不包含在內，可同時使用（如急、慢性）<\/td><td>先天性乳房畸形／胸肌缺損<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>Excludes 1＝互斥、不可同時編；Excludes 2＝不包含在此、可以同時編。<\/p><\/div><h4>一般編碼通則<\/h4><ul><li>症狀、徵候（R00-R99）：屬疾病過程常規症狀 → 不需編（Pneumonia with fever 不編 R50.9）；非疾病常規症狀 → 需編（高血壓引起鼻出血：I10＋R04.0）。<\/li><li>合併碼（Combination code）：單一代碼可表示兩個診斷就用合併碼（第 2 型糖尿病神經病變 E11.40）；無法完整表達就再加編（糖尿病 CKD stage 4 加 N18.4）。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>第 7 碼<\/th><th>照護時機（損傷、骨折、中毒章）<\/th><\/tr><\/thead><tbody><tr><td>A Initial encounter 初期照護<\/td><td>積極性治療，如手術、急診、初次評估治療<\/td><\/tr><tr><td>D Subsequent encounter 後續照護<\/td><td>癒合或恢復期例行照護，如換石膏、移除固定物、追蹤<\/td><\/tr><tr><td>S Sequela 後遺症<\/td><td>損傷直接造成的併發症，如燒傷後疤痕<\/td><\/tr><\/tbody><\/table><\/div><ul><li>損傷碼構成：損傷部位＋損傷型態＋側性＋第 7 碼。<\/li><\/ul>"},{"id":"ch3-2","no":"3-3","title":"ICD-10-PCS","html":"<div class=\"tbl\"><table><thead><tr><th>碼<\/th><th>名稱<\/th><th>0FT44ZZ 範例<\/th><\/tr><\/thead><tbody><tr><td>① Section<\/td><td>章節<\/td><td>0 Medical and Surgical<\/td><\/tr><tr><td>② Body System<\/td><td>系統分類<\/td><td>F 肝膽胰<\/td><\/tr><tr><td>③ Root Operation<\/td><td>手術目的／術式<\/td><td>T Resection<\/td><\/tr><tr><td>④ Body Part<\/td><td>手術部位<\/td><td>4 膽囊<\/td><\/tr><tr><td>⑤ Approach<\/td><td>手術途徑<\/td><td>4 經皮內視鏡<\/td><\/tr><tr><td>⑥ Device<\/td><td>裝置物<\/td><td>Z 無裝置<\/td><\/tr><tr><td>⑦ Qualifier<\/td><td>修飾詞<\/td><td>Z 無修飾<\/td><\/tr><\/tbody><\/table><\/div><ul><li>0FT44ZZ = 腹腔鏡膽囊切除術；0DTJ4ZZ 腹腔鏡闌尾切除。<\/li><li>可用值 34 個：數字 0–9＋英文字母（不含 I 和 O，避免與 1、0 混淆）。<\/li><\/ul><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>PCS 7 碼：章、系、術、部、途、裝、修。第 3 碼是 Root Operation，不是 Body Part（112 專業第 23 題）。<\/p><\/div><h4>第 1 碼 Section<\/h4><div class=\"tbl\"><table><thead><tr><th>代碼<\/th><th>章節<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Medical and Surgical 內外科<\/td><\/tr><tr><td>1–9<\/td><td>內外科相關：1 產科、2 外在裝置置放、3 輸液、4 測量監測、5 體外輔助、6 體外療法、7 整骨、8 其他、9 按脊<\/td><\/tr><tr><td>B–H<\/td><td>輔助章節：B 影像、C 核醫、D 放射腫瘤、F 復健與聽力、G 心理衛生、H 藥物濫用治療<\/td><\/tr><tr><td>X<\/td><td>New Technology 新技術（美國 2021 年版新增）<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>美國 2021 年版新增 Section X = New Technology（112 專業第 26 題）。<\/p><\/div><h4>第 5 碼 Approach（手術途徑）<\/h4><div class=\"tbl\"><table><thead><tr><th>代碼<\/th><th>途徑<\/th><th>例<\/th><\/tr><\/thead><tbody><tr><td>X<\/td><td>External 外部<\/td><td>Foley exchange<\/td><\/tr><tr><td>0<\/td><td>Open 開放性<\/td><td>ORIF<\/td><\/tr><tr><td>3<\/td><td>Percutaneous 經皮<\/td><td>腰椎穿刺<\/td><\/tr><tr><td>4<\/td><td>Percutaneous Endoscopic 經皮內視鏡<\/td><td>LC<\/td><\/tr><tr><td>7<\/td><td>Via Natural/Artificial Opening<\/td><td>Foley placement<\/td><\/tr><tr><td>8<\/td><td>Via Natural/Artificial Opening Endoscopic<\/td><td>子宮鏡<\/td><\/tr><tr><td>F<\/td><td>經自然開口＋經皮內視鏡輔助<\/td><td>LAVH<\/td><\/tr><\/tbody><\/table><\/div><h4>第 3 碼 Root Operation（31 種術式）<\/h4><div class=\"tbl\"><table><thead><tr><th>類別<\/th><th>術式（代碼）<\/th><\/tr><\/thead><tbody><tr><td>取出身體部位的部份或全部（5）<\/td><td>Excision 部分切除 B、Resection 全部切除 T、Extraction 拔除 D、Destruction 破壞 5、Detachment 截肢 6<\/td><\/tr><tr><td>從身體取出固體／液體／氣體（3）<\/td><td>Drainage 引流 9、Extirpation 摘除 C、Fragmentation 擊碎 F<\/td><\/tr><tr><td>切割或分離（2）<\/td><td>Division 分開 8、Release 鬆解 N<\/td><\/tr><tr><td>置入、放回或轉移（4）<\/td><td>Reattachment 重接 M、Reposition 復位 S、Transfer 轉移 X、Transplantation 移植 Y<\/td><\/tr><tr><td>改變管狀部位直徑或路徑（4）<\/td><td>Bypass 繞道 1、Dilation 擴張 7、Occlusion 閉塞 L、Restriction 縮窄 V<\/td><\/tr><tr><td>與裝置物有關（6）<\/td><td>Insertion 植入 H、Replacement 置換 R、Change 更換 2、Revision 矯正 W、Removal 移除 P、Supplement 強化 U<\/td><\/tr><tr><td>檢查（2）<\/td><td>Inspection 視查 J、Map 繪圖 K<\/td><\/tr><tr><td>其他目的（3）<\/td><td>Alteration 整形 0、Creation 創建 4、Fusion 融合 G<\/td><\/tr><tr><td>其他修補（2）<\/td><td>Control 控制 3、Repair 修補 Q<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>Excision＝切除部分（Diagnostic 修飾詞＝切片 biopsy，如肝切片、部分腎切除）；Resection＝切除全部（全腎切除、肺葉全切）。Alteration＝改善外觀不影響功能（拉皮、隆乳）。<\/p><\/div><ul><li>第 6 碼 Device：移植物與義肢、植入物、電子裝置；Z = No device。<\/li><li>第 7 碼 Qualifier：明示處置特性；冠狀動脈繞道時第 4 碼＝繞道數量、第 7 碼＝新的血流來源；Biopsy 用 Diagnostic。<\/li><li>不同 Section 各碼意義不同（例如 Imaging 第 3 碼為 Type）。<\/li><li>PCS 特性：Completeness 完整性，每個處置都有獨立代碼，每個代碼定義獨特、不重複使用（Bypass Coronary Artery 共 296 個代碼）。<\/li><li>PCS 工具書：Index 索引、Tables 代碼表、List of Codes 代碼列表。表格中不在同一列的選項組合為無效代碼；熟悉時可直接查表格。<\/li><\/ul>"},{"id":"ch3-3","no":"3-4","title":"ICD 與申報及其他應用","html":"<ul><li>編碼要閱讀整本病歷（急診病歷、護理紀錄、醫囑、入出院摘要、病程、開刀、病理、麻醉、檢驗報告），不可只看出院摘要。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>定義（依 UHDDS）<\/th><\/tr><\/thead><tbody><tr><td>主要診斷<\/td><td>經研判後，被確定為引起病人此次住院醫療之主要原因；多重診斷得擇醫療資源耗用高者；住院中產生之併發症或管理不當之危害（跌倒骨折、院內感染）不得為主要診斷<\/td><\/tr><tr><td>次要診斷<\/td><td>入院時已存在或住院中發生，會影響治療或住院日數之情況；與本次住院無關的舊診斷不可列。須經醫師專業判斷明確書寫<\/td><\/tr><tr><td>主要處置<\/td><td>與主要診斷最有關聯；治療性意義大於診斷性或探查性；兩個以上相關時取資源耗用較多、複雜度較高者<\/td><\/tr><tr><td>次要處置<\/td><td>主要處置以外的處置。所有重要處置（具外科本質、麻醉風險、處置風險、需外科特殊訓練）皆須編碼<\/td><\/tr><\/tbody><\/table><\/div><ul><li>例：疝氣入院準備修補，住院跌倒股骨骨折改做骨折復位 → 主診斷仍為疝氣。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>健保住院申報欄位：主診斷 1 個＋次診斷 19 個；主處置 1 個＋次處置 19 個。<\/p><\/div><h4>代碼稽核與應用<\/h4><ul><li>診斷碼／處置碼編碼限制代號同 DRG 附表 7.1.1、7.1.2（見第 1 章）。<\/li><li>105 年 ICD-10-CM/PCS 編碼品質提升獎勵方案指標：① 住診手術代碼對照醫令編碼正確率（醫中 ≥88%、區域 ≥91%、地區 ≥87%）② 主診斷明確率（主診斷英文不含 unspecified：醫中 ≥68%、區域 ≥62%、地區 ≥56%）③ 主診斷編列側性比率（醫中 ≥35%、區域 ≥43%、地區 ≥58%）。<\/li><li>支付相關代碼管控：支付標準（重大傷病、慢性病範圍、給付項目適應症、法定傳染病）、整合計畫（呼吸器依賴、家醫、病人為中心門診整合、安寧共照）、審查注意事項（檔案分析指標、Tw-DRGs 審查指引、醫令自動化審查）、論質計畫、DRG。<\/li><li>外部應用：健保署（給付）、國健署（癌症登記、罕見疾病）、疾管署（傳染病）、衛福部統計處（死因統計）、醫事司（品質與評鑑）。<\/li><\/ul><h4>編碼注意事項<\/h4><ul><li>詳讀病歷：骨折部位、側性、開放或閉鎖；TAE 部位、有無裝置；手術紀錄與術後診斷是否一致。<\/li><li>善用申報醫令交叉檢查：如 75606B 鼠蹊疝氣修補併腸切除 vs. 75607C 無腸切除；58001C 血液透析需有 5A1D70Z。<\/li><li>醫師／專師協助：病歷完整與時效性，診斷模糊時詢問醫師。<\/li><li>異常案件處理：DRG 賺太多或賠太多、編錯碼、分類問題；重視編碼互審。<\/li><\/ul><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>\"If it was not documented, it was not done.\"<\/p><\/div>"}]},{"id":"ch4","label":"第 4 章","title":"全民健保支付制度沿革及實施現況","sub":"多元支付、總額、分區共管","meta":"講師：李妮真（管理部副主任）｜112 年相關題約 9 題，各制度定義、年份、優缺點最常考","intro":"","secs":[{"id":"ch4-0","no":"4-1","title":"全民健保簡介","html":"<div class=\"tbl\"><table><thead><tr><th>制度特色<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>納保<\/td><td>全民納保（強制保險）<\/td><\/tr><tr><td>管理<\/td><td>單一保險人、政府經營<\/td><\/tr><tr><td>財源<\/td><td>以保險費為主＝一般保險費＋補充保險費；保險對象、雇主、政府共同負擔一般保險費；補充收入：菸品健康福利捐、公益彩券分配；另有部分負擔、差額負擔<\/td><\/tr><tr><td>醫療提供者<\/td><td>特約醫療院所，特約率約占全國 93%<\/td><\/tr><tr><td>支付制度<\/td><td>牙醫、中醫、西醫基層、醫院總額、洗腎預算，以論量計酬為主，搭配多元支付<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>健保特色：強制納保、<b>單一保險人<\/b>（不是多元保險人）、財源以保險費為主；主要財源＝保險對象、雇主及政府共同分擔的保險費（112 專業第 41、42 題）。<\/p><\/div><ul><li>給付範圍：疾病、傷害、生育。醫療服務：門診、住院、牙科、分娩、復健、居家照護、慢性病復健。治療照護：診療、檢查／驗、會診、手術、藥劑、材料、處置治療、護理及保險病房。<\/li><\/ul><h4>組織分工<\/h4><div class=\"tbl\"><table><thead><tr><th>單位<\/th><th>職掌<\/th><\/tr><\/thead><tbody><tr><td>中央健康保險署<\/td><td>保險人，辦理保險業務（6 業務組：台北、北區、中區、南區、高屏、東區）<\/td><\/tr><tr><td>全民健康保險會（健保會）<\/td><td>保險費率、給付範圍審議；醫療給付費用總額之對等協議訂定及分配；政策法規研究諮詢；監理<\/td><\/tr><tr><td>全民健保爭議審議會<\/td><td>審議保險人核定之爭議事項<\/td><\/tr><tr><td>衛福部社會保險司<\/td><td>上級主管<\/td><\/tr><\/tbody><\/table><\/div><ul><li>三角關係：民眾繳保費、部分負擔給健保署；健保署向醫療院所購買醫療服務、審查品質；民眾與醫療院所為醫病關係。<\/li><\/ul>"},{"id":"ch4-1","no":"4-2","title":"健保支付制度","html":"<h4>法源依據（健保法）<\/h4><div class=\"tbl\"><table><thead><tr><th>條文<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>第 42 條<\/td><td>支付標準：相對點數反應服務成本，同病、同品質同酬；<b>得以<\/b>論量、論病例、論品質、論人或論日等方式訂定。並得先辦理醫療科技評估 HTA，考量人體健康、醫療倫理、醫療成本效益及本保險財務<\/td><\/tr><tr><td>第 60 條<\/td><td>總額範圍：主管機關年度開始 6 個月前擬訂 → 諮詢健保會 → 報行政院核定<\/td><\/tr><tr><td>第 61 條<\/td><td>健保會年度開始 3 個月前協議訂定總額及分配；不能於期限內協議時，由主管機關決定。得分地區訂門住診分配比率；門診得依醫師、中醫、牙醫、藥事服務、藥品分別設定比率（醫藥分帳）。研商前 7 日公告議程、研商後 10 日內公開出席名單及會議實錄（第 4 項＝分區共管法源）<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>HTA 考量因素不含「政府當年稅收」（112 專業第 9 題）。第 42 條是「得以」論量等方式，不是「應以論量」（112 專業第 20 題）。<\/p><\/div><h4>支付制度演變<\/h4><div class=\"tbl\"><table><thead><tr><th>年份<\/th><th>制度<\/th><\/tr><\/thead><tbody><tr><td>1995<\/td><td>論量＋論病例（開辦，FFS 為主）<\/td><\/tr><tr><td>1998～2002<\/td><td>總額支付：牙醫 98.7 → 中醫 00.7 → 西醫基層 01.7 → 醫院 02.7<\/td><\/tr><tr><td>2001～<\/td><td>論質計酬 P4P：子宮頸癌、乳癌、TB、糖尿病、氣喘<\/td><\/tr><tr><td>2010<\/td><td>Tw-DRGs（目前第二階段，共 407 項）<\/td><\/tr><tr><td>2011<\/td><td>論人計酬試辦 Capitation（100-103 年）<\/td><\/tr><tr><td>2025<\/td><td>前瞻式預算分區共管（Q1 五區／Q2 台北）<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>總額實施順序「牙中基醫」：牙醫 1998.7 → 中醫 2000.7 → 西醫基層 2001.7 → 醫院 2002.7。<\/p><\/div><h4>支付標準架構（九部）<\/h4><div class=\"tbl\"><table><thead><tr><th>部<\/th><th>內容<\/th><th>部<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>第一部<\/td><td>總則<\/td><td>第六部<\/td><td>論病例計酬<\/td><\/tr><tr><td>第二部<\/td><td>西醫<\/td><td>第七部<\/td><td>Tw-DRGs<\/td><\/tr><tr><td>第三部<\/td><td>牙醫<\/td><td>第八部<\/td><td>品質支付服務<\/td><\/tr><tr><td>第四部<\/td><td>中醫<\/td><td>第九部<\/td><td>護理人員投入為主之診療項目表<\/td><\/tr><tr><td>第五部<\/td><td>居家照護及精神疾病患者社區復健<\/td><td>|<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h4>① 論量計酬（Fee for Service）<\/h4><ul><li>1995.3 開辦時的主要支付制度；依實際服務數量申請，做得越多、請的越多。<\/li><li>檢查：已含人員、試藥、內服藥劑、檢驗器材、一般材料、管理費及採檢費；特材另依藥物支付標準申報。<\/li><li>治療處置：已含一般材料、表面麻醉、浸潤麻醉、簡單傳導麻醉。<\/li><li>手術：一般材料費及過程面特材得依表列加計比率；未表列者依所定點數 <b>53%<\/b> 計算（敷料、縫合線、刀片、外用消毒藥劑、生理鹽水、開刀巾等）。<\/li><li>申報規定例：32007C 腹部 X 光連續拍照第二張以後一律八折（200→160 點）；39003C 生物學藥劑注射限抗毒素或血清；47018C 鼻胃管灌食、47020C 胃減壓、47062B 餵食幫浦三者不得同時申報。<\/li><\/ul><h4>② 論病例計酬（Case Payment）<\/h4><ul><li>1995.3 開辦時的輔助支付制度；依病例（主診斷／手術）訂定定額。開辦順序：1995.3.1 陰道生產 → 1995.7.1 自行要求剖腹產 → 1995.9.1 剖腹產。<\/li><li>2010 年住院 46 項轉為 Tw-DRGs 155 項；2014 年 7 月起住院 Case Payment 全數轉為 Tw-DRGs。<\/li><li>目前門診仍有 4 類（8 項）：疝氣手術、震波碎石 ESWL、水晶體摘除及置入、喉直鏡。住院類別：產科（限診所及助產所）、婦科（限診所）。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>基本診療項目需達 <b>65%<\/b>（四捨五入至整數）；選擇性項目已含在定額中不得另報。未依規定完成治療即出院 → 按實際醫療費用申報。未達 65% 時，核減項次＝所訂全部項目中未執行項目 × 其個別執行次數。有 ※ 者為必要執行項目，未執行則整筆不予給付。<\/p><\/div><ul><li>白內障手術需事前專案申請：每月門住診超過 40 例之醫師（2021.12.14 起 40 例以上免事審，第 41 例起 VPN 登錄序號；2022.10.1 起未登錄不予支付）、55 歲以下個案、非眼科專科醫師施行者。<\/li><li>ESWL：需泌尿科專科醫師 2 名以上，醫師需實際操作 50 例以上經驗。<\/li><\/ul><h4>③ 總額預算（Global Budget）<\/h4><div class=\"tbl\"><table><thead><tr><th>型態<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>支出目標制（Target）<\/td><td>容許超出，超出部分打折支付<\/td><\/tr><tr><td>支出上限制（Cap）<\/td><td><b>全民健保採用<\/b>，不容超出，點值＝總預算 ÷ 總點數（浮動點值、回溯計價）<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>P（點值）× Q（申報點數）＝ E（總額）。E 固定，Q 愈大 → P 愈小（同儕制約）。<\/p><\/div><ul><li>總額考量因素：非協商因素（投保人口年增率、人口結構改變率、醫療服務成本指數改變率）；協商因素（給付範圍或支付項目改變、服務利用及密集度改變、預期法令政策改變、專款計畫）；付費者意願與民眾負擔能力（經濟成長率、保費收入成長率、失業率）；非預期法令政策改變可經健保會檢討增減總額。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>點值<\/th><th>公式／項目<\/th><\/tr><\/thead><tbody><tr><td>浮動點值<\/td><td>＝（醫療給付費用總額 − 固定點值總金額）÷ 浮動總點數<\/td><\/tr><tr><td>平均點值<\/td><td>＝ 醫療給付費用總額 ÷ 總醫療點數<\/td><\/tr><tr><td>固定點值（每點 1 元）<\/td><td>藥費、藥事服務費、手術費、麻醉費、血品費、預防保健、專款專用項目<\/td><\/tr><\/tbody><\/table><\/div><ul><li>115 年總額合計約 9,883 億（醫院及門診透析 6,853 億、西醫基層及門診透析 1,862 億、牙醫 584 億、中醫 364 億）；醫院總額一般服務＋專款＋門診透析成長 5.500%、一般服務 5.101%。115Q1 醫院浮動點值 0.9836、平均點值 0.9908（預估）。跨區就醫以前一季全區浮動點值計。<\/li><\/ul><h4>醫院總額「每點 1 元」或保障項目（115 年節錄）<\/h4><div class=\"tbl\"><table><thead><tr><th>順序<\/th><th>項目<\/th><th>順序<\/th><th>項目<\/th><\/tr><\/thead><tbody><tr><td>一<\/td><td>門住診藥事服務費<\/td><td>八<\/td><td>分區偏遠認定原則醫院<\/td><\/tr><tr><td>二<\/td><td>門診手術（案件分類 03、C1，不含 ESWL）<\/td><td>九<\/td><td>地區醫院假日及夜間門診（不含藥費，110.4 起）<\/td><\/tr><tr><td>三<\/td><td>急救責任醫院之急診（案件分類 02）<\/td><td>十、十一<\/td><td>區域級以上 ICU 護理費、診察費、病房費<\/td><\/tr><tr><td>四、五<\/td><td>住診手術費、麻醉費<\/td><td>十二<\/td><td>地區醫院一般病床病房費、診察費、護理費<\/td><\/tr><tr><td>六<\/td><td>血品費（93001C～93023C）<\/td><td>十三<\/td><td>醫院生產案件（114.1 起）<\/td><\/tr><tr><td>七<\/td><td>地區醫院急診診察費<\/td><td>|<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><ul><li>總額外費用：居家照護（A1、A2、A5～A7）、代辦（B6 職災、B7 戒菸、B8 精神科強制住院、B9 孕婦愛滋篩檢、C5 嚴重特殊傳染性肺炎）、預防保健、流感疫苗 D2、愛滋 D1、Pre-ESRD、PAC、在宅急症、UCC 等。<\/li><li>專款專用：罕見疾病藥費／特材、血友病藥費、HIV 藥費、鼓勵器官移植、C 肝用藥、糖尿病／氣喘／BC 肝醫療給付改善方案、醫院支援西醫基層醫療資源缺乏地區、急診品質提升等。<\/li><\/ul><h4>④ 論質計酬（Pay for Performance）<\/h4><ul><li>疾病管理，以費用大、病人多、照護模式有改善空間者優先；支付方式＝FFS＋額外獎勵。<\/li><li>2001.10.1 子宮頸癌 → 2001.11.1 乳癌、肺結核、糖尿病（2012.10.1 納入支付標準）、氣喘 → 2007 高血壓（2013.1 停辦）→ 2010 精神分裂症、BC 肝、呼吸器依賴 → 2010.12.31 初期慢性腎臟病 → 2012 急診品質 → 2013.01.24 Pre-ESRD → 2014 PAC-CVD → 2024.7 在宅急症照護試辦 → 2025.11 UCC → 2026.1 乳癌照護品質提升方案。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>Pre-ESRD 病人照護與衛教計畫屬於論質計酬（112 專業第 45 題）。<\/p><\/div><ul><li>糖尿病：團隊需經地方政府共同照護網認證；新收案 P1407C（650 點）一次、追蹤 P1408C（200 點）至少五次、年度評估 P1409C（800 點）至少二次；當季追蹤率 &lt;20% 經輔導未改善，一年內不得再申報。品質卓越獎（前 25% 醫師）每案 1,000 點、進步獎 500 點。<\/li><\/ul><h4>⑤ 論日計酬（Per diem）<\/h4><ul><li>不論服務多寡，按日支付固定費用。現有：安寧住院、慢性精神病住院、RCW；部分項目可單獨申報（肌少症、洗腎）。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>階段<\/th><th>ICU<\/th><th>RCC 亞急性<\/th><th>RCW 慢性<\/th><th>居家<\/th><\/tr><\/thead><tbody><tr><td>天數<\/td><td>≦21 天<\/td><td>第 22～63 天<\/td><td>第 64 天起<\/td><td>Home Care<\/td><\/tr><tr><td>支付<\/td><td>論量計酬<\/td><td>論日計酬<\/td><td>論日計酬<\/td><td>論日<\/td><\/tr><\/tbody><\/table><\/div><ul><li>呼吸器依賴整合照護：收案 17 歲以上、連續使用呼吸器 21 天以上；結案：脫離成功、病危出院、死亡、轉出。第一～三階段以住院案件申報，各病房異動須獨立切帳；第三階段未結案者至少每 60 天申報一次；第四階段（居家）以門診按月申報。<\/li><li>RCC 醫學中心第 1–21 天 10,647 點／日、第 22–42 天 7,991 點；RCW 第 1–90 天 4,451 點、第 91 天以後 3,674 點；居家 900 點（自備呼吸器 310 點）。<\/li><li>PAC 急性後期照護（腦中風）：採「論日＋論質」；團隊會議收案、結案、定期每 3 週一次；品質獎勵 5 指標各 20 分（出院後 14 日、30 日再入院率、30 日內急診率、功能進步率、可避免住院率），滿分每案 2,000 點、&lt;60 分不獎勵。每日照護費已含診察、病房、護理、檢查、復健費；藥費、藥服費、治療處置、手術、副木、管灌飲食、吞嚥攝影可核實申報。<\/li><\/ul><h4>⑥ 論人計酬（Capitation）試辦（100–103 年）<\/h4><ul><li>依保險對象人數及風險因子事先決定年度支付費用。三種模式：區域整合（由上而下，戶籍人口，如金門醫院）、社區醫療群（由下而上，家醫忠誠病人）、醫院忠誠病人（由上而下）。<\/li><li>民眾不需登記、自由就醫；費用涵蓋西醫基層、醫院門急住診及門診透析，僅排除器官移植術後追蹤、牙醫、中醫；虛擬總額 46 億，每人每年 2.6 萬，結餘 60% 基本獎勵、40% 依指標獎勵。<\/li><\/ul><h4>⑦ Tw-DRGs 重點複習（詳見第 1 章）<\/h4><ul><li>RW＝某 DRG 平均每人次點數 ÷ 全國平均每人次點數；SPR＝全國總點數 ÷ 全國總權重（114 年 7–12 月 53,632；115 年 9–12 月 53,793）。<\/li><li>本章講義導入時程：第 1 階段 99.1.1 共 169 項；第 2 階段 103.7.1 共 238 項（MDC 5、8、12、13、14），暫緩 17 項；共 407 項。（第 1 章講義列 170／237 項，合計同為 407）<\/li><li>不含當次住院前之門、急診費用。<\/li><li>資訊系統提示：DRG 差額為正值＝醫療費用 &lt; DRG 給付；DRG 天數為正值＝住院天數 &lt; 平均住院天數。<\/li><\/ul><h4>多元支付制度優缺點比較（超高頻）<\/h4><div class=\"tbl\"><table><thead><tr><th>制度<\/th><th>優點<\/th><th>缺點<\/th><\/tr><\/thead><tbody><tr><td>論量<\/td><td>反映個案複雜度；報酬依產出；品質較高；執業資料透明；易被醫師接受<\/td><td>缺乏節約誘因、過度提供服務；單價不易訂；申報繁雜、行政成本高；項目愈拆愈細；選高利潤項目<\/td><\/tr><tr><td>論病例<\/td><td>降低成本、控制費用成長；減少服務項目、縮短住院日<\/td><td>疾病歸類困難；同病仍有輕重差異；逆選擇（醫療人球）；減少必要服務；品質下降<\/td><\/tr><tr><td>總額<\/td><td>精確執行預算；提供者預知預算，減少以量制價；協商平衡雙方權益；回溯計價發揮同儕制約；促進資源合理分布<\/td><td>需完整推估與協調；審核不健全時劣幣逐良幣；協商機制不易建立<\/td><\/tr><tr><td>論質<\/td><td>團隊照護追蹤，減少併發症與不必要住院；優良醫院獲獎勵<\/td><td>表現不佳者無改善誘因；指標達成不易<\/td><\/tr><tr><td>論日<\/td><td>申請簡單；減少浪費；財務風險轉嫁院所<\/td><td>未考慮嚴重度，傾向收輕症或延長住院，平均住院日提高<\/td><\/tr><tr><td>論人<\/td><td>財務風險轉嫁院所；重視衛教保健與早期治療；預算易控<\/td><td>選擇健康個案、拒收複雜個案、減少必要服務<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>誰會「延長住院」？論日。誰會「推人球」？論病例、DRG、論人。誰「做越多拿越多」？論量。未來趨勢：包裹支付、論人、論質；論量不是趨勢（112 專業第 46 題）。<\/p><\/div>"},{"id":"ch4-2","no":"4-3","title":"實施現況：臺北分區前瞻式預算分區共管","html":"<ul><li>法源：健保法第 61 條第 4 項。時程：臺北區 114 年第 2 季實施（其他 5 區為 Q1）；參與：臺北區特約醫院（牙醫醫院除外）。<\/li><li>目標點值：臺北 115Q1 0.95、Q2 0.96、Q3 0.965、Q4 0.97；北區、南區、中區 0.985；高屏 0.98；東區 0.95。<\/li><li>基期點數：定基（3～5 年檢討），採 113 年同季結算一般服務收入 ÷ 目標點值；校正藥品給付協議返還金額（PVA/MEA）及生物相似藥／學名藥藥費差額；兩公式擇優。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>不執行<\/th><th>仍執行<\/th><\/tr><\/thead><tbody><tr><td>隨機審查、自主管理效能核減及攤扣<\/td><td>行政審查 REA、立意抽樣（含 CIS）、單價核減、異常專案<\/td><\/tr><\/tbody><\/table><\/div><ul><li>當季一般服務淨點數 &gt; 基期點數（0 階）→ 超額分階核付；個別醫院指標加權成長率（115 年 3.665%）：門診（地區醫院）門診人數 65%、醫師人數 20%、看診醫師人數 15%；住診住院人數 40%、人日 30%、護理人數 20%、CMI 10%。<\/li><li>住診量能下降校正：連續 2 季住院人日下降 15% 且人數成長率低於同儕 → 下修個別額度（排除 6,000 萬點以下、婦兒及精神專科）。<\/li><li>保障項目（23 項）：生產、精神科住院、RCW／RCC、急性腦血管疾病、急性心肌梗塞 Primary PCI、主動脈剝離、ICU 前 7 天（&gt;6 歲）、急診檢傷 1 級、門診放化療、ECMO、IABP、地區醫院 PAC、門診手術、地區醫院慢箋、心臟瓣膜、永久性節律器、CPR、重大創傷（ISS≧16、燒傷 &gt;20%）、罕病、CAR-T、新生兒依附就醫等。同一案件符合多項時以整件優先且僅採計 1 次。<\/li><li>品質補付：保留當季一般服務預算 0.2%；醫中／區域 14 項、地區 9 項、精神 7 項、呼吸照護 3 項、婦兒 4 項指標。<\/li><li>交付處方管理：當季交付點數上限＝前一年同期或 113 年同期 ×1.07 擇高，超出逕予核減（離島醫院不執行）。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>補報期限：各季一般服務費用申報至次季第 2 個月 10 日前，逾期以 0 元核付；重大傷病、身分變更、自墊核退等非歸責醫院者仍維持 6 個月內補報。<\/p><\/div><ul><li>醫院因應：提升保障項目與急重難罕服務、增加自費與總額外服務、多用生物相似藥、跨院轉診綠色通道、減少衝量斷頭點數、即時監測費用。<\/li><li>健保業務資訊來源：健保署全球資訊網（醫療給付、法規公告、Tw-DRGs 專區、總額點值、醫療品質資訊公開）、VPN。<\/li><\/ul>"}]},{"id":"ch5","label":"第 5 章","title":"健保專業醫療審查","sub":"審查注意事項、檔案分析、總額專案管理","meta":"講師：李佳珂（台灣健康保險協會）｜112 年專業 4 題、實務 2 題","intro":"","secs":[{"id":"ch5-0","no":"5-1","title":"健保醫療服務審查制度","html":"<ul><li>審查目的：保險費財源有限屬公共財；使醫療資源被合理使用，提升醫療品質；避免不必要或不適當之服務損害必要及正當服務的報償。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>法源<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>健保法第 62 條<\/td><td>依分配後總額及審查後總點數，核算每點費用（點值）<\/td><\/tr><tr><td>健保法第 63 條<\/td><td>審查重點＝醫療服務項目、數量及品質；遴聘具臨床或相關經驗之醫藥專家審查；得委託專業機構、團體辦理<\/td><\/tr><tr><td>審查辦法第 2 條<\/td><td>醫療服務審查包括程序審查、專業審查、事前審查、實地審查、檔案分析（5 種）<\/td><\/tr><tr><td>審查辦法第 18 條<\/td><td>程序審查 8 項：資格、給付範圍、支付標準正確性、填載完整正確、檢附資料齊全、論病例基本診療項目、事前審查項目、其他<\/td><\/tr><tr><td>審查辦法第 22 條<\/td><td>得採抽樣審查；隨機抽樣等比例回推、立意抽樣不回推；依分析結果得免除抽審、減少隨機、增加立意、加重審查或全審<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>隨機抽樣回推，立意抽樣不回推。<\/p><\/div><ul><li>審查流程：醫療服務 → 費用申報 → 受理作業 → 程序審查 → 快速通關或重點管理（立意抽審 → 隨機抽審 → 專業審查）→ 核付結算；受理後先暫付，前端檢核不過退件。非當期資料走檔案分析 → 抽審 → 專業審查 → 追扣。實地審查可在醫療服務端進行。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>審查方式<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>程序審查<\/td><td>利用電腦檢核申報費用是否符合規定<\/td><\/tr><tr><td>專業審查<\/td><td>病歷抽樣審查（隨機或立意），經由審查醫藥專家專業認定<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>112 專業第 33 題：「專業審查主要是利用電腦檢核」✗，電腦檢核是<b>程序審查<\/b>。<\/p><\/div><h4>審查醫藥專家與委託團體<\/h4><ul><li>來源：專科醫學會、台灣醫院協會、醫師／牙醫師／中醫師公會全國聯合會推薦。<\/li><li>資格：5 年以上教學、臨床或實務經驗；5 年內未受停業、廢止執照處分；5 年內未受停約、終約或不予特約處分。採聘期制，續聘人數以不超過 2/3 為原則。<\/li><li>審畢評量：至少 2 位專家評量，結果不一再請第 3 位，以多數共識為結果。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>總額別<\/th><th>專業審查委託團體<\/th><\/tr><\/thead><tbody><tr><td>醫院總額<\/td><td>台灣醫院協會<\/td><\/tr><tr><td>西醫基層<\/td><td>醫師公會全國聯合會<\/td><\/tr><tr><td>牙醫<\/td><td>牙醫師公會全國聯合會<\/td><\/tr><tr><td>中醫<\/td><td>中醫師公會全國聯合會<\/td><\/tr><\/tbody><\/table><\/div><ul><li>審查精進方向：檔案分析結合隨機抽審、善用自清強化院所自我檢視、導入智能輔助系統提升事前審查效率、精準篩異、建立整體性共識機制。<\/li><li>「專審討論區」：分「醫療費用案件」及「事前審查案件」專區；臨床醫師可查詢過去 6 個月以本人身分證號申報之專審核減初核案件、事前審查部分同意／不同意／補件案件。<\/li><\/ul>"},{"id":"ch5-1","no":"5-2","title":"醫療費用審查注意事項","html":"<div class=\"tbl\"><table><thead><tr><th>收載原則<\/th><th>不收載原則<\/th><\/tr><\/thead><tbody><tr><td>基於法律位階，不逾越支付標準<\/td><td>支付標準或其他法規已明訂者<\/td><\/tr><tr><td>針對支付標準補充解釋、列舉範例<\/td><td>涉及限縮民眾權益或屬支付標準、給付規定性質 → 回歸支付標準規範<\/td><\/tr><tr><td>不同總額同科別朝一致性修訂<\/td><td>訂定項目「應如何申報」者<\/td><\/tr><tr><td>以解剖器官為分科原則（非醫師專科別）<\/td><td>宜列入檔案分析指標者（例：檢驗陽性率不宜低於 60%）<\/td><\/tr><tr><td>涉及多科別之條文訂於一般原則；以醫療服務、藥品、特材支付項目或 Tw-DRGs 為主體 |<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><ul><li>審查依據：健保法及施行細則、健保醫療辦法、審查辦法、支付標準、藥物給付項目及支付標準、特定疾病住院基本要件、藥品及醫療器材許可證等。<\/li><\/ul><h4>總則：病歷與送審<\/h4><ul><li>病歷得以中文或英文記載，應清晰詳實完整；經兩位審查醫藥專家會審仍無法辨識者，由院所事先選擇提供補充說明或逕行核刪。<\/li><li>病歷記載依醫師法第 12 條（首頁＋內容：就診日期、主訴、檢查發現、診斷、處置用藥）；增刪修正依醫療法第 68 條。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>因病歷記載因素而核減，應視其內容缺失不同，<b>予以核減「除診察費外」之缺失相關醫療費用<\/b>（112 專業第 12 題）。<\/p><\/div><ul><li>中醫傷科應敘明理筋推拿手法；針灸應註明穴位，未載明者核扣診察費，處置不當者核扣處置費。<\/li><li>電腦病歷應逐日、逐筆列印黏貼於病歷紙並由醫師簽名或蓋章；或以電子病歷送審。抽審病歷複製本應與正本相符。<\/li><li>申請爭議審議應檢送原送審查之病歷資料（牙科需有保險人章戳）。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>總額別<\/th><th>送審應檢附病歷期間<\/th><\/tr><\/thead><tbody><tr><td>醫院－門診<\/td><td>首頁＋該案當月全部病歷（當月該科有關資料）<\/td><\/tr><tr><td>醫院－住診<\/td><td>首頁＋當次住院全部病歷<\/td><\/tr><tr><td>西醫基層<\/td><td>首頁＋當月全部病歷<\/td><\/tr><tr><td>中醫<\/td><td>首頁＋當月及前一月（前月未就診附前一次）<\/td><\/tr><tr><td>牙醫<\/td><td>首頁含初診日期＋至少 6 個月病歷（初診不需）<\/td><\/tr><\/tbody><\/table><\/div><h4>一般原則（高頻重點）<\/h4><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>急診加成：病人病情緊急需立即檢查且立即得到結果 → 檢查費用加算 <b>20%<\/b>。一般檢驗檢查：接收檢體 → 正式報告記載 <b>1 小時內<\/b>；超音波、內視鏡、特殊造影（CT/MRI）：檢查醫囑時間 → 報告記載 <b>3 小時內<\/b>。<\/p><\/div><ul><li>細菌培養 13007C、血液培養 13016B 等 1 小時後才有結果者不得加成；Blood gas 及急診常規檢查不得加成。<\/li><li>正式報告含「臨床醫師於病歷記載影像判讀時間及結果」；112.9 起門診申報急診加成檢查醫令執行起迄必填至時分。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>規定<\/th><\/tr><\/thead><tbody><tr><td>急診檢傷<\/td><td>依衛福部最新版判定，判定後不宜再修改；病情變化施行 CPR、插管應詳記病程<\/td><\/tr><tr><td>急診／住院會診<\/td><td>急診會診應有正式照會紀錄；住院會診費 02005B 每次住院最多 5 次（急診期間除外），急診暫留床限 1 次<\/td><\/tr><tr><td>心肌酵素<\/td><td>Myoglobin、Troponin、CK/CKMB 不宜同時或重複檢驗<\/td><\/tr><tr><td>手術<\/td><td>應檢附手術同意書及麻醉同意書，未檢附不予支付；核減應註明理由<\/td><\/tr><tr><td>外傷<\/td><td>深部複雜創傷（48004C–48006C）及臉部創傷處置送審應檢附彩色照片（會陰擴創除外）<\/td><\/tr><tr><td>代辦案件<\/td><td>非健保給付範圍（如職災）未以代辦案件申報 → 整筆核刪<\/td><\/tr><tr><td>重大傷病<\/td><td>申報免部分負擔但非與重大傷病相關之診療 → 追扣該筆部分負擔<\/td><\/tr><tr><td>CT／MRI<\/td><td>以「次」為單位，同次多部位僅能申報 1 次；須附申請書、報告、影像；報告需含臨床診斷、檢查目的、病史、理學檢查、其他檢查結果，放射科專科醫師具名及證照號碼；不宜同時做同部位 CT 及 MRI；短期（如 12 週）內再做應敘明；同時做無造影再有造影應報 33072B<\/td><\/tr><tr><td>X-RAY<\/td><td>32015C–32018C 同一對稱部位同一照野（如雙膝 A-P）視為同一診療行為申報 1 次；連續拍攝第二張以上 8 折並以不同醫令申報<\/td><\/tr><tr><td>四肢超音波 19016C<\/td><td>關節內玻尿酸、PRP、增生注射、震波治療不得申報；同部位 6 個月內限 1 次<\/td><\/tr><tr><td>過敏原 30022C<\/td><td>IgE 或 30021C 異常才可做；兩年內不得重複；陽性率不宜低於 60%<\/td><\/tr><tr><td>非必要住院<\/td><td>相關診療亦非必需 → 整筆不予給付；診療仍屬必需 → 核實支付必要項目，住院診察費、病房費、護理費、住院藥事服務費全數核刪，改給門診診察費及門診藥事服務費<\/td><\/tr><tr><td>應轉出 ICU<\/td><td>血行動力學穩定、脫離呼吸器、不需特殊監測、合併症穩定、脫離急性期、家屬要求自動出院；早產兒 &gt;1,500 g 且穩定、腦死不捐贈等<\/td><\/tr><tr><td>依重量長度支付<\/td><td>以手術紀錄之組織重量或長度為依據；依腫瘤大小支付者需附術前量尺比對照片<\/td><\/tr><\/tbody><\/table><\/div><ul><li>論病例計酬處理原則：不符出院狀態改核一般案件；未完成治療即出院按實際費用申報；※ 必要項目未執行整筆不予給付；適應症不符整筆核減或改核一般案件；不當移轉至他次門住診者不予支付不當部分。<\/li><li>CT 案例回饋：108 年 CT 門診核減率 27% 高於住診 12%；核減理由前五名：病歷缺乏具體內容（27%）、未經常規檢查遽做高科技檢查（27%）、非必要檢查（14%）、未詳細理學檢查（12%）、先前檢查已足以診斷（10%）。門診跨院 28 日內再執行 CT/MRI 卻未讀取雲端影像 → 需於 VPN 說明。<\/li><\/ul><h4>各科原則（常考「不得另報」）<\/h4><div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>規定<\/th><\/tr><\/thead><tbody><tr><td>注射技術費<\/td><td>皮下肌肉、小量靜脈注射、IV Push：門診含於診察費、住院含於病房費，不得另報，材料費得另計；6 歲以下小量靜注可報 57111C<\/td><\/tr><tr><td>細菌培養<\/td><td>未長出細菌不可申報藥物敏感試驗<\/td><\/tr><tr><td>手術附帶處置<\/td><td>為達手術最終目的之切開、剝離、摘除、吻合、切片、縫合、灌洗等不另給付；灌洗藥品（BSS）含於一般材料費；附加非治療必須之手術不另給付<\/td><\/tr><tr><td>傷口面積<\/td><td>全身分 7 區（頭頸、軀幹前、軀幹後、四肢），同區傷口長度或面積併計<\/td><\/tr><tr><td>備血<\/td><td>交叉試驗以不超過 2 次為原則，註明「備用血」；輸血套一副<\/td><\/tr><tr><td>ICU 監視器<\/td><td>ICU 費用已包括心電監視器 47032B、無侵害血壓 47033B、血氧監視器 57017C/57018B<\/td><\/tr><tr><td>心臟檢查<\/td><td>心臟超音波與核醫 EF 擇一；心肌灌注掃描 26025B 與心室搏出分率 26044B 擇一；18007C 已含 18006C 精神不宜合併<\/td><\/tr><tr><td>幽門桿菌<\/td><td>13018C 已含採檢，不得另報內視鏡切片 28030C<\/td><\/tr><tr><td>糖尿病用藥<\/td><td>sulfonylureas（如 glimepiride）不可與 meglitinides（repaglinide、nateglinide）合併<\/td><\/tr><tr><td>骨密度<\/td><td>再次檢查間隔一年以上，以 3 次為限；篩檢性不給付<\/td><\/tr><tr><td>B、C 肝超音波<\/td><td>B、C 肝每 6 個月一次、肝硬化每 3 個月一次；非 BC 肝肝功能異常一年一次為原則<\/td><\/tr><tr><td>腫瘤標記<\/td><td>不宜作為癌症篩選；申報超過 1 次以上宜核刪（特殊情況病歷記載）<\/td><\/tr><tr><td>婦產科<\/td><td>子宮切除附帶預防性卵巢切除不得另報；非治療性闌尾、輸卵管切除不給付；結紮、人工授精、試管嬰兒、一般 IUD 置入不給付；妊娠 12 週前流產原則不需住院；剖腹產與子宮切除時會陰沖洗、換藥最多各 3 次；胎心音監視一日超過 6 小時仍以 6 小時計<\/td><\/tr><tr><td>子宮切除範圍<\/td><td>80403B 一般全子宮；80412B 廣泛性（＋子宮旁組織 1/2 內＋部分陰道）；80413B/80414B 根除術（不含骨盆淋巴，併行者 70208B 報 1/2）<\/td><\/tr><tr><td>骨科<\/td><td>以各關節或肢節為手術野；急診手術限：長骨多處骨折、開放性骨折（附照片）、18 歲以下兒童骨折、合併神經血管內臟損傷、急診無法復位需內固定、60 歲以下股骨頸骨折；內固定物拔除住院 ≦7 日；關節鏡手術不再另報 64243B、64244B、28001C<\/td><\/tr><tr><td>ESWL<\/td><td>需附最近 1 個月影像；同一結石間隔一週才可再做；結石最大徑 &gt;0.5 cm；兩側腎結石不可同次；完全鹿角結石首次需事前專案申請<\/td><\/tr><tr><td>耳鼻喉／眼科<\/td><td>鼻部手術鼻填塞含於手術費；雙側耳垢可報 2 次 54001C；整形美容鼻成形自費；間接眼底鏡 23702C 已含散瞳 23803C<\/td><\/tr><tr><td>復健<\/td><td>僅熱敷以 47039C 申報，不得以簡單治療申報；紅外線、紫外線不得以光化治療 51018C 申報<\/td><\/tr><tr><td>麻醉<\/td><td>麻醉中（局部麻醉除外）使用血氧監視器 57017C 每一病例給付一次；96025B、96026B 需附麻醉紀錄及麻醉專科醫師簽章；96004C 靜脈或肌肉麻醉視為全身麻醉；麻醉時間以手術室麻醉開始至手術完畢，住院病患得另加 15 分鐘準備時間<\/td><\/tr><tr><td>兒科<\/td><td>嬰兒肚臍或臀部塗藥含於護理費；O2 tent/hood 二歲以下可每日報 57014B；體重 2,000 g 以下嬰兒需小兒科專科醫師負責；AMBU bag 不宜以 57009B 申報<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>細菌培養未長出細菌，<b>不可<\/b>申報藥敏（112 實務第 7 題）；麻醉中血氧監視器每一病例給付<b>一次<\/b>，不是同日 5 次（112 實務第 10 題）。<\/p><\/div><h4>Tw-DRGs 案件審查<\/h4><div class=\"tbl\"><table><thead><tr><th>DRG 支付型態<\/th><th>支付方式<\/th><th>審查原則<\/th><\/tr><\/thead><tbody><tr><td>費用在上下限臨界點內<\/td><td>定額支付<\/td><td>編碼正確性、醫療服務適當性、該做未做、是否提早出院<\/td><\/tr><tr><td>費用高於上限<\/td><td>定額＋額外支付<\/td><td>編碼正確性、以 FFS 概念審查醫療服務適當性<\/td><\/tr><tr><td>低於下限、無權重、個案
