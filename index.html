&lt;20 核實申報<\/td><td>論量支付<\/td><td>同上<\/td><\/tr><tr><td>論日支付（AAD／轉院）<\/td><td>論日<\/td><td>編碼正確性、醫療服務適當性、住院日數合理性<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>整件不予支付：① 非必要住院及非必要主手術或處置 ② 主手術或處置之醫療品質不符專業認定 ③ 病情不穩定令其出院 ④ 主手術應申請事前審查而未申請或未獲同意 ⑤ 未附病歷摘要或摘要與病歷不符（先輔導，未改善得整件核減）。<\/p><\/div><ul><li>病情不穩定：出院前 24 小時內生命徵象不穩定；併發症未妥善控制；傷口嚴重感染、血腫或出血；排尿困難或導尿管不穩定（洗腎除外）；靜脈點滴、手術引流管未拔除；非因醫療需要之轉院。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>主診斷碼不適當、次診斷或處置碼不適當屬編碼問題，應改碼重新分類，不是整件不予支付（112 專業第 19 題答「非必要住院」）。<\/p><\/div><ul><li>自動出院、轉院個案應於出院病歷摘要詳實註明理由。<\/li><\/ul>"},{"id":"ch5-2","no":"5-3","title":"檔案分析、不予支付理由代碼、抽審指標","html":"<ul><li>檔案分析審查不予支付指標（醫院總額 14 項）：001 眼科門診局部處置申報率、002 婦產科、003 耳鼻喉科門診局部處置、008 門診上呼吸道感染抗生素處方率、010 同一處方制酸劑重複、012／013 CT／MRI 90 日內同部位再執行率過高、014 高血壓併氣喘不適當用藥、016 COX II inhibitor 不當、018 Ginkgo、019 Pipethanate、021 同院同患者 ESWL 次數過高、027 高血壓懷孕婦女用 ACEI/ARB、055 同處方重複開人工淚液。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>代碼<\/th><th>專業審查不予支付理由（西醫）<\/th><th>代碼<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>00<\/td><td>診療品質<\/td><td>05<\/td><td>檢查、檢驗<\/td><\/tr><tr><td>01<\/td><td>病歷紀錄<\/td><td>06<\/td><td>論病例計酬<\/td><\/tr><tr><td>02<\/td><td>基本診療<\/td><td>07<\/td><td>復健治療、精神治療<\/td><\/tr><tr><td>03<\/td><td>藥品、特材<\/td><td>08<\/td><td>其他不符支付或審查規定<\/td><\/tr><tr><td>04<\/td><td>手術、麻醉、處置、血液<\/td><td>09<\/td><td>其他違反相關法令<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>CIS 指標：健保署中央智慧系統篩異指標，作為進行專業審查或調整抽樣的依據（例：112.1 起同院同病人門診 Zolpidem DDD 超量，神經科、精神科 2 倍、其他 1.5 倍）。<\/p><\/div><ul><li>醫院總額抽審指標：13 類、114 項指標（住院案件管理 6、精神科社區復健 5、用藥管控 28、檢驗檢查處置 23、門診就醫次數 3、復健 6、醫師本人眷屬員工自家看診 2、安養住民 3、治療處置及手術 30、模擬 DRG 審查 5、特定處置再執行 1、手術過程不得另報 1、特材不符給付規定 1）。<\/li><li>自清：健保署提供異常明細，院所自行檢視，同意者填「同意核扣點數」，不同意者敘明理由（再進專審）。<\/li><\/ul><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>病房護理費：算進不算出。<\/p><\/div><h4>自清與專案審查案例<\/h4><div class=\"tbl\"><table><thead><tr><th>專案<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>同次手術併報 75801C<\/td><td>為達手術最終目的之處置不得視為副手術另報<\/td><\/tr><tr><td>同日同醫師兩筆診察費<\/td><td>同意者核扣<\/td><\/tr><tr><td>02025B 出院準備及追蹤管理費<\/td><td>仍在住院或轉他院者非出院可申報狀況<\/td><\/tr><tr><td>檢驗結果未上傳<\/td><td>伴隨式診斷（301XX）、NGS（303XX）、12215C、14084C、14085C 未於期限內上傳者不予支付<\/td><\/tr><tr><td>語言治療項數<\/td><td>44005B 中度：2 項以上；44014B 中度複雜：3 項以上；44008B 複雜：4 項以上<\/td><\/tr><tr><td>神經分離術<\/td><td>手術時間 0 時、低於全國中位數；腮腺切除已含神經分離術不得再報 83030B<\/td><\/tr><tr><td>乳房造影 33005B<\/td><td>同日左右不可分開申報；同月不同日比率應 ≦15%<\/td><\/tr><tr><td>肋骨固定系統特材<\/td><td>相鄰 3 根以上節段性骨折（連枷胸）＋ISS ≧16；限胸外、骨科、外傷科專科；每人 3 骨板 18 骨釘；需 T07 重大傷病證明＋CT<\/td><\/tr><tr><td>多次住院名單<\/td><td>同院／跨院住院次數 ≧20（另有年住院次數 ≧24 名單）；善用雲端查詢系統<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>健保署沒有住院日數規定，住院日數由醫師依病情決定；健保醫療辦法第 12 條：經診斷可出院而拒不出院者，費用由保險對象自行負擔。<\/p><\/div>"},{"id":"ch5-3","no":"5-4","title":"專業醫療審查（二）：總額專案管理","html":"<ul><li>健康台灣：10 項國家希望工程＋1 項重點工作；政策從「治療」往前延伸至「預防」；長照 3.0；健康大數據；癌症全人照護；智慧醫療（癌藥事審 FHIR 格式送審）；三高防治 888；高血脂醫療給付改善方案。<\/li><li>個別醫院總額：推動原因是穩定點值、鼓勵品質效率導向整合照護；居家醫療推動藍圖、在宅急症照護試辦計畫（ACAH）；支付改革趨勢＝風險分類及照護品質。<\/li><li>Bundled payments（包裹支付）：對定義的「照護事件」給單一固定費用，鼓勵協調照護、提升品質、控制成本；低於包裹價留存結餘、超過則院所吸收損失。<\/li><li>114 年臨時研商會議：點滴注射及空針特材包裹於住院病房費支付案（暫保留）。<\/li><li>品質指標例：門診檢查合理區間內再執行率（N4_32）、出院準備長照 2.0 評估比率、出院準備轉銜後續醫療銜接率（02025B 及 PAC 結案出院後 30 日內接受居家、PAC、家醫服務）、門診年復健次數 &gt;180 次、可避免住院（AHRQ PQIs，18 歲以上）。<\/li><li>結論：健保法規研讀與系統歸納、跨部門溝通、資訊系統提醒管控、檢視健保署回饋資料、根本原因分析、主動積極、滾動調整。<\/li><\/ul>"}]},{"id":"ch6","label":"第 6 章","title":"全民健保支付標準架構介紹與導讀","sub":"總則、西醫、手術通則、115 年修正","meta":"講師：方心怡｜112 年實務科出題最多（8 題），申報實例演練幾乎都用到本章","intro":"","secs":[{"id":"ch6-0","no":"6-1","title":"法源依據、架構、總則","html":"<div class=\"tbl\"><table><thead><tr><th>法源<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>健保法第 40 條第 1 項<\/td><td>保險醫事服務機構提供醫療服務，應依醫療辦法、醫療服務給付項目及支付標準、藥物給付項目及支付標準辦理<\/td><\/tr><tr><td>健保法第 41 條第 1 項<\/td><td>支付標準由保險人與相關機關、專家學者、被保險人、雇主及保險醫事服務提供者等代表共同擬訂，報主管機關核定發布<\/td><\/tr><tr><td>共同擬訂辦法 §2、§3<\/td><td>至少每 6 個月召開一次共擬會議；代表：主管機關 1、專家學者 2、被保險人 2、雇主 2、醫事服務提供者 31 人<\/td><\/tr><\/tbody><\/table><\/div><ul><li>健保相關給付規定：健保法 → 醫療服務給付項目及支付標準（申報格式及填表說明、審查注意事項、醫療給付改善方案、問答輯／作業規範）＋藥物給付項目及支付標準（藥品給付規定、特殊材料給付規定）。<\/li><li>九部架構：一 總則、二 西醫、三 牙醫、四 中醫、五 居家照護及精神疾病社區復健、六 論病例計酬、七 Tw-DRGs、八 品質支付服務、九 護理人員投入為主之診療項目表。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>總則：總括全本支付標準的原則性說明｜通則：適用個別章節或項目｜註：適用個別醫令代碼。<\/p><\/div><h4>總則重點<\/h4><div class=\"tbl\"><table><thead><tr><th>總則<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>三、精神科專科<\/td><td>評鑑合格之各層級醫院精神科依該院表別；精神科專科教學醫院 → 區域醫院點數；精神科專科醫院 → 地區醫院點數<\/td><\/tr><tr><td>五、核心業務以外<\/td><td>依專任醫師專長、設備及地區需要，從事適用類別以外之診療項目，得定期向保險人申請核可（例：基層診所申請做肌電圖）<\/td><\/tr><tr><td>六、未列項目<\/td><td>依適用類別已列款目中最近似之項目點數申報；新療法須經保險人報中央主管機關核定後實施<\/td><\/tr><tr><td>九、特定計畫<\/td><td>健保會協定年度預算之計畫或方案，依各該計畫支付<\/td><\/tr><tr><td>十、山地離島<\/td><td>依「保險對象免自行負擔費用辦法」規定<\/td><\/tr><tr><td>十二、特定醫療技術<\/td><td>應符合「特定醫療技術檢查檢驗醫療儀器施行或使用管理辦法」<\/td><\/tr><\/tbody><\/table><\/div><h4>須事前審查之診療項目（總則）<\/h4><ul><li>1. 先天性唇顎裂患者無法咀嚼需進行之齒列矯正及正顎手術（非美容，每案上下顎各施行乙次為原則）<\/li><li>2. 白內障手術：未滿 55 歲施行者需事前審查（附術前檢查、中文手術同意書）<\/li><li>3. ESWL：結石最大徑 ≧0.5 cm；&lt;0.5 cm 需明顯阻塞水腫、嚴重血尿或重複絞痛；重複執行率過高（前 30%）醫院符合特定條件者需事前專案申請<\/li><li>4. 交感神經切除術治手汗症：年齡滿 20 歲以上、多年嚴重影響生活<\/li><li>白內障：醫師每月門住診第 41 例以上須於 VPN「白內障手術個案登錄系統」取得登錄完成序號（借用「藥品使用頻率」欄位填報），執行醫事人員代號必填。<\/li><\/ul><h4>總則加成規範（第 14 條）<\/h4><div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>加成<\/th><\/tr><\/thead><tbody><tr><td>地區醫院假日門診<\/td><td>週六、日、國定假日西醫門診（不含急診）第二部診療項目（不含診察費）+30%<\/td><\/tr><tr><td>離島地區住診<\/td><td>離島全院所住診案件，第二、三部各項目 +30%<\/td><\/tr><tr><td>離島急診分級<\/td><td>離島急救責任醫院急診：重度級 +50%、中度級 +30%、一般級 +10%（急診診察費僅能與資源不足加成擇一）<\/td><\/tr><\/tbody><\/table><\/div><h4>天數與年齡定義（總則 15、16 條）<\/h4><div class=\"tbl\"><table><thead><tr><th>期間<\/th><th>每週<\/th><th>1 個月<\/th><th>3 個月<\/th><th>6 個月<\/th><th>12 個月<\/th><th>18 個月<\/th><th>24 個月<\/th><th>每年<\/th><\/tr><\/thead><tbody><tr><td>天數<\/td><td>7 天<\/td><td>30 天<\/td><td>90 天<\/td><td>180 天<\/td><td>365 天<\/td><td>545 天<\/td><td>730 天<\/td><td>日曆年<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>年齡（111.1.1 起）：涉年齡加成 → 門診＝就醫日 − 出生日、住院＝<b>執行日<\/b> − 出生日；其餘年齡限制 → 診療項目實際執行日 − 出生日；未填執行日則以就醫／入院日認定（112 實務第 2 題：住院不是入院日）。<\/p><\/div>"},{"id":"ch6-1","no":"6-2","title":"第二部 西醫","html":"<h4>基本診療：門診診察費<\/h4><ul><li>西醫基層跨院支援：執登於醫院、至診所支援之醫師，當月全國歸戶點數前 10 萬點 ×1、超過部分 ×0.75（例：14 萬點 → 10 萬＋4 萬×0.75 = 13 萬）。免折付：山地離島、醫療資源不足地區；不列入：代辦案件、BC 肝藥費、精神科長效針劑。<\/li><li>115.08 西醫基層門診合理量：每位醫師每日由 40 人調升至 45 人次；1～35 人 364 點、36～45 人 250 點、46～65 人 220 點、66～85 人 160 點；每月看診 22 日以上以 22 日計（原 25 日）。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>門診診察費規定<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>四 院所層級<\/td><td>登記為醫院但未經評鑑或評鑑不合格 → 一律適用「地區醫院」類別<\/td><\/tr><tr><td>五 排程檢查<\/td><td>門診當日開立檢查醫囑、另排其他日期施行或轉檢者，檢查當日不得申報診察費（檢查中因病情需要併施行其他處置視為另次診療，得申報一次）<\/td><\/tr><tr><td>六 預防保健<\/td><td>接受預防保健服務時由同一診治醫師併行一般診療 → 不得另報診察費（孕婦產檢同日看感冒不得另報）<\/td><\/tr><tr><td>七 門急診轉住院<\/td><td>如仍由同科醫師診治（即使不同醫師），門診診察費或住院診察費擇一申報<\/td><\/tr><tr><td>八 同日同病<\/td><td>同一醫師同日兩次以上門診之相同病情，限申報門診診察費一次<\/td><\/tr><tr><td>九 同一療程<\/td><td>各療程診察費限申報一次；除外：癌症放射線治療每二週得申報一次、高壓氧每十次一次、減敏治療每次得申報<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>同一療程診察費限一次，但放射治療每二週、高壓氧每十次、減敏每次得申報是「除外」情形（112 實務第 13 題）。<\/p><\/div><h4>加成規則（超高頻）<\/h4><div class=\"tbl\"><table><thead><tr><th>年齡<\/th><th>一般兒童加成（診察費、調劑、內視鏡、處置等）<\/th><th>提升兒童加成（處置、手術、麻醉）<\/th><\/tr><\/thead><tbody><tr><td>未滿 6 個月<\/td><td>+60%<\/td><td>+100%<\/td><\/tr><tr><td>6 個月～未滿 2 歲<\/td><td>+30%<\/td><td>+80%<\/td><\/tr><tr><td>2～未滿 7 歲<\/td><td>+20%<\/td><td>+60%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>兒童加成 60／30／20；提升兒童加成 100／80／60。<\/p><\/div><ul><li>未註「兒童加成項目」之診察項目：未滿 4 歲 +20%｜復健：未滿 2 歲 +30%、2～7 歲 +20%。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>加成<\/th><th>規定<\/th><\/tr><\/thead><tbody><tr><td>假日開診（西醫門診）<\/td><td>週六、日、國定假日西醫門診（不含急診）第二部各診療項目（不含門診診察費）+30%；轉入住院申報則不能加成；假日門診當日轉住院合併申報、擇門診診察費者可報診察費假日加計，但診療項目不可加成 30%<\/td><\/tr><tr><td>地區醫院假日加計<\/td><td>00226B 週六 100 點、00227B 週日及國定假日 150 點（限地區醫院；連續二次以上調劑且每次 28 天以上之慢箋不得申報；需先 VPN 登錄開診資訊）。補行上班日視為上班日；調整放假日比照國定假日；國定假日逢週六優先以國定假日認定。平日開立、假日執行之排程檢查／手術／同療程／慢箋第 2、3 次領藥不可加成<\/td><\/tr><tr><td>急診診察費<\/td><td>夜間 50%、例假日 20%、同時符合 50%；兒童 &lt;6 個月 +100%、6 個月～2 歲 +30%、2～未滿 7 歲 +20%；兒科專科醫師 +50%<\/td><\/tr><tr><td>住院診察費<\/td><td>兒童：&lt;6 個月 60%、6 個月～2 歲 30%、2～7 歲 20%；兒科專科醫師：一般住院 150%、ICU 診察費及住院會診費 120%；7～未滿 19 歲 +10%；高齡（≧75 歲）+20%；兒科及新生兒科 ICU +20%。115.04：ICU 合計兒童加成上限調至 160%、一般病房未滿 2 歲上限 210%<\/td><\/tr><\/tbody><\/table><\/div><ul><li>辦理轉診費：回轉及下轉（轉出醫院）00192A 醫中／區域 700、00134B 地區 500；接受下轉門診診察費加算 00193C 500（轉入）；上轉（轉出）01036C 150；接受轉診門診診察費加算 01038C 200（轉入）。回轉＝轉回原診療或適當院所；下轉＝轉至較低層級；上轉＝轉至較高層級。<\/li><\/ul><h4>住院相關費用<\/h4><div class=\"tbl\"><table><thead><tr><th>算進又算出<\/th><th>算進不算出（入院日不論何時算一天；出院日不算）<\/th><\/tr><\/thead><tbody><tr><td>住院診察費<\/td><td>病房費、護理費、急診觀察床病房護理費<\/td><\/tr><tr><td>急診觀察床診察費（留置二日以上，自第二天起報）<\/td><td>精神慢性病房照護費、日間住院治療費<\/td><\/tr><tr><td>| 管灌飲食費、安寧住院照護費<\/td><td><\/td><\/tr><tr><td>| 住院藥事服務費（天）、住院整合照護管理費（P7201B）<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>病房費、護理費：算進不算出；住院診察費：算進又算出。<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>規定<\/th><\/tr><\/thead><tbody><tr><td>住院診察費<\/td><td>醫師應每日巡房，未巡房者不予支付；正常新生兒以 57114C、57115C 新生兒費併母親分娩費申報<\/td><\/tr><tr><td>住院會診費 02005B（429 點）<\/td><td>除急診期間外，每次住院最多 5 次；急診暫留床限 1 次；不得同時報 57124C–57126C<\/td><\/tr><tr><td>護理費「第一天」<\/td><td>僅限該次入院首日；同院轉床不重複計算（轉換病房當日只能報「第二天起」）；以當日最後入住病房種類計算；同疾病 14 天內再住院屬另一次住院，當日得報第一天；轉住院當日得申報住院護理費第一天<\/td><\/tr><tr><td>嬰兒病床<\/td><td>足月出生 4 個月內或 35 週前出生早產兒矯正年齡 5 個月內（正常新生兒除外）；限無家屬照顧、24 小時醫護照顧；非兒童加成項目<\/td><\/tr><tr><td>急診觀察床<\/td><td>急診留觀或待床，入住滿 <b>6 小時<\/b>始得申報；超過 24 小時比照住院病房費「算進不算出」；僅注射點滴、輸血或休息者不予支付<\/td><\/tr><tr><td>精神科日間住院<\/td><td>點數已含診察、病床、護理、精神醫療治療費等；院外適應治療（04010A、04011B）每 3 個月不得超過 20 天<\/td><\/tr><tr><td>管灌飲食費<\/td><td>需聘專任營養師並由主治醫師處方；算進不算出<\/td><\/tr><tr><td>ICU 營養照護費<\/td><td>1 歲以上入住 ICU 超過 2 天（未滿 1 歲需醫師會診）；每案最多 6 次：7 天內 05151B 一次＋05152B 最多二次，超過 7 天 05152B 最多三次<\/td><\/tr><tr><td>住院安寧療護<\/td><td>醫師、護理、社工需完成 80 小時安寧訓練、每年繼續教育 20 小時；費用已含診察、護理、病床、藥品等，不得另報；例外可另計：放射治療、淋巴水腫徒手引流 47091B、血液透析；不適用 Tw-DRGs；單一病人 &gt;30 天且該院當月超過 50% 病人 &gt;30 天 → 逐案審查<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>急診留觀或待床，入住滿 6 小時始得申報急診觀察床費用（112 實務第 17 題）。<\/p><\/div><h4>調劑（藥事服務費）<\/h4><ul><li>藥事服務費成本包含：處方確認、查核、調配、核對交付、用藥指導、藥歷管理、耗損包裝倉儲等。皆為兒童加成項目。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>交付調劑醫療服務案件，診療之院所不得申報藥事服務費（處方調劑方式 d28 填 1）。一次領 2 或 3 個月慢箋 → 藥服費得相對申報 2 或 3 次。醫院超過合理調劑量依支付點數之 50% 支付（112 實務第 16 題）。<\/p><\/div><ul><li>注射自備藥品＋交付口服藥：可報注射藥費、空針、交付調劑門診診察費（大型點滴可報注射技術費），不得報藥服費。<\/li><li>醫院合理調劑量計算次序：特殊藥品 → 住院處方 → 門急診處方（例：醫學中心藥師門急診合理量每日 70 件）。基層與藥局：每人每日 100 件（山地離島 120 件）；醫師兼藥師親自調劑每日限 50 件（超過不給付）。<\/li><\/ul><h4>特定診療：檢查<\/h4><div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>規定<\/th><\/tr><\/thead><tbody><tr><td>急診加成時限<\/td><td>實驗室檢驗 1 小時（簽收→報告）；超音波、內視鏡、特殊造影 3 小時（醫囑→報告）<\/td><\/tr><tr><td>不得同時申報（內含）<\/td><td>MCV/MCH/MCHC 已含於 CBC（08011C、08012C）；ACT vs. PT/APTT；Troponin T vs. I 擇一；13016B 血液培養 vs. 13007C；18007C 已含 18006C；26025B 已含 26024B、26049B；碳-13 呼氣 30512C 與 13018C、28016C、28030C<\/td><\/tr><tr><td>病理 25001–25026<\/td><td>需附解剖病理或口腔病理專科醫師簽名加註證書字號之報告；委託他處檢查包裝郵寄可加 10%；手術切除標本未送病理 → 手術費不給付；25003C/25004C 不同病灶 ≦2 件、單一部位 ≦4 件；細胞學抹片需醫師判讀（陰性亦算）<\/td><\/tr><tr><td>內視鏡 28001–28046<\/td><td>點數含材料費，需附報告；同時連續做兩項以上按主檢查計算；兒童加成項目；門診胃鏡與大腸鏡不宜同時申報<\/td><\/tr><tr><td>伴隨式診斷 30101–30112<\/td><td>需上傳報告，未上傳不予支付；限解剖病理專科醫師簽發；每人終生限給付一次<\/td><\/tr><tr><td>NGS 30301B–30307B<\/td><td>BRCA 10,000、小套組 20,000、大套組 30,000 點；限區域級以上或癌症診療品質認證醫院；需分子腫瘤委員會 MTB；每人各癌別擇一申報且終生一次；申報後一個月內上傳結果。115.09 擴及 HR+/HER2− 乳癌<\/td><\/tr><\/tbody><\/table><\/div><h4>放射、注射、復健<\/h4><ul><li>X-RAY：32015C–32018C 同一對稱部位同一照野視為同一診療；連續拍攝第二張以上 8 折另一代碼申報。CT/MRI：以「次」為單位、須附申請書、報告、影像（缺一不可）；同部位不可同時做 CT+MRI；12 週內再做需說明。<\/li><li>注射 39001–39026：點數含注射技術費及棉球、膠帶、敷料；簡單注射（皮下肌肉、小量靜注、IV Push）含於門診診察費及住院病房費，塑膠空針等特材另計。111.10 起關節內注射劑（特材前五碼 FBT01）診療部位必填 R/L/B；療程第一針起 35 天內不得併用同部位 NSAID、類固醇注射、復健或置換人工膝關節。<\/li><li>復健：限「設有復健科」之機構；需註明「治療內容代碼」並附復健治療紀錄表；門診每療程不超過 6 次、療程期間不得重疊；PT、OT、ST 每日各限申報 1 次；已排定而病患未接受治療不得申報。職能治療需專任復健、神經、骨、神外、整外或小兒神經專科醫師；語言治療至少一名復健或耳鼻喉專科專任醫師；心理社會復健點數包裹不可分開申報。<\/li><\/ul><h4>治療處置<\/h4><ul><li>點數已含一般材料（敷料、一般縫合線、刀片、外用消毒、生理鹽水、導尿管、鼻胃管）、表面麻醉、浸潤麻醉、簡單傳導麻醉；特殊材料、藥劑、其他麻醉得另計。<\/li><li>對稱器官指兩側；同一部位同時施行多種處置 → 僅依主要處置（點數最高者）計算。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>處置急診加成兩軌：① 一般急診緊急傷病 4 小時內立即處置 +20% ② 重大外傷（指定 ICD-10 如 T07、燒傷 &gt;20%）2 小時內執行 +100%、2～4 小時 +60%；兩案擇一申報，但可與離島、地區假日、兒童加成累計。<\/p><\/div><ul><li>創傷處理：48001C &lt;5 cm 420 點、48002C 5–10 cm 562 點、48003C &gt;10 cm 739 點；全身分 7 區，同區傷口長度併計；需附繪圖或處置前後彩色照片。<\/li><li>呼吸治療：同一設備多種處置擇主要項目；57001B 侵襲性呼吸輔助器一天 1,800 點（已含氧氣、濕氣、抽痰、Ambu，不得另報 57009B、47041C/47042C）；57003C 氧氣每小時 30 點、超過 6 小時以一天計（57004C 360 點）。<\/li><li>透析：因癌症或外傷出血之輸血不含在血液透析費用內。<\/li><\/ul><h4>手術通則（申報演練必考）<\/h4><ul><li>一、可申報「手術費」及「手術一般材料費」；二、手術費含術前皮膚剃薙與刷手消毒。<\/li><li>三、手術一般材料費及過程面特材依表列加計比率；未表列者依手術點數 <b>53%<\/b>（例：83001B 腦微血管減壓術加成 104%）。特殊治療材料依藥物支付標準另報。<\/li><li>四、含表面、浸潤、簡單傳導麻醉；五、同一手術野內之對稱器官，除有特殊規定者外，係指<b>兩側<\/b>之手術費用。<\/li><li>六、同一手術野或同一病巢同時做兩種以上手術依下表；同一手術野／病巢＝同一手術區內不同器官因同一病灶影響須同時手術；同類＝支付標準手術章中同一「項」內之手術。<\/li><li>七、為達手術最終目的過程中之切開、剝離、摘除、吻合、切片、縫合、灌洗等附帶手術，不得視為副手術另報。<\/li><li>八、因第一次手術所引起併發症之手術，依所定點數之一半計算，並僅計算一項；第一次手術在他院者不受限。因故中止按已實施步驟最近似項目申報；門診小手術不得住院。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>同一手術野多項手術<\/th><th>第一項（點高者）<\/th><th>第二項<\/th><th>第三項<\/th><th>第四項以後<\/th><\/tr><\/thead><tbody><tr><td>同類／兩側<\/td><td>100%<\/td><td>50%<\/td><td>50%<\/td><td>0<\/td><\/tr><tr><td>不同類<\/td><td>100%<\/td><td>100%<\/td><td>50%<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>同類「1、半、半、零」；不同類「1、1、半、零」。附加非治療必須之手術 → 不給付。<\/p><\/div><ul><li>例外 100% 給付：第十八項治療性先天殘缺手術、CHD（Q20.0–Q28.9）心臟／血管手術、重大創傷 ISS≧16 之胸、腹、中樞神經特定手術。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>同一手術野是同一手術區因同一病灶影響之不同器官，不等於同一刀口；一般材料費可另計（表列比率或 53%）（112 實務第 1 題答「對稱器官係指兩側」）。<\/p><\/div><ul><li>手術同類項表（節錄）：第一項 皮膚 62001–62072；第二項 乳房 63001–63017；第三項 筋骨 64001–64289；第九項 消化器（含腹壁 75601–75625）；第十二項 泌尿及男性生殖；第十三項 女性生殖；第十五項 神經外科 83001–83107；第十七項 視器（同側上下眼瞼視為同一手術野）；第十八項 治療性先天殘缺手術 88001–88064。<\/li><li>直接侵犯視為同一病巢、遠處轉移為不同病巢（結腸癌侵犯膀胱並肝轉移 → 膀胱同一病巢、肝臟不同病巢）。<\/li><\/ul><h4>麻醉費 96000–96030<\/h4><ul><li>麻醉藥材定額折算：固定 50%（除特殊 5 項）；表面麻醉、浸潤麻醉、笑氣、Oxygen、蘇打石灰、麻醉藥膏包裹不另計。<\/li><li>麻醉時間：手術室麻醉開始至手術完畢；住院病人另加 15 分鐘準備；按主麻醉計費。<\/li><li>96017C 二小時以內 3,582 點、96018C 2～4 小時每 30 分鐘 895 點、96019C 4 小時以上每 30 分鐘 1,119 點；限麻醉科專科醫師。申報全身麻醉均須檢附麻醉前評估、麻醉紀錄、麻醉恢復紀錄。<\/li><li>麻醉加成：器官移植及摘取 +100%、心臟腦部手術休克急診立即 +20%（同時符合擇高）；重大外傷 2 小時內 +100%、2～4 小時 +60%；提升兒童：&lt;6 個月 +100%、6 個月～2 歲 +80%、2～7 歲 +60%。<\/li><\/ul>"},{"id":"ch6-2","no":"6-3","title":"牙醫、中醫、居家、論病例計酬、DRG、品質支付","html":"<h4>第三部 牙醫<\/h4><ul><li>5 歲以下嬰幼兒齲齒防治（就醫年月減出生年月 ≦60 個月）處置費 +30%，同時符合轉診 +60%；70 歲以上根管治療難症 +30%（轉診合計 +60%）。<\/li><li>醫院夜間（21:00～翌日 9:00）牙醫急診（檢傷 1、2）口腔顎面外科及處置費 +50%；離島牙醫基層假日診察費 +20%。<\/li><li>門診診察費以每位醫師每日 20 人次以下分段；牙體復形已含局部麻醉 96001C。<\/li><li>牙周病統合治療：總齒數 ≧16、6 顆以上囊袋 ≧5 mm；違反自費規範一年內不得申報。92094C 週日及國定假日急症處置：需前一個月於 VPN 完成門診時間登錄。<\/li><\/ul><h4>第四部 中醫<\/h4><ul><li>A82（聘護理人員在場）293 點、A84（未聘）283 點；需於次月 20 日前 VPN 填報護理人員跟診時段。<\/li><li>每月看診日數：第(一)項超過 23 日以 23 日計、第(二)項超過 26 日以 26 日計（資源不足地區、山地離島、花東以實際日數）。<\/li><li>未滿 4 歲兒童診察費 +20%；藥費每日 38 點（A21）；一般案件給藥不得超過 7 日，指定慢性病最高 30 日。<\/li><li>針灸、傷科同一療程以 6 次為限，第 1 次報診察費＋處置費，第 2～6 次只報處置費；中度複雜性針灸：2 個以上部位＋輔助治療＋10 分鐘以上；高度複雜性 20 分鐘以上。<\/li><li>傷科限未開設民俗調理之院所；脫臼需術前中後影像、骨折需術前影像及術後 X 光；未滿 7 歲可加報 E90。<\/li><\/ul><h4>第五部 居家照護、精神社區復健、安寧居家<\/h4><ul><li>居家照護收案：清醒時 50% 以上活動限制在床或椅上；外出就醫不便；慢性病需長期護理或出院後需繼續護理。醫囑單自開立日起 30 日內有效；訪視時過卡登錄，24 小時內 VPN 上傳；計畫書收案後 2 週內送健保署；收案期限 1 年。<\/li><li>護理人員每月訪視合理量 100 人次，第 101 人次起折付；護理訪視依資源耗用群分四類；每個案每月 2 次為限。<\/li><li>醫師訪視：至少每 3 個月一次、每 2 個月申報一次為限；每位醫師每日 8 人次、每月 180 人次。<\/li><li>緊急訪視：夜間 17–22 時 +50%、深夜 22–08 時 +70%、例假日 +40%（不重複累加）；同一人對同一病人每日限一次。<\/li><li>精神社區復健：限重大傷病慢性精神病患；收案後 2 週內核備；收案 1 年、到期前 1 個月申請延長、每次 ≦6 個月；住宿費不給付。<\/li><li>安寧居家：甲類（80 小時訓練含 40 小時見習，每年 20 小時）、乙類（13 小時訓練＋8 小時見習）；每位人員每月訪視 45 次為限；需 24 小時電話諮詢；收案：末期病人，ECOG 2 級以上。115.04 居家與安寧訪視費全面調升 5%。<\/li><\/ul><h4>第六部 論病例計酬、第七部 Tw-DRGs<\/h4><div class=\"tbl\"><table><thead><tr><th>比較<\/th><th>Tw-DRGs<\/th><th>論病例計酬<\/th><\/tr><\/thead><tbody><tr><td>適用<\/td><td>急性住院、全面科別<\/td><td>處置為主的急性門、住診；外科系<\/td><\/tr><tr><td>分類邏輯<\/td><td>主診斷＋處置碼<\/td><td>處置碼為主<\/td><\/tr><tr><td>計費單位<\/td><td>相對權重<\/td><td>點數<\/td><\/tr><tr><td>執行內容<\/td><td>無額外限制<\/td><td>必要診療項目執行率需達 65%；※ 未執行整筆不給付<\/td><\/tr><tr><td>超過上限<\/td><td>超出部分給付 80%<\/td><td>改按實際醫療費用核實申報（Outlier 個案不得超過當月總個案之固定比率，多為 5%）<\/td><\/tr><tr><td>低於下限<\/td><td>核實申報<\/td><td>以定額申報<\/td><\/tr><tr><td>自費特材<\/td><td>扣除被替代之健保特材點數；醫令類別 D 與 E 勾稽（有 E 無 D 前端退件）<\/td><td>扣除被替代健保特材；需填 D、E、F 代碼<\/td><\/tr><\/tbody><\/table><\/div><ul><li>論病例計酬住院項目（節錄）：陰道生產 97004C（115.09 調升至 49,382 點，原 38,822）、剖腹產 97009C（41,551 點）、前胎剖腹產之陰道生產 97934C（104,850 點）；得核實申報個案比率 5%。已導入 Tw-DRGs 之論病例項目，醫院應以 Tw-DRGs 申報。<\/li><li>門診論病例：疝氣（單側）、ESWL（單、雙側）、水晶體摘除及置入（單側；雙側非屬論病例）、喉直達鏡腫瘤切除。<\/li><li>自費手術住院：已導入 DRG 範圍但主要手術自費者，不適用 DRG，「不適用註記」填 P（例：兒童使用自費包皮槍）。<\/li><li>115.09 Tw-DRGs 3.4 版變更：SPR 53,632 → 53,793 點；資料基準年改 113 年；無權重核實申報 76 → 74 項；個案 &lt;20 暫核實 207 → 201 項；不適用 DRG 擴大至羊水栓塞、極重度子癇前症合併器官衰竭、肺動脈高壓、發紺性先天性心臟病或心肌病變之生產。<\/li><\/ul><h4>第八部 品質支付服務、第九部<\/h4><ul><li>第一章結核病、第二章糖尿病及初期慢性腎臟病照護整合方案、第三章個案資訊整合及資料上傳。<\/li><li>DM 收案：最近 90 天內同院所診斷糖尿病（E08–E13）就醫 2 次以上，當次以主診斷收案；結案後一年內不得再收案。CKD：Stage 1、2、3a。<\/li><li>申報：DM 案件分類 E1、特定治療項目 E4（住院給付類別 C）；CKD E1＋EB；DKD E1＋EK。<\/li><li>第九部：護理人員投入為主之診療項目（包裹性支付）；115.09 增列 11 項（化療注射、輸血、造口等）。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>癌症低分次放射治療採包裹給付，於完全療程後一次支付；PAC 是論日、糖尿病追蹤是論質、復健同療程是逐次論量（112 專業第 39 題）。<\/p><\/div>"},{"id":"ch6-3","no":"6-4","title":"115 年支付標準修正重點","html":"<div class=\"tbl\"><table><thead><tr><th>期別<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>115.01<\/td><td>新增質子治療（67 萬～126 萬點）；腦中風機械取栓移列手術章 83106B；新增第九節「醫療照護諮詢費」（02020C 緩和醫療家庭諮詢費 2,250 點開放基層、02028C ACP 3,000 點終生一次）；建立重大外傷急診加成（2h 內 +100%、2–4h +60%）<\/td><\/tr><tr><td>115.04<\/td><td>兒童醫療強化（ICU 加成上限 160%、一般病房未滿 2 歲 210%、7～19 歲 +10%）；血液透析點數調升；新增 REBOA 56044B；居家與安寧訪視費 +5%<\/td><\/tr><tr><td>115.07<\/td><td>新增 17025B 脈衝振盪肺功能 IOS（3–8 歲氣喘童）<\/td><\/tr><tr><td>115.08<\/td><td>西醫基層門診合理量 40 → 45 人次（1–35 人 364 點；滿額天數 25 → 22 日）<\/td><\/tr><tr><td>115.09<\/td><td>住院護理費全面 +5%（醫中急性床首日 1,154 → 1,212 點；ICU 甲級 6,131 → 6,438 點）；偏鄉護理費加成 15% → 30%；生產給付大幅調升（02024B 1,493 → 2,986；81011C 翻倍、植入性胎盤剖腹產 81028C +200%）；急重難症外科翻倍（62032B +75%、72032B +96%）；NGS 納入 HR+/HER2− 乳癌；Tw-DRGs 3.4 版實施<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--more\" data-key=\"1\"><span class=\"box__k\">延伸<\/span><p>緩和醫療家庭諮詢費 02020C 已於 115.01 移列第九節「醫療照護諮詢費」，並擴大至居家末期病人、開放基層申報（112 實務第 11 題背景已變）。<\/p><\/div><ul><li>中區立意抽樣例：醫師出國或住院期間申報費用；同案件併報 80401C＋80422C；69023B 併報 69003B/69004B；住院手術併報留置導尿 47014C（時間在手術起訖內或術前 1 小時內於手術室 → 行政核刪）；非手術案件申報 96011C 止痛應改報 47051C；腹壁腫瘤 75602C 僅限皮下應報 62010C–62013C；3 日內同療程重複報診察費；未滿 6 小時申報急診觀察床。<\/li><li>活用：熟記各部、章、節之通則；交互參考審查注意事項、藥物支付標準、問答輯、申報格式；時時更新。<\/li><\/ul>"}]},{"id":"ch7","label":"第 7 章","title":"醫療費用申報與核付及醫療服務審查辦法","sub":"第 1～34 條、申復與爭議","meta":"講師：陳冠宏（嘉義基督教醫院體系管理中心營運長）｜112 年專業 5 題、實務 2 題","intro":"<div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>各種「日數」是必考數字：20 日、6 個月、15／30 日、10／20 日、60 日、2 年、2 週、60 日＋3 個月。<\/p><\/div>","secs":[{"id":"ch7-0","no":"7-0","title":"114 年修法重點（114.04.28 修正、114.08.01 施行）","html":"<div class=\"tbl\"><table><thead><tr><th>條文<\/th><th>修正內容<\/th><\/tr><\/thead><tbody><tr><td>第 6 條<\/td><td>刪除「交付機構每點暫付金額一律比照西醫基層總額部門（上限 0.9）」；各總額部門每點暫付金額回到由健保署與相關團體共同擬訂原則、報主管機關核定後公告<\/td><\/tr><tr><td>第 10 條<\/td><td>送核、申復、補報案件：受理文件日起 60 日內核定，逾期未能核定應先行全額暫付；非屬各總額部門者每點核定金額原則 1 元<\/td><\/tr><tr><td>第 34 條<\/td><td>明定 114.04.28 修正之第 6、10 條自 114.08.01 施行<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"ch7-1","no":"7-1","title":"第一章 總則（第 1、2 條）","html":"<ul><li>法源：健保法第 62、63 條（審查辦法共 34 條）。規範兩大面向：醫療費用申報與核付（申報、暫付、抽查、核付、申復及時程）、醫療服務審查。<\/li><li>醫療服務審查 5 種：程序審查、專業審查、事前審查、實地審查、檔案分析。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>健保法第 62 條：申報應自提供醫療服務之次月 1 日起 <b>6 個月<\/b>內為之；不可抗力因素得於事實消滅後 6 個月內；藥費超出目標之部分自當季醫療給付費用總額中扣除，並於次一年度修正藥物支付標準。<\/p><\/div><ul><li>特約及管理辦法第 19 條：健保署得對保險醫事服務機構實地訪查（新設立除外）。<\/li><li>審查目的不是單純扣錢，而是兼顧品質、適當性與財務永續。<\/li><\/ul>"},{"id":"ch7-2","no":"7-2","title":"第二章 醫療費用申報及核付（第 3～17 條）","html":"<div class=\"tbl\"><table><thead><tr><th>步驟<\/th><th>時限<\/th><th>條文<\/th><\/tr><\/thead><tbody><tr><td>申報<\/td><td>服務當月 → 次月 20 日前；電子可分 1–15、16–月底兩段<\/td><td>第 4 條<\/td><\/tr><tr><td>暫付<\/td><td>電子 15 日、書面 30 日內<\/td><td>第 7 條<\/td><\/tr><tr><td>結算<\/td><td>按季結算，確認點值<\/td><td>第 12 條<\/td><\/tr><tr><td>追扣<\/td><td>受理申報 2 年內檔案分析得追扣<\/td><td>第 5 條<\/td><\/tr><tr><td>期限上限<\/td><td>提供服務次月 1 日起 6 個月內<\/td><td>健保法第 62 條<\/td><\/tr><tr><td>條文<\/td><td>重點<\/td><td><\/td><\/tr><tr><td>第 3 條<\/td><td>申報應檢具完整申報表單；不完整或錯誤 → 通知更正，完成後受理；審查所需病歷或證明文件應主動提供；電子資料或複製本應與正本相符<\/td><td><\/td><\/tr><tr><td>資料保存<\/td><td>特管辦法第 16 條：帳冊簿據應與申報相符，保存 5 年；電子病歷依「醫療機構電子病歷製作及管理辦法」<\/td><td><\/td><\/tr><tr><td>第 4 條<\/td><td>當月醫療服務費用於次月 20 日前申報<\/td><td><\/td><\/tr><tr><td>第 5 條<\/td><td>有明確支付規範且於受理申報 2 年內經檔案分析發現違規，得輔導並追扣，超過 2 年不予追扣；同一部分已核減者不得重複核扣；但虛報、浮報涉法律責任者不能簡化為「一律 2 年」<\/td><td><\/td><\/tr><tr><td>第 6 條<\/td><td>暫付：新院所或核付紀錄未滿 3 個月 → 暫付 85%；滿 3 個月 → 依最近 3 個月核減率平均值計算；每點暫付原則 1 元，總額部門依最新公告<\/td><td><\/td><\/tr><tr><td>第 7 條<\/td><td>暫付期限：電子資料 15 日內、書面 30 日內（以健保署收到申報表單日起算）<\/td><td><\/td><\/tr><tr><td>第 8、9 條<\/td><td>更正通知：電子受理日起 10 日內、書面 20 日內；院所接獲通知後 10 日內補正，暫付期限自補正送達日起算；未依期限申報 → 當月不予暫付；延遲超過 30 日，核付期限不受一般 60 日限制<\/td><td><\/td><\/tr><tr><td>第 10 條<\/td><td>送核、申復、補報案件：受理後 60 日內核定，逾期先行全額暫付<\/td><td><\/td><\/tr><tr><td>第 11、12 條<\/td><td>補件更正案件：60 日核付期限自補正送達日起算；健保署通知提供病歷等資料：原則 7 日內完成；醫療費用點數按季結算，結算不足可抵扣或追償，有困難得申請分期<\/td><td><\/td><\/tr><tr><td>第 13、14 條<\/td><td>停止或終止特約時，未結算金額得保留部分款項；送核、申復、補報、爭議案件每點核定金額：受理當月預估點值尚未產出時，以最近 <b>3 個月<\/b>浮動及非浮動預估點值平均值計算<\/td><td><\/td><\/tr><tr><td>第 15～17 條<\/td><td>停止暫付：病歷／證明文件未完整提供、申報資料錯誤率達門檻；停止或終止特約、虛報浮報涉訟、資格違規可能停止暫付與核付；罰則見特約及管理辦法第 35–48 條<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>送核、申復、補報案件是 <b>60 日<\/b>內核定，不是 90 日（112 專業第 5 題）。補件更正者 60 日核付期限自補正送達<b>日<\/b>起算，不是次日（112 專業第 4 題）。<\/p><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>次月 20 日前申報；暫付 15／30；更正 10／20；核定 60；追扣 2 年；申報上限 6 個月。<\/p><\/div><ul><li>特管辦法高風險違規「10 倍奉還」（扣減 10 倍金額）：未依處方箋、病歷或紀錄提供服務；未經醫師診斷逕行提供服務；申報內容為病歷未記載；未記載病歷卻申報；明知病人以他人保險憑證就醫仍申報；容留不具資格人員執行醫事業務。<\/li><li>115 年南區總額財務穩定方案：各季一般服務費用申報期限至次季第 2 個月月底前，逾期以 0 元核付（例：115Q1 至 115 年 5 月底）。（第 4 章臺北區為次季第 2 個月 10 日前）<\/li><li>114 年第 4 季醫院總額結算：全區浮動點值 0.9833、平均點值 0.9912；115Q1 預估浮動 0.9836、平均 0.9908。<\/li><\/ul>"},{"id":"ch7-3","no":"7-3","title":"第三章 程序審查與專業審查（第 18～24 條）","html":"<div class=\"tbl\"><table><thead><tr><th>第 18 條 程序審查 8 大面向<\/th><th>REA 自動化審查 TOP 10<\/th><\/tr><\/thead><tbody><tr><td>1. 保險對象資格<\/td><td>1. 門診影像重複開立（跨院同院超音波、CT）<\/td><\/tr><tr><td>2. 保險給付範圍<\/td><td>2. 同日同醫師申報 2 筆診察費<\/td><\/tr><tr><td>3. 支付標準、藥物支付標準正確性<\/td><td>3. 門診侵入性檢查審查專案<\/td><\/tr><tr><td>4. 申報資料填載完整與正確<\/td><td>4. 肝癌 TACE＋RFA 複合治療合併申報<\/td><\/tr><tr><td>5. 檢附資料齊全<\/td><td>5. 中醫針傷處置同一療程<\/td><\/tr><tr><td>6. 論病例計酬基本診療項目<\/td><td>6. 牙醫跨區支援與高頻重複<\/td><\/tr><tr><td>7. 事前審查項目<\/td><td>7. 地區醫院住院審查；8. 高額特材／藥品每日最大劑量上限<\/td><\/tr><tr><td>8. 其他申報程序事項<\/td><td>9. 未調閱雲端影像再次執行 CT、MRI；10. 事前審查代碼連動<\/td><\/tr><\/tbody><\/table><\/div><ul><li>違反者不予支付該項費用，並註明不予支付內容及理由。程序審查常見邏輯：資格限制、支付成數／加成、次數頻率、不可併報、事前審查、品項數量比對（如急診、兒童加成、年齡不符）。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>「診斷關聯群超額案件審查」不是程序審查，屬專業審查重點：Outlier 案件費用適當性（112 實務第 12 題）。<\/p><\/div><ul><li>第 19 條 非 DRG 專業審查：病歷要能回答「為何做？做了什麼？結果如何？為何需要？」；高風險處置保留報告、影像、照片、量測佐證；「做過」不等於「可支持申報」。<\/li><li>異常專案審查：針對特定醫令、疾病、醫師或醫療型態；同儕百分位偏高、重複利用、適應症不符。CIS 指標：PET／MRI／CT 適當性、短期重複子宮鏡、術後再處置。<\/li><li>第 20 條 DRG 專業審查：非必要住院、非必要主手術、品質不符、病情不穩定卻出院、主診斷與實際病情不符 → 必要時可改以適當 DRG 碼核付。<\/li><li>第 21 條 Tw-DRG 專業審查 7 大重點：Outlier 費用適當性、出院是否穩定、醫療品質、診斷與處置適當性、入院或主手術必要性、住院範圍費用轉移、編碼正確性。<\/li><li>第 22～24 條：專業審查由具臨床經驗之醫藥專家依醫學原理、病情需要、治療緩急、醫療能力判斷；得抽樣；隨機抽樣依規定回推、立意抽樣不回推；專家應客觀公正、遵守保密與迴避。<\/li><\/ul>"},{"id":"ch7-4","no":"7-4","title":"第四章 事前審查（第 25 條）","html":"<div class=\"tbl\"><table><thead><tr><th>哪些服務需事前審查<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>風險與使用控管<\/td><td>高危險性醫療服務、容易過度或不當使用之醫療服務<\/td><\/tr><tr><td>成本與技術<\/td><td>昂貴或有明顯副作用之藥物、昂貴且易浮濫之特材、高科技診療<\/td><\/tr><tr><td>政策法規<\/td><td>其他經公告之特殊服務<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>事前審查：健保署原則於收到完整申報文件起 <b>2 週<\/b>內完成核定；逾期未核定原則視為同意（資料不全經通知補件者除外）。<\/p><\/div><ul><li>三類核心文件：事前審查申請書、足供審查之病歷資料、規定之必要佐證文件（一次備齊）。<\/li><li>不符仿單適應症：原則不予給付；特殊病例得以個案申請事前審查，核准後給付。品項變更：依規範完成變更或緊急報備，保留原核定與變更資料。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>112 專業第 30 題對「情況緊急時得先行實施」判為錯誤選項，見附錄 A。<\/p><\/div><ul><li>院內管控：病人 ID × 核准日期／期限 × 剩餘數量 × 實際申報品項數量勾稽；異常在前端醫令或批價攔截。事前審查 8 個管控點：抗癌藥適應症、部分事審項目適應症、限專科醫師開立、藥品使用期限、初次使用需事審品項個案建檔、品項變更維護、事審資料群組、未批扣數量與定期批扣。<\/li><\/ul>"},{"id":"ch7-5","no":"7-5","title":"第五章 實地審查（第 26～29 條）","html":"<ul><li>實地審查是從紙本／電子資料走向現場的深度驗證，可查人力、設施、治療中服務或已申報服務。<\/li><li>第 26、27 條：為增進審查效能、輔導醫療品質而進行；原則上應先函知並洽院方派員陪同；院內指定單一窗口。<\/li><li>第 28、29 條：審查結束後製成紀錄並通知；發現不當可輔導改善，必要時加強審查、核減、依檔案分析不予支付或移送查核。<\/li><\/ul>"},{"id":"ch7-6","no":"7-6","title":"第六章 檔案分析（第 30、31 條）","html":"<ul><li>第 30 條：依院所、科別、醫師、保險對象、案件、疾病或病例別分級分析醫療資源耗用、就醫、用藥、治療型態 → 輔導、立意抽樣、加重審查、全審或查核。<\/li><li>查核案件來源：IC 卡／申報資料異常、媒體關注、專審發現、外部移辦、檢舉申訴、收據收費明細、健康存摺。<\/li><li>第 31 條：符合公告之不予支付指標依指標處理方式不予支付；指標由健保署與醫療機構代表共同擬訂，報主管機關核定後公告。<\/li><\/ul><h4>論件抽樣<\/h4><div class=\"tbl\"><table><thead><tr><th>門診類別<\/th><th>申報件數<\/th><th>抽樣率<\/th><th>調整數<\/th><\/tr><\/thead><tbody><tr><td>西醫<\/td><td>1–10,000<\/td><td>1/100<\/td><td>0<\/td><\/tr><tr><td>西醫<\/td><td>10,001 以上<\/td><td>1/100<\/td><td>100<\/td><\/tr><tr><td>牙醫<\/td><td>1–1,000<\/td><td>1/10<\/td><td>0<\/td><\/tr><tr><td>牙醫<\/td><td>1,001 以上<\/td><td>1/20<\/td><td>50<\/td><\/tr><\/tbody><\/table><\/div><ul><li>門診各類別最少抽樣 20 件；西醫醫院分慢性病及其他二類。不列入隨機抽審：洗腎、居家照護、精神社區復健、預防保健、一般案件（01、11、21）、代辦、論病例（C1）、電腦程序審查需整件核減者。<\/li><li>住院論件抽樣：科系分內科系、外科系、小兒科系、婦產科系、骨科系（骨、復健）、其他；抽樣率 1/15、最少 10 件。不列入抽樣：高額、特定醫療（案件分類 3）、論病例計酬（2）、Tw-DRGs（5）、電腦程序審查需整件核減者。<\/li><li>管理閉環：資料擷取 → 異常辨識 → 個案驗證 → 臨床回饋 → 系統修正 → 追蹤成效；從「核減率」走向「風險率」。<\/li><\/ul>"},{"id":"ch7-7","no":"7-7","title":"第七章 附則：申復、爭議審議、電子送達","html":"<div class=\"tbl\"><table><thead><tr><th>步驟<\/th><th>時限<\/th><\/tr><\/thead><tbody><tr><td>抽審／核減核定通知 → 申復<\/td><td>60 日內（第 32 條）<\/td><\/tr><tr><td>健保署核定申復<\/td><td>60 日內<\/td><\/tr><tr><td>爭議審議（爭審會）<\/td><td>核定通知到達次日起 60 日內提出；爭審會 3 個月內審定，必要時延長一次最長 3 個月<\/td><\/tr><tr><td>之後<\/td><td>訴願 → 行政訴訟<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>申報救濟流程：申復 → 爭議審議 → 訴願 → 行政訴訟。健保法第 6 條：救濟第一步是申請審議（112 專業第 14 題）。期限一律由「通知日／送達日」起算。<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>條文<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>第 32 條<\/td><td>收到審查結果後 60 日內，列舉理由或備齊文件向健保署申復；健保署受理後 60 日內核定；需病歷者自資料送達起算<\/td><\/tr><tr><td>第 33 條<\/td><td>申復案件不得交由原審查醫藥專家複審（必要時可會同原專家說明）；健保署不得再就同一案件追扣同一費用；仍有異議依「爭議事項審議辦法」向爭審會申請審議<\/td><\/tr><tr><td>第 33-1 條<\/td><td>經醫療機構同意，得以電子文件送達抽查、通知、核定及公告；送達時間以醫療機構於 VPN 點閱時間為準<\/td><\/tr><tr><td>爭議審議<\/td><td>常見議題：醫療必要性、支付規範、申報認定、核減合理性；申請應檢送原送審之病歷資料<\/td><\/tr><tr><td>申復資料 4 要素<\/td><td>案例判讀五問法<\/td><\/tr><tr><td>1. 逐項回應核減理由<\/td><td>1. 為什麼做？醫療必要性<\/td><\/tr><tr><td>2. 說明醫療必要性<\/td><td>2. 做了什麼？實際服務內容<\/td><\/tr><tr><td>3. 補充新事證、文獻、病歷、檢查結果<\/td><td>3. 有沒有證據？病歷與客觀資料<\/td><\/tr><tr><td>4. 必要時由科主任／院內專審醫師審核<\/td><td>4. 能不能申報？支付標準與限制；5. 怎麼避免再發？<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>抽審送病歷原則 7 日內，以<b>不含例假日<\/b>計算（112 專業第 6 題）；停止暫付條件是「14 日內（不含例假日）未完整提供」（112 專業第 4 題）。<\/p><\/div><ul><li>院內管理：申報成熟度 5 級（人工申報 → 規則化稽核 → 即時提示跨系統勾稽 → 資料分析預警 → AI 決策支援）；管理者最應關注 8 風險：病歷無法支持申報、醫令病歷不一致、事審漏申請或超量、資格專科限制、重複或非必要醫療、DRG 編碼錯誤、高風險申報、法規版本未同步。<\/li><\/ul>"}]},{"id":"ch8","label":"第 8 章","title":"申報規定及申報格式欄位介紹與實務運用","sub":"門住診格式、DRG 媒體欄位","meta":"講師：黃秋萍（馬偕紀念醫院）｜112 年實務 4 題、專業 1 題，申報實例演練必用","intro":"","secs":[{"id":"ch8-0","no":"8-1","title":"健保費用申報表格","html":"<div class=\"tbl\"><table><thead><tr><th>段<\/th><th>內容<\/th><th>筆數<\/th><th>項數<\/th><\/tr><\/thead><tbody><tr><td>總表 tdata<\/td><td>醫療服務點數申報總表<\/td><td>—<\/td><td>門診 42 項／住院 33 項<\/td><\/tr><tr><td>點數清單 ddata<\/td><td>每一案件一筆<\/td><td>每案件 1 筆<\/td><td>門診 63 項／住院 115 項<\/td><\/tr><tr><td>醫令清單 pdata<\/td><td>每一醫令一筆<\/td><td>每醫令 1 筆<\/td><td>門診 26 項／住院 28 項<\/td><\/tr><\/tbody><\/table><\/div><ul><li>最新版：門診 114.10.16、住院 112.08.25｜健保署全球資訊網 → 醫療費用 XML 申報格式。<\/li><li>符號：「＊」必要欄位｜「△」有申報該醫療服務時必填，無資料免填｜英文字一律大寫（新生兒胞胎註記除外）。<\/li><\/ul>"},{"id":"ch8-1","no":"8-2","title":"門診申報格式","html":"<h4>總表段<\/h4><ul><li>資料格式：“10” 為門診（“20” 為住院）；醫事機構代號＝衛福部編定；費用年月 5 碼（不足前補 0）；申報方式：1 書面、2 媒體、3 連線；申報類別：1 送核、2 補報；申報日期 7 碼（民國年月日）。<\/li><li>西醫一般案件＝案件分類 01（牙 11、中 21）；西醫專案＝02、03、04、07、09、B1、C1、D1、D4、E1、B6～B9、BA、E2 等；洗腎 05；結核病 06、C4；精神社區復健 A2；預防保健 A3、D2、DF；慢箋 08、28、E3；居家 A1、A5、A6、A7。<\/li><\/ul><h4>案件分類（d1）<\/h4><div class=\"tbl\"><table><thead><tr><th>代碼<\/th><th>西醫類<\/th><th>代碼<\/th><th>西醫類<\/th><\/tr><\/thead><tbody><tr><td>01<\/td><td>西醫一般<\/td><td>08<\/td><td>慢性病連續處方調劑<\/td><\/tr><tr><td>02<\/td><td>西醫急診<\/td><td>09<\/td><td>西醫其他專案<\/td><\/tr><tr><td>03<\/td><td>西醫門診手術<\/td><td>C1<\/td><td>論病例計酬案件<\/td><\/tr><tr><td>04<\/td><td>西醫慢性病<\/td><td>E1<\/td><td>醫療給付改善方案及試辦計畫<\/td><\/tr><tr><td>05<\/td><td>洗腎<\/td><td>E2／E3<\/td><td>愛滋病確診服藥滿 2 年後／其慢箋<\/td><\/tr><tr><td>06<\/td><td>結核病<\/td><td>A1／A2<\/td><td>居家照護／精神社區復健<\/td><\/tr><tr><td>07<\/td><td>遠距醫療<\/td><td>A5／A6／A7<\/td><td>安寧居家／護理之家／安養機構居家<\/td><\/tr><tr><td>代碼<\/td><td>代辦案件類<\/td><td>代碼<\/td><td>代辦案件類<\/td><\/tr><tr><td>A3<\/td><td>預防保健<\/td><td>B9<\/td><td>孕婦全面篩檢愛滋計畫<\/td><\/tr><tr><td>B1<\/td><td>性病全面篩檢愛滋<\/td><td>BA<\/td><td>愛滋防治替代治療<\/td><\/tr><tr><td>B6<\/td><td>職災案件<\/td><td>C4<\/td><td>無健保結核病<\/td><\/tr><tr><td>B7<\/td><td>門診戒菸<\/td><td>C5<\/td><td>嚴重特殊傳染性肺炎通報隔離<\/td><\/tr><tr><td>B8<\/td><td>精神科強制住院<\/td><td>D1<\/td><td>愛滋病案件<\/td><\/tr><tr><td>D2<\/td><td>流感、兒童常規疫苗、75 歲以上肺鏈<\/td><td>DF<\/td><td>登革熱 NS1 快篩<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>代辦類：A3、B1、B6–B9、BA、C4、C5、D1、D2、DF（112 實務第 3 題答 B9）。<\/p><\/div><ul><li>中醫：21 一般、22 其他專案、23 現代科技、24 慢性病、25 資源不足、28 慢箋、29 針灸傷科脫臼整復、30 特定門診加強照護、31 中醫居家。牙醫：11 一般、12 急診、13 門診手術、14 資源不足、15 牙周病統合、16 特殊專案、17 急診醫療不足區、19 其他專案。<\/li><\/ul><h4>點數清單段：重點欄位<\/h4><div class=\"tbl\"><table><thead><tr><th>欄位<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>流水號 d2<\/td><td>依案件分類分別連續編號<\/td><\/tr><tr><td>就醫科別 d8<\/td><td>健保科別代號（01 家醫、02 內、03 外、04 兒、05 婦產、06 骨、13 精神、14 復健、22 急診、40 牙、60 中醫…）；整合性照護計畫多科就醫 → 擇當日就醫第一科<\/td><\/tr><tr><td>就醫日期 d9／治療結束日期 d10<\/td><td>居護填該月第一次／最後一次訪視日；同一療程、排程檢查、慢箋必填 d10；療程跨月者結束後合併或按月分別申報；排程檢查當天不得再累計就醫序號、不可申報診察費<\/td><\/tr><tr><td>補報原因 d12<\/td><td>1 補報整筆、2 補報部分醫令或差額<\/td><\/tr><tr><td>給付類別 d14<\/td><td>1 職業傷害、2 職業病、3 普通傷害、4 普通疾病、6 自然生產、8 天然災害、9 呼吸照護、V/W/X 法定傳染病相關、U 重大意外事故<\/td><\/tr><tr><td>部分負擔代號 d15<\/td><td>3 碼：醫院別 × 部分負擔方式 × 身分別；慢箋及預防保健填 009；E2、E3 填 904<\/td><\/tr><tr><td>轉診註記 d16／d17<\/td><td>1 他院轉來、2 慢連處方調劑、7/8 特殊造影影像報告申請…；有值者 d17 必填轉介／原處方機構代號（無則填 N）<\/td><\/tr><tr><td>病患是否轉出 d18／d55<\/td><td>Y 時 d55 必填擬轉往機構代號，無法得知填 9999999999<\/td><\/tr><tr><td>主次診斷 d19–d23<\/td><td>依 ICD-10-CM（2023 年版，2024/1 起）核實填寫，小數點免填；預防保健可不填<\/td><\/tr><tr><td>主次手術 d24–d26<\/td><td>依 ICD-10-PCS；預防保健、慢箋、中醫免填<\/td><\/tr><tr><td>給藥日份 d27<\/td><td>同時開口服與非口服藥 → 填口服藥最高給藥天數；慢箋依連續處方箋給藥日份<\/td><\/tr><tr><td>處方調劑方式 d28<\/td><td>0 自行調劑、1 交付調劑、2 未開處方、6 藥事法 102 條偏遠地區或緊急自行調劑；A–F 為藥品與 PT/OT 自行或交付組合<\/td><\/tr><tr><td>就醫序號 d29<\/td><td>一般 4 碼數字（0001）；預防保健「IC＋服務時程代碼」；慢箋第二次以後 IC02/IC03/IC04；虛擬健保卡 V001–V999<\/td><\/tr><tr><td>診治醫事人員 d30<\/td><td>醫師 ID；居護填該月第一次訪視人員<\/td><\/tr><tr><td>點數欄位<\/td><td>用藥明細 d32＝醫令類別 1；診療明細 d33＝類別 2；特材 d34＝類別 3；診察費 d36＝類別 0；藥服費 d38＝類別 9<\/td><\/tr><tr><td>合計點數 d39<\/td><td>＝ 用藥 d32＋診療 d33＋特材 d34＋診察費 d36＋藥服費 d38（部分負擔已含在這些點數裡）<\/td><\/tr><tr><td>申請點數 d41<\/td><td>＝ 合計點數 d39 − 部分負擔點數 d40（論病例：定額 − 部分負擔 − 醫令類別 D 被替代特材）<\/td><\/tr><tr><td>d44／d56<\/td><td>慢連處方總處方日份／原處方就醫序號（慢箋第二次以後必填）<\/td><\/tr><tr><td>新生兒依附 d45／d51<\/td><td>部分負擔 903 時 d45 必填，且就醫日 − 出生日 ≦60 天；胞胎註記男大寫、女小寫（A/a、B/b）<\/td><\/tr><tr><td>d57／d58<\/td><td>基本部分負擔點數／藥品部分負擔點數（112.06.05）<\/td><\/tr><tr><td>就醫識別碼 d60–d62<\/td><td>健保卡資料上傳格式 2.0（114/9/1 上線）；d62 原就醫識別碼：同療程、排程檢查跨月申報必填<\/td><\/tr><tr><td>指定區域編號 d63<\/td><td>114 年新增；週日及國定假日輕急症中心（UCC）必填<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>申請點數 d41 ＝ 合計點數 d39 − 部分負擔 d40。合計點數＝用藥＋診療＋特材＋診察費＋藥服費。<\/p><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>整合性照護計畫門診多科就醫 → 擇<b>當日就醫第一科<\/b>；住院中轉科 → 填<b>出院時<\/b>科別（112 實務第 14 題）。<\/p><\/div><h4>特定治療項目代號（d4–d7，最多 4 項）<\/h4><div class=\"tbl\"><table><thead><tr><th>類別<\/th><th>代碼<\/th><\/tr><\/thead><tbody><tr><td>特殊檢查<\/td><td>A1 超音波、A2 耳鼻喉科、A3 內視鏡、A4 病理、A5 核醫、A6 X 光、A7 特殊造影、A8 神經科檢查<\/td><\/tr><tr><td>特殊治療處置<\/td><td>D1 癌症放射線、D2 化療、D3 復健（PT 簡單中度除外）、D4 精神科、D5 高壓氧、D6 眼科雷射、D7 血友病、D8 血液透析、D9 腹膜透析、D0 PT 簡單中度<\/td><\/tr><tr><td>計畫方案（E1）<\/td><td>E4 糖尿病、E5 週產期、E6 氣喘、EB 初期 CKD、EC 居家醫療整合、ED 早療、HE C 肝全口服、HF COPD<\/td><\/tr><tr><td>資源不足（D4）<\/td><td>G5 巡迴醫療、G6 新開業<\/td><\/tr><tr><td>代開藥／一次領<\/td><td>H2 行動不便、H3 遠洋漁船、H6 國際船員代開藥；HA 返回離島、HB 遠洋、HC 國際船員、HD 罕病一次領所有慢箋；H8 出國（須切結）；H9 特殊情形代領藥<\/td><\/tr><tr><td>其他<\/td><td>JA 矯正機關內門診、JB 戒護門診、K1 Pre-ESRD、H4 自費健檢發現病兆加作處置<\/td><\/tr><\/tbody><\/table><\/div><ul><li>兩種以上試辦：同時符合二項疾病試辦分開二筆；屬二種以上試辦依序填報中間不空白；疾病類試辦優先。整合照護計畫註記 d13：1 腦中風、N 燒燙傷、3 創傷性神經損傷、4 脆弱性骨折、5 心衰竭、6 衰弱高齡（PAC）；P 家醫多重慢病；Q/R/S 醫院以病人為中心門診整合。<\/li><\/ul><h4>部分負擔（d15）三碼編碼<\/h4><div class=\"tbl\"><table><thead><tr><th>碼<\/th><th>意義<\/th><th><\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>第一碼 醫院別<\/td><td>A/E/N 醫學中心、B/F/Q 區域、C/G/R 地區、D/H/S 基層<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>第二碼 方式<\/td><td>0 急診、1 一般門診、2 加收、3 轉診或轉診一個月內未逾四次之回診、4 出院或門急診術後首次回診<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>第三碼 身分<\/td><td>0 或 1 轉診之回診、2 一般身分、3 持殘障手冊、4 一般身分持藥單、7 身障加藥單、F 中低收入戶、P 中低收入加藥單<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>門診基本部分負擔<\/td><td>急診<\/td><td>門診<\/td><td>轉診<\/td><td>出院／術後<\/td><\/tr><tr><td>醫學中心<\/td><td>750／550<\/td><td>420<\/td><td>170<\/td><td>170<\/td><\/tr><tr><td>區域醫院<\/td><td>400／300<\/td><td>240<\/td><td>100<\/td><td>100<\/td><\/tr><tr><td>地區醫院<\/td><td>150<\/td><td>80<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>基層院所<\/td><td>150<\/td><td>50<\/td><td>50<\/td><td>–<\/td><\/tr><\/tbody><\/table><\/div><ul><li>牙醫急診 150、門診 50；中醫門診 50；持殘障手冊 50。藥品 &gt;100 元每 100 元加收 20 元、上限 300 元。居家照護 K00（自負 5%）、開藥 K20；精神社區復健 L00（5%）、開藥 L20。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>免部分負擔代碼<\/th><th>意義<\/th><th>代碼<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>001<\/td><td>重大傷病<\/td><td>006<\/td><td>勞保職傷職業病（代辦）<\/td><\/tr><tr><td>002<\/td><td>分娩<\/td><td>007<\/td><td>山地離島地區就醫<\/td><\/tr><tr><td>003<\/td><td>低收入戶（代辦）<\/td><td>008<\/td><td>經離島院所轉診當次<\/td><\/tr><tr><td>004<\/td><td>榮民、榮眷（代辦）<\/td><td>009<\/td><td>其他免部分負擔（慢箋、百歲人瑞、預防保健、轉代檢…）<\/td><\/tr><tr><td>005<\/td><td>登記列管結核病患<\/td><td>903／904<\/td><td>新生兒依附註記／愛滋（代辦）<\/td><\/tr><tr><td>012／013<\/td><td>手術當次移植／摘除器官<\/td><td>914<\/td><td>法定傳染病通報隔離<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>免部分負擔優先填寫順序：006 職災 → 健保項目（001、002、009、007…）→ 代辦。115 年函：榮民身分註記「2」才可免收部分負擔並申報 004。<\/p><\/div><ul><li>預防保健併行疾病診療：不另取就醫序號（填預防保健時程代碼），併入案件分類 A3 申報；不得另報診察費，可報診療費及藥品費；部分負擔填 009、不可收部分負擔。<\/li><\/ul><h4>同一療程（醫療辦法第 8、9 條）<\/h4><div class=\"tbl\"><table><thead><tr><th>療程期間<\/th><th>項目<\/th><\/tr><\/thead><tbody><tr><td>二日內<\/td><td>簡單傷口換藥<\/td><\/tr><tr><td>自首次治療日起 30 日內<\/td><td>血液透析、腹膜透析、精神社區復健、精神科心理／活動／職能治療、癌症放射線治療、高壓氧、減敏治療、居家照護<\/td><\/tr><tr><td>30 日內、6 次以內<\/td><td>西醫復健、皮症照光、非化療藥物同一針劑注射、同牙位牙結石清除／補牙／拔牙、術後拆線、尿失禁電刺激、骨盆肌肉生理回饋、肺復原、中醫針灸傷科脫臼整復<\/td><\/tr><tr><td>首次治療日起至次月底前、6 次以內<\/td><td>9 歲以下兒童西醫復健<\/td><\/tr><tr><td>自首次治療日起 60 日內<\/td><td>牙醫同部位根管治療<\/td><\/tr><\/tbody><\/table><\/div><ul><li>同一療程只登錄可累計就醫序號一次；最後治療日為例假日順延。第 9 條：出院、同療程第二次以後、排程檢查檢驗治療手術或轉檢 → 登錄就醫紀錄但不得登錄可累計就醫序號。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>醫療辦法第 23 條處方有效期間：排程檢驗檢查 180 日、排程復健 30 日、慢箋至末次調劑之用藥末日、其他門診處方及藥品處方箋 3 日（末日例假日順延）。<\/p><\/div><h4>預防保健就醫序號（節錄）<\/h4><div class=\"tbl\"><table><thead><tr><th>代碼<\/th><th>項目<\/th><th>代碼<\/th><th>項目<\/th><\/tr><\/thead><tbody><tr><td>IC71–79<\/td><td>兒童預防保健<\/td><td>IC21<\/td><td>成人健檢 40～未滿 65 歲，3 年一次<\/td><\/tr><tr><td>IC81<\/td><td>兒童牙齒塗氟（6 歲以下）<\/td><td>IC22<\/td><td>65 歲以上，每年一次<\/td><\/tr><tr><td>IC40–IC53<\/td><td>產前檢查第 1～14 次<\/td><td>IC23／IC24<\/td><td>小兒麻痺 35 歲以上／原住民 55～65 歲<\/td><\/tr><tr><td>IC31／35／37<\/td><td>子宮頸抹片（醫院／助產所／衛生所），30 歲以上每年<\/td><td>IC91<\/td><td>乳房攝影 45～未滿 70 歲，2 年一次<\/td><\/tr><tr><td>IC85<\/td><td>糞便潛血 50～未滿 70 歲，2 年一次<\/td><td>IC95<\/td><td>口腔黏膜 30 歲以上嚼檳榔或吸菸，2 年一次<\/td><\/tr><tr><td>ICLD<\/td><td>肺癌 LDCT（家族史或重度吸菸）2 年一次<\/td><td>IC20<\/td><td>新生兒聽篩<\/td><\/tr><\/tbody><\/table><\/div><ul><li>特殊卡號：IC02–04 慢箋第二次以後、IC06 職災、IC07 門診戒菸、IC08 精神科強制住院、IC09 無健保病患（TB、AIDS）、IC98 非健保對象器官捐贈者、ICB6 誤為代辦改健保。<\/li><\/ul><h4>醫令清單段<\/h4><div class=\"tbl\"><table><thead><tr><th>欄位<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>藥品給藥日份 p1<\/td><td>醫令類別 1 或 4 逐筆填載<\/td><\/tr><tr><td>醫令調劑方式 p2<\/td><td>0 自行、1 交付、2 委託轉檢、3 接受委託轉檢、4 委託代檢、5 接受委託代檢、6 遠距、7 接受交付 PT/OT/ST；2、3、4、5、7 時 p24 必填受託機構代號<\/td><\/tr><tr><td>醫令類別 p3（門診）<\/td><td>0 診察費、1 用藥、2 診療、3 特材、4 不另計價、9 藥服費、A 急診治療起迄、D 被替代健保特材、E 自費特材未支付、F 自費特材不符給付規定、G 專案支付參考數值（R001–R008、S001–S004 填 G）、H HTA 自費<\/td><\/tr><tr><td>重複用藥虛擬醫令<\/td><td>R001 處方箋遺失提前回診、R002 醫師請假、R003 病情變化改藥、R004 其他提前回診或慢箋提前領藥（切結）、R005 健保卡問題、R006 分級醫療轉診後第 1 次、R007 藥品回收、R008 確認排除未領藥紀錄<\/td><\/tr><tr><td>雲端影像虛擬醫令<\/td><td>S001 保險對象因素、S002 院所因素、S003 系統因素、S004 其他（切結）<\/td><\/tr><tr><td>p5／p7／p8／p10<\/td><td>藥品用量；使用頻率（藥品必填）；支付成數無加成填 100；總量取至小數點一位（R/S 虛擬醫令填 0）<\/td><\/tr><tr><td>執行時間 p14／p15<\/td><td>手術、麻醉填至時分；急診觀察床、放射線、復健、CPR、O2、高壓氧、居家等填至年月日；中醫針傷填至時分<\/td><\/tr><tr><td>執行醫事人員 p16<\/td><td>居護、麻醉（96017C–96022C）、超音波類、內視鏡類、33143B 等必填<\/td><\/tr><tr><td>p17 註記<\/td><td>1 慢連處方、2 同一療程、3 排程檢查、4 非前述、5 出院排程、6 排程後加開<\/td><\/tr><tr><td>p19／p21<\/td><td>事前審查受理編號；自費特材群組序號（同組 E 與 D 編相同群組；D、E、F 必填）<\/td><\/tr><tr><td>p25 藥品批號<\/td><td>凝血因子（ATC B02BD、B02BX06）必填<\/td><\/tr><tr><td>診療部位 p6<\/td><td>TKR、THR、白內障手術、ESWL、疝氣手術、特定藥品 → 填 R/L/B；CT、MRI、PET、高頻熱凝 → 部位代碼（H 頭、A 頸、U 胸、N 頸椎、J 胸椎、K 腰椎、C 上腹、I 腹部含骨盆、P 骨盆腔、E 肢部…）；放療 C 根治、P 緩解；牙科 FDI 牙位<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>「純音聽力檢查」申報時不一定要填診療部位；正子造影、高頻熱凝、白內障手術皆需填（112 實務第 5 題）。<\/p><\/div>"},{"id":"ch8-2","no":"8-3","title":"住院申報格式","html":"<ul><li>總表：資料格式 “20”；一般案件（1）、論病例計酬（2）、特定案件（3）、試辦／代辦／安寧（4、6、7）、Tw-DRG（5）的件數、日數、點數；醫療費用總計含部分負擔、不含護病比加成；申請總計不含部分負擔、含護病比加成。<\/li><\/ul><h4>案件分類 d1 與給付類別 d7（住院）<\/h4><div class=\"tbl\"><table><thead><tr><th>案件分類 d1<\/th><th>意義<\/th><th>給付類別 d7<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>一般案件<\/td><td>1<\/td><td>職業傷害<\/td><\/tr><tr><td>2<\/td><td>論病例計酬<\/td><td>2<\/td><td>職業病<\/td><\/tr><tr><td>3<\/td><td>特定案件（50 萬以上、血管支架、肺肝心骨髓移植）<\/td><td>3<\/td><td>普通傷害<\/td><\/tr><tr><td>4<\/td><td>試辦計畫（呼吸照護、乳癌、肝炎、PAC）<\/td><td>4<\/td><td>普通疾病<\/td><\/tr><tr><td>5<\/td><td>Tw-DRGs 案件<\/td><td>6／7<\/td><td>自然生產／剖腹生產<\/td><\/tr><tr><td>6<\/td><td>安寧療護<\/td><td>8<\/td><td>天災<\/td><\/tr><tr><td>7<\/td><td>愛滋確診服藥滿 2 年後<\/td><td>9<\/td><td>呼吸照護<\/td><\/tr><tr><td>|<\/td><td>A／C／E／M／U<\/td><td>安寧照護／糖尿病方案／氣喘／C 肝全口服新藥／非天然災害重大意外<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><ul><li>代辦：勞保局 A1–A4（比照 1–4）、AZ 職傷膳食費；衛福部 B1 精神病強制住院、B2 住院整合照護；疾管署 C1 AIDS、C4 無健保 TB、C5 法定傳染病隔離；DZ 低收入戶膳食費。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>欄位<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>補報原因 d5<\/td><td>1 補報整筆、2 補報部分醫令或差額（DRG 案件、醫令類別 K 及 02025B 不適用）<\/td><\/tr><tr><td>就醫科別 d9<\/td><td>住院中二次以上轉科 → 以出院時之科別填寫<\/td><\/tr><tr><td>申報期間 d12/d13<\/td><td>繼續住院案件每次申報日數上限 92 日（含），不足 92 日於出院時一次申報<\/td><\/tr><tr><td>病床天數 d14/d15<\/td><td>急性／慢性病床天數，算入不算出<\/td><\/tr><tr><td>新生兒依附 d100/d101<\/td><td>入院日 − 出生日 ≦60 日；部分負擔 903 必填<\/td><\/tr><tr><td>病患來源 d16<\/td><td>1 初複診、2 急診、3 轉診、4 同一疾病 14 天內再入院、S 精神病嚴重病人強制住院、7 同次住院費用切帳<\/td><\/tr><tr><td>就醫序號 d17<\/td><td>健保卡就醫序號；IC98 非保險對象器官捐贈、IC06 職災、IC08 強制住院、IC09 無健保 AIDS/TB、V001–V999 虛擬健保卡<\/td><\/tr><tr><td>診斷與處置<\/td><td>主次診斷、處置各 20 欄；主診斷碼 d25 不得空白<\/td><\/tr><tr><td>17 項費用點數 d66–d82<\/td><td>診察、病房、管灌膳食、檢查、放射線、治療處置、手術、復健、血液血漿、血液透析、麻醉、特材、藥費、藥事服務、精神科治療、注射技術、嬰兒費<\/td><\/tr><tr><td>d107／d108／d109<\/td><td>病患來源 3（轉診）→ 轉入機構必填；轉歸 6 或 D → 轉出機構必填<\/td><\/tr><tr><td>d112<\/td><td>不計入醫療費用點數合計欄位（醫令類別 K：全日平均護病比加成，2025/5/1 起暫不實施）<\/td><\/tr><\/tbody><\/table><\/div><h4>住院部分負擔（d4）<\/h4><div class=\"tbl\"><table><thead><tr><th>病房別<\/th><th>5%<\/th><th>10%<\/th><th>20%<\/th><th>30%<\/th><\/tr><\/thead><tbody><tr><td>急性病房<\/td><td>–<\/td><td>30 日內<\/td><td>31～60 日<\/td><td>61 日後<\/td><\/tr><tr><td>慢性病房<\/td><td>30 日內<\/td><td>31～90 日<\/td><td>91～180 日<\/td><td>181 日以後<\/td><\/tr><\/tbody><\/table><\/div><ul><li>代碼 000＝應部分負擔者；Tw-DRGs 部分負擔採實際醫療費用百分比。住院期間身分變更 → 自變更確定生效之日起分段結清。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>相同疾病於同一醫院出院後 <b>14 日內<\/b>再住院 → 住院日數合併計算（以主診斷相同為同一疾病）。<\/p><\/div><ul><li>免部分負擔（住院）：001 重大傷病、002 分娩（妊娠 ≧20 週或胎兒 ≧500 g）、007 山地離島、008 離島轉診、009 其他、011 住院期間急性腦血管疾病發作後一個月內、012 器官受贈、013 器官捐贈；優先順序 006 → 001（011）→ 002、009、007。<\/li><\/ul><h4>轉歸代碼 d24<\/h4><div class=\"tbl\"><table><thead><tr><th>代碼<\/th><th>意義<\/th><th>代碼<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>依醫囑出院（治療出院）<\/td><td>A<\/td><td>病危自動出院<\/td><\/tr><tr><td>2<\/td><td>繼續住院<\/td><td>B<\/td><td>住院 30 日內身分變更切帳後轉為非 DRG<\/td><\/tr><tr><td>3<\/td><td>依醫囑出院改本院門診治療<\/td><td>D<\/td><td>醫院間轉急性後期照護<\/td><\/tr><tr><td>4<\/td><td>死亡<\/td><td>E<\/td><td>院內轉急性後期照護<\/td><\/tr><tr><td>5<\/td><td>一般自行要求出院<\/td><td>F<\/td><td>因療程需要計劃性出院<\/td><\/tr><tr><td>6<\/td><td>安排至其他醫院（轉院）<\/td><td>G/H/I/J<\/td><td>轉機構照護／轉照管中心長照評估／安排居家醫療／轉社區精神醫療<\/td><\/tr><tr><td>7<\/td><td>身份變更<\/td><td>K<\/td><td>轉自費身份繼續住院<\/td><\/tr><tr><td>8<\/td><td>逾假未歸或不假離院<\/td><td>L<\/td><td>下轉至適當院所<\/td><\/tr><tr><td>9<\/td><td>自殺<\/td><td>M<\/td><td>提早出院轉在宅急症照護（115 新增）<\/td><\/tr><tr><td>0<\/td><td>其它<\/td><td>|<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>申報 02025B 出院準備及追蹤管理費，轉歸代碼為必填；同時符合 G、H、I 優先填 G → H → I；同時符合 E 與 2 優先填 E。DRG 論日支付條件中「一般自行要求出院」為 5、轉院為 6。<\/p><\/div><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>轉歸代碼 1＝依醫囑出院；病危自動出院是 <b>A<\/b>（112 實務第 9 題）。<\/p><\/div><h4>醫令清單段（住院）<\/h4><div class=\"tbl\"><table><thead><tr><th>醫令類別 p2<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>1／2／3<\/td><td>用藥／診療／特殊材料<\/td><\/tr><tr><td>4<\/td><td>不得另計價之藥品、檢驗查或診療（論病計酬、定額給付案件）<\/td><\/tr><tr><td>7／8<\/td><td>代檢及轉檢／器官捐贈<\/td><\/tr><tr><td>A<\/td><td>Tw-DRG 醫令（A00000～F00001、H00000～H00032、J00001）<\/td><\/tr><tr><td>B／Z<\/td><td>部分負擔代碼改變已切帳（B、Z 需同時存在）<\/td><\/tr><tr><td>C<\/td><td>急診治療起迄時間<\/td><\/tr><tr><td>D／E／F<\/td><td>被替代之健保特材／尚未納入給付特材／不符給付規定之自費特材（D、E 同時呈現）<\/td><\/tr><tr><td>G／H／K<\/td><td>專案支付參考數值／HTA 自費診療項目／不計入醫療費用點數合計（護病比）<\/td><\/tr><tr><td>X<\/td><td>Tw-DRGs 支付通則得另行核實申報之項目（案件分類必為 5）<\/td><\/tr><tr><td>Y<\/td><td>器官捐贈來源資訊（醫令代碼 Y00000）<\/td><\/tr><\/tbody><\/table><\/div><ul><li>醫令代碼 p3：支付標準碼 6 碼、藥品 10 碼、特材 12 碼。法定傳染病虛擬醫令：NND001 結核病、NND006 疑似新型 A 流、NND007 確診流感、NND009 新冠併發重症、NND010 麻疹、NND011 德國麻疹、NND013/014 M 痘、NND004 其他。<\/li><li>執行時間：手術、麻醉、超音波、內視鏡、HTA 填至時分；病房費、放射、復健、處置填至年月日。未列項 3＝機械手臂輔助手術比照（p25 填 Da Vinci／Hugo assisted surgery）。<\/li><\/ul>"},{"id":"ch8-3","no":"8-4","title":"Tw-DRGs 媒體欄位","html":"<ul><li>支付通則：DRG 給付已含當次住院各項費用；不得移轉門急診、分次住院或另向病人收取給付範圍費用，違反者整筆不予支付。<\/li><li>註 21：同院急診當次轉住院：急診診療項目全部與 DRG 無關 → 門診申報；部分相關 → 相關者併住院，其餘門診；全部相關 → 併住院申報。<\/li><li>SPR 歷年：113/1–6 53,540；113/7–114/8 53,632；115/9–12 53,793。基本診療加成 3.4 版 7.1%／6.1%／5.0%（4.0 版草案 5.1%／2.2%／2.0%）。<\/li><li>上限臨界點＝超出費用占該 DRG 5.1% 之各 DRG 相同百分位值；例外：實際點數高於上限且 DRG 支付定額也高於上限 → 上限臨界點＝支付定額。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>論日支付點數＝（DRG 支付定額 ÷ 幾何平均住院日）× 實際住院天數 − J00001（被替代醫材）。<\/p><\/div><ul><li>核實申報項目（醫令類別 X）：多胞胎新生兒費、安胎費用、次診斷癌症之化療或放療、呼吸器 57001B–57002B、57023B、洗腎 58001C、生物製劑、新增無替代診療項目。<\/li><\/ul><h4>DRG Add-on（新特材、術式不變）計算<\/h4><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>加計點數 ＝ 取低（新特材健保價 × 50%，（實際費用 − 定額）× 70%）。<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>情境（特材健保價 25,000、定額 50,000、上限 80,000）<\/th><th>計算<\/th><th>給付<\/th><\/tr><\/thead><tbody><tr><td>實際 60,000<\/td><td>取低（12,500，10,000×70%＝7,000）＝7,000<\/td><td>57,000<\/td><\/tr><tr><td>實際 90,000（超過上限）<\/td><td>取低（12,500，30,000×70%＝21,000）＝12,500<\/td><td>50,000＋10,000×0.8＋12,500＝70,500<\/td><\/tr><\/tbody><\/table><\/div><h4>點數清單段 DRG 欄位<\/h4><div class=\"tbl\"><table><thead><tr><th>欄位<\/th><th>重點<\/th><\/tr><\/thead><tbody><tr><td>案件分類 d1／Tw-DRG 碼 d18<\/td><td>d1＝5；d18 為 5 碼 DRG<\/td><\/tr><tr><td>支付型態 d19<\/td><td>上下限範圍內／高於上限／低於下限核實／無權重核實／個案 &lt;20 核實／論日支付（d24 為 5 或 6、住院日 &lt; 平均住院日、介於上下限）<\/td><\/tr><tr><td>不適用註記 d102<\/td><td>所有案件分類均需填；代碼見第 1 章（1 癌症…M HTA、N 多胎、P 主要手術為健保不給付）<\/td><\/tr><tr><td>申請費用 d85<\/td><td>非 DRG：醫療費用 − 部分負擔＋d112；論病例：定額 − 被替代特材 − 部分負擔＋d112；DRG：F00000 或 F00001 − G00001 已收部分負擔＋d112；註記 9 申請費用＝0<\/td><\/tr><\/tbody><\/table><\/div><h4>DRG 醫令代碼（醫令類別 A）<\/h4><div class=\"tbl\"><table><thead><tr><th>代碼<\/th><th>意義<\/th><th>代碼<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>A00000<\/td><td>相對權重 RW<\/td><td>A10000–A10003<\/td><td>基本診療加成（醫中 7.1%／區域 6.1%／地區 5.0%／無）<\/td><\/tr><tr><td>A00001<\/td><td>標準給付額 SPR<\/td><td>A20000–A30003<\/td><td>兒童加成（MDC15、非 MDC15 內／外科）<\/td><\/tr><tr><td>A00002<\/td><td>幾何平均住院日<\/td><td>A40000–A40003<\/td><td>CMI 加成（無／1%／2%／3%）<\/td><\/tr><tr><td>A00003<\/td><td>下限臨界點<\/td><td>A50000–A50003／A60001<\/td><td>其他加成／山地離島 2%<\/td><\/tr><tr><td>A00004<\/td><td>醫療服務點數（不含外加項）<\/td><td>B00000<\/td><td>DRG 支付定額＝A00000 × A00001 ×（1＋各加成）<\/td><\/tr><tr><td>A00005<\/td><td>急＋慢性病床天數<\/td><td>C00000–C00004<\/td><td>上限臨界點計算<\/td><\/tr><tr><td>A00006<\/td><td>上限臨界點<\/td><td>D00000–D00003<\/td><td>邊際成本（D00001＝(A00004 − 上限)×0.8；D00003 先天性 ×1）<\/td><\/tr><tr><td>代碼<\/td><td>意義<\/td><td><\/td><td><\/td><\/tr><tr><td>E00000–E00005<\/td><td>支付點數：E00000 範圍內＝B00000＋D00000；E00001 高於上限＝定額＋邊際成本；E00002 低於下限、E00003 無權重、E00004 個案 &lt;20 ＝核實 A00004；E00005 論日＝B00000 ÷ A00002 × A00005<\/td><td><\/td><td><\/td><\/tr><tr><td>H00000–H00032<\/td><td>第二類 Add-on 得加計點數（二者擇低）<\/td><td><\/td><td><\/td><\/tr><tr><td>F00000／F00001<\/td><td>實際支付點數：F00000＝E00000/E00001/E00005＋類別 X＋H 點數 − J00001；F00001＝E00002/E00003/E00004＋類別 X＋H<\/td><td><\/td><td><\/td><\/tr><tr><td>G00000／G00001<\/td><td>部分負擔代碼改變已切帳之個案／已收取之部分負擔（免部分負擔填 0）<\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h4>器官捐贈者及受贈者<\/h4><ul><li>器官摘取（捐贈者）與移植（受贈者）費用分開申報（不論是否同院）；受贈者醫令清單註明捐贈院所代號、日期、捐贈者 ID（醫令 Y00000：0 境內國民／居留、2 其他、1 境外）；無健保捐贈者就醫序號填 IC98。<\/li><\/ul>"},{"id":"ch8-4","no":"8-5","title":"運用實務","html":"<ul><li>住院總表檢核錯誤明細表、臺北區個別醫院總額保障項目定義（115.07.01 修訂）需正確申報。<\/li><li>臨床運用：特定治療項目代號 H2/H3/H6、HA–HD、H8（慢箋一次領兩個月須具證明）、H9；提前領藥虛擬醫令 R001–R004（R005–R008 不開放診間點選）；超音波執行時間起迄（第一張至最後一張影像，或報到時間＋平均檢查時間）；開 CT/MRI 前需查閱雲端影像，重複開立點選 S001–S004；血友病藥品調劑時輸入批號、發藥二次複核。<\/li><\/ul>"}]},{"id":"apx","label":"附錄 A","title":"講義未涵蓋的考古題","sub":"健保法、醫療辦法、藥事特材、政策趨勢","meta":"112 年共 24 題，今年 8 堂講義沒有專門講，但簡章範圍仍包含","intro":"<div class=\"box box--more\" data-key=\"1\"><span class=\"box__k\">延伸<\/span><p>這些題目出自 112 年其他講師，今年講義沒有專門講，但簡章仍列「健保法及相關法規」「藥品、特材相關法規」「就醫相關作業規定」。以下整理每題背後的規定，題目本身在隨堂測驗。<\/p><\/div>","secs":[{"id":"apx-0","no":"A-1","title":"健保法與就醫規定（全民健康保險醫療辦法）","html":"<div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>處方用藥每次以不超過 <b>7 日<\/b>份為原則；慢性病得一次給予 <b>30 天<\/b>以內用量；慢箋須於上次給藥期間屆滿前 <b>10 日<\/b>內才可憑原處方箋再次調劑。<\/p><\/div><ul><li>慢箋總用藥量可達 3 個月（每次給藥 30 日內、最多調劑 3 次）。<\/li><li>一次領取慢箋總用藥量（需切結）：遠洋漁船船員出海作業或國際航線船舶船員出海服務等（申報代碼 HB、HC；返回離島 HA、罕病 HD、出國 H8）。認定特殊病人的機關是「保險人」，不是衛生主管機關；癌症病人不在列。<\/li><li>持慢箋且所在地無特約藥局 → 得至其他特約醫院或衛生所調劑。<\/li><li>重大傷病免部分負擔限於與重大傷病相關之診療：因重大傷病住院須併行他科治療，或住院期間依病情需要併行重大傷病之診療。非相關診療申報免部分負擔者，追扣該筆部分負擔。<\/li><li>轉診：門診、急診手術後之同院所首次回診，視同轉診，無需持轉診單（部分負擔代碼第二碼「4」）。<\/li><li>健保法：保險人每年度應擬訂抑制資源不當耗用之改善方案（減少無效醫療）。<\/li><li>健保法第 42 條：支付標準得先辦理 HTA，考量人體健康、醫療倫理、醫療成本效益及本保險財務；高危險、昂貴或有不當使用之虞者，應於使用前報經保險人審查同意。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>112 專業第 30 題把「應於使用前審查同意之項目，於情況緊急時得先行實施」判為錯誤選項；但第 7 章審查辦法有緊急情形先處理再報備補件的規定，考前建議對照健保法原文。<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>健保法不給付（節錄）<\/th><th>健保給付<\/th><\/tr><\/thead><tbody><tr><td>藥癮治療、美容外科、非外傷治療性齒列矯正、預防性手術、人工協助生殖、變性手術<\/td><td>精神病日間照護、外傷治療性齒列矯正、非預防性手術<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"apx-1","no":"A-2","title":"藥事、特材與雲端系統","html":"<ul><li>注射藥品：電解質及營養靜脈輸液應說明理由以積極治療為目的；經醫師診斷不能口服或口服無效時使用；癌症化療藥品經藥師調劑後<b>得<\/b>由病人攜回使用；糖尿病 insulin 經醫師指導可由病人攜回注射。<\/li><li>健保不予給付之藥品：預防接種疫苗、避孕用藥、生髮劑等。<\/li><li>藥物給付項目及支付標準第 12 條不予支付：經保險人認定非屬醫療必需或缺乏經濟效益者、不符藥品許可證適應症及給付規定者、預防接種所用之疫苗。臨床價值相近於已收載核價參考品之新藥仍可依程序核價收載。<\/li><li>健保署管控藥費措施：藥品給付規定（昂貴或易浮濫藥品需事前審查）、檔案分析不予支付指標與專業審查、建構健保雲端藥歷系統。「每年逐步擴大不給付藥品項目」不是管控措施。<\/li><\/ul><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>健保醫療資訊雲端查詢系統：為提升就醫與用藥安全而建置；可查 12 類資訊；限<b>具資格之醫事人員以醫事人員卡<\/b>查詢，不是各職類人員皆可查；其他院所可調閱影像及報告。<\/p><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>特材管理費按實際核付特材費用 5% 支付，上限 1,500 點；整組使用者<b>不得<\/b>單獨加計特材管理費。冠狀動脈塗藥支架、人工水晶體為自付差額特材；特材完成審議程序後、尚未納入給付前，得向民眾收取費用。<\/p><\/div><ul><li>對照第 1 章：DRG Add-on 特材 &lt;3 萬點加計 5%、≧3 萬點定額 1,500 點。<\/li><\/ul>"},{"id":"apx-2","no":"A-3","title":"健保政策趨勢與醫院管理","html":"<ul><li>台灣人口結構：超高齡化、人口紅利減少、死亡人數大於出生人數；65 歲以上長者是變多，不是變少。<\/li><li>在宅醫療成功關鍵：社區開業醫師的支持、醫院作為後盾、衛生所加入；「末期病患為主要照護對象」不是關鍵因素。<\/li><li>平衡計分卡（BSC）四大構面：顧客、內部流程、財務、學習與成長。<\/li><li>醫療支出成長快速的主因：醫療科技快速發展、民眾對健保期望與日俱增、人口老化（醫療糾紛增加不是主因）。<\/li><li>醫療科技快速發展的正面影響：是對未來治療的投資。<\/li><\/ul><div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>風險脆弱度評估工具＝HVA（Hazard Vulnerability Analysis，災害脆弱度分析），與第 2 章 BCM 相關。<\/p><\/div><ul><li>醫療照護與連續性照護發展趨勢：精準醫療／健康、人工智慧、整合照護；醫院擴床不是趨勢。<\/li><li>西醫住院病患中醫特定疾病輔助醫療（案件分類 22）：C8 腦血管疾病、JC 顱腦損傷、JD 脊髓損傷、JQ 呼吸困難、JS 術後疼痛（不含骨折）。<\/li><\/ul>"}]},{"id":"fin","label":"最終章","title":"常考欄位與計算題型總整理","sub":"欄位速查、數字速記、9 大計算題型","meta":"實務科「簡答 5 題（20 分）＋申報實例演練 2 題（30 分）」專用｜整合第 1、4、6、8 章","intro":"<div class=\"box box--more\" data-key=\"1\"><span class=\"box__k\">延伸<\/span><p>112 年考古題只收錄單選題，簡答與申報演練沒有公開題目。本章依講義整理最可能考的欄位代碼、數字與計算；18 題簡答參考答案在「簡答閃卡」。<\/p><\/div>","secs":[{"id":"fin-0","no":"F-1","title":"常考欄位速查","html":"<div class=\"tbl\"><table><thead><tr><th>欄位<\/th><th>門診<\/th><th>住院<\/th><\/tr><\/thead><tbody><tr><td>資料格式<\/td><td>10<\/td><td>20<\/td><\/tr><tr><td>申報方式／類別<\/td><td>方式 1 書面、2 媒體、3 連線｜類別 1 送核、2 補報<\/td><td>同左<\/td><\/tr><tr><td>案件分類<\/td><td>d1：01 一般、02 急診、03 門診手術、04 慢性病、05 洗腎、06 結核、07 遠距、08 慢箋、09 其他專案、C1 論病例、E1 試辦計畫、A1/A2/A5/A6/A7 居家類、A3 預防保健；代辦 B1、B6–B9、BA、C4、C5、D1、D2、DF<\/td><td>d1：1 一般、2 論病例、3 特定、4 試辦、5 Tw-DRGs、6 安寧、7 愛滋滿 2 年；代辦 A1–A4、AZ、B1、B2、C1、C4、C5、DZ<\/td><\/tr><tr><td>給付類別<\/td><td>d14：1 職傷、2 職業病、3 普通傷害、4 普通疾病、6 自然生產、8 天災、9 呼吸照護<\/td><td>d7：同左＋6 自然生產、7 剖腹生產、A 安寧、C 糖尿病、E 氣喘、M C 肝<\/td><\/tr><tr><td>部分負擔<\/td><td>d15 三碼（醫院別 A/B/C/D × 方式 0 急診 1 門診 2 加收 3 轉診 4 出院術後回診 × 身分 2 一般 3 殘障）；009 慢箋／預防保健<\/td><td>d4：000 應負擔；001 重大傷病、002 分娩、011 住院中急性腦血管一個月內、012/013 器官受贈／捐贈<\/td><\/tr><tr><td>就醫序號<\/td><td>d29：0001；IC02–04 慢箋；IC21/22 成健；IC06 職災；V001 虛擬卡<\/td><td>d17：0001；IC98 非保險對象器官捐贈；IC06、IC08、IC09<\/td><\/tr><tr><td>病患來源／轉診<\/td><td>d16：1 他院轉來、2 慢連處方；d18 轉出 Y → d55 必填（不明 9999999999）<\/td><td>d16：1 初複診、2 急診、3 轉診、4 同疾病 14 天內再入院、7 同次切帳<\/td><\/tr><tr><td>轉歸代碼<\/td><td>—<\/td><td>d24：1 依醫囑出院、4 死亡、5 自行要求出院、6 轉院、A 病危自動出院、E 院內轉 PAC、D 院際轉 PAC、K 轉自費續住；02025B 必填<\/td><\/tr><tr><td>就醫科別<\/td><td>d8：整合照護多科 → 當日第一科<\/td><td>d9：轉科 → 出院時科別<\/td><\/tr><tr><td>診斷處置<\/td><td>主＋次診斷 5 個、手術 3 個；小數點免填<\/td><td>主次診斷、處置各 20 欄<\/td><\/tr><tr><td>醫令類別<\/td><td>p3：0 診察、1 藥、2 診療、3 特材、4 不另計價、9 藥服、D/E/F 自費特材、G 虛擬醫令、H HTA<\/td><td>p2：1、2、3、4、7 代轉檢、8 器捐、A DRG、B/Z 切帳、C 急診起迄、D/E/F、K 護病比、X DRG 核實、Y 器捐來源<\/td><\/tr><tr><td>處方調劑方式<\/td><td>d28：0 自行、1 交付、2 未開處方、6 偏遠或緊急自行調劑<\/td><td>—<\/td><\/tr><tr><td>診療部位<\/td><td>TKR、THR、白內障、ESWL、疝氣、關節內注射劑（FBT01）→ R／L／B；CT／MRI／PET／高頻熱凝 → 部位代碼；放療 C 根治、P 緩解<\/td><td>同左<\/td><\/tr><tr><td>DRG 欄位<\/td><td>—<\/td><td>d18 DRG 碼 5 碼、d19 支付型態、d102 不適用註記（P＝主要手術健保不給付、M＝HTA）<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"fin-1","no":"F-2","title":"數字速記表","html":"<div class=\"tbl\"><table><thead><tr><th>日數<\/th><th>意義<\/th><th>比率與次數<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>次月 20 日前<\/td><td>當月費用申報<\/td><td>85%<\/td><td>新院所暫付成數<\/td><\/tr><tr><td>6 個月內<\/td><td>申報期限（次月 1 日起）<\/td><td>2.5／90 百分位<\/td><td>DRG 下限／上限臨界點<\/td><\/tr><tr><td>15／30 日<\/td><td>暫付（電子／書面）<\/td><td>80%<\/td><td>DRG 超過上限部分<\/td><\/tr><tr><td>10／20 日<\/td><td>通知更正（電子／書面）；補正 10 日<\/td><td>7.1／6.1／5.0%<\/td><td>DRG 基本診療加成<\/td><\/tr><tr><td>60 日<\/td><td>送核申復補報核定、申復期限、申復核定、爭議審議申請<\/td><td>1／2／3%<\/td><td>CMI &gt;1.1／&gt;1.2／&gt;1.3<\/td><\/tr><tr><td>3＋3 個月<\/td><td>爭審會審定（可延長一次）<\/td><td>53%<\/td><td>手術一般材料費（未表列）<\/td><\/tr><tr><td>2 年<\/td><td>檔案分析追扣期限<\/td><td>1、0.5、0.5、0<\/td><td>同類手術成數<\/td><\/tr><tr><td>2 週<\/td><td>事前審查核定（逾期視為同意）<\/td><td>1、1、0.5、0<\/td><td>不同類手術成數<\/td><\/tr><tr><td>5 年<\/td><td>帳冊保存、個資軌跡紀錄保存<\/td><td>60／30／20%<\/td><td>兒童加成（&lt;6 月／&lt;2 歲／&lt;7 歲）<\/td><\/tr><tr><td>14 日<\/td><td>同疾病再住院合併計算<\/td><td>100／80／60%<\/td><td>提升兒童加成<\/td><\/tr><tr><td>30 日<\/td><td>住院超過 30 日不適用 DRG；居家醫囑效期<\/td><td>20%<\/td><td>急診檢查加成（1h／3h）<\/td><\/tr><tr><td>92 日<\/td><td>繼續住院每次申報上限<\/td><td>30%<\/td><td>假日門診第二部項目加成<\/td><\/tr><tr><td>180／30／3 日<\/td><td>排程檢查／排程復健／一般處方有效期<\/td><td>8 折<\/td><td>X 光第二張以後<\/td><\/tr><tr><td>10 日<\/td><td>慢箋屆滿前可再調劑<\/td><td>65%<\/td><td>論病例基本診療項目執行率<\/td><\/tr><tr><td>|<\/td><td>5 次／6 次／6 小時<\/td><td>住院會診上限／復健療程／急診留觀<\/td><td><\/td><\/tr><tr><td>|<\/td><td>45 人次<\/td><td>115.08 基層合理門診量<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"fin-2","no":"F-3","title":"計算題型","html":"<div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>申報演練先寫公式再代數字，就算算錯也有步驟分。<\/p><\/div><h4>題型 1：門診申請點數<\/h4><ul><li>例：地區醫院一般門診（一般身分），用藥 250 點、檢驗 200 點、診察費 352 點、藥事服務費 54 點，無特材。求部分負擔代碼、合計點數、申請點數。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>步驟<\/th><th>計算<\/th><\/tr><\/thead><tbody><tr><td>1. 部分負擔代碼<\/td><td>地區醫院 C＋一般門診 1＋一般身分 2 → C12<\/td><\/tr><tr><td>2. 部分負擔<\/td><td>基本 80 元＋藥品（&gt;100 元每 100 元加收 20 元：250 元 → 第 2 級）40 元＝120<\/td><\/tr><tr><td>3. 合計點數 d39<\/td><td>250＋200＋0＋352＋54＝856<\/td><\/tr><tr><td>4. 申請點數 d41<\/td><td>856 − 120＝736<\/td><\/tr><\/tbody><\/table><\/div><ul><li>例題數字為示意，部分負擔金額依第 8 章講義表。<\/li><\/ul><h4>題型 2：兒童加成與假日加成<\/h4><ul><li>例 A：1 歲幼兒門診施行 54005C 耳咽管通氣術－單側（224 點，屬提升兒童加成項目）。6 個月～未滿 2 歲 → 提升兒童加成 80% → 224 × 1.8＝403.2 點（若為一般兒童加成項目則 ×1.3）。<\/li><li>例 B：地區醫院週六門診，腹部 X 光連續拍 2 張（32007C 200 點）。第 1 張 200，第 2 張以後 8 折 160（另一代碼）→ 假日第二部項目 +30% →（200＋160）× 1.3＝468 點；診察費不加 30%，但可另報 00226B 週六加計 100 點。<\/li><\/ul><div class=\"box box--warn\" data-key=\"1\"><span class=\"box__k\">易混<\/span><p>若當日轉住院合併住院申報 → 診療項目不能加成 30%。<\/p><\/div><h4>題型 3：手術費（同一手術野多項手術）<\/h4><div class=\"tbl\"><table><thead><tr><th>練習<\/th><th>計算<\/th><th>合計<\/th><\/tr><\/thead><tbody><tr><td>左側陰囊水腫切除 78407C（5,425）＋包皮 1.5 cm 皮下腫瘤摘除 62010C（1,623）→ 不同類<\/td><td>5,425 × 1 × 1.53＝8,300.25；1,623 × 1 × 1.53＝2,483.19<\/td><td>10,783.44<\/td><\/tr><tr><td>雙側腹股溝疝氣修補（無腸切除）75607C（11,292）→ 同類／兩側<\/td><td>11,292 × 1 × 1.53＝17,276.76；11,292 × 0.5 × 1.53＝8,638.38<\/td><td>25,915.14<\/td><\/tr><tr><td>車禍肋骨骨折大量血胸 ISS 16，急診開胸肋骨骨折開放復位 67003B（9,406）、簡單胸廓擴創 67008B（5,690）<\/td><td>重大創傷 ISS≧16 胸腹手術每項 100%：9,406 × 1.83＋5,690 × 1.83<\/td><td>27,625.68<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>1.53＝手術費 1＋一般材料費 53%；1.83 為講義急診手術算式（手術費加計 30%＋材料費 53%）。第一次手術併發症之再手術 → 點數 50%、只算一項。<\/p><\/div><h4>題型 4：Tw-DRG 支付點數<\/h4><div class=\"box box--must\" data-key=\"1\"><span class=\"box__k\">必背<\/span><p>DRG 定額＝RW × SPR ×（1＋基本診療＋兒童＋CMI＋山地離島）。A 區低於下限 → 核實；B 區 → 定額；C 區 → 定額＋（實際 − 上限）× 80%；AAD／轉院 → 定額 ÷ GMLOS × 住院日。<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>例<\/th><th>條件<\/th><th>計算<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>醫學中心，RW 0.8617，SPR 53,632，無兒童與 CMI 加成<\/td><td>0.8617 × 53,632 ×（1＋7.1%）＝49,496 點（改用 SPR 53,793 → 49,645）<\/td><\/tr><tr><td>B<\/td><td>同上，上限臨界點 90,000、實際 110,000（C 區）<\/td><td>49,496＋（110,000 − 90,000）× 0.8＝65,496 點；&lt;18 歲先天性疾病超過部分 ×100%<\/td><\/tr><tr><td>C<\/td><td>同上，GMLOS 5 天，住 2 天自行要求出院（d24＝5），費用介於上下限<\/td><td>49,496 ÷ 5 × 2＝19,798.4 點（論日，E00005）<\/td><\/tr><tr><td>D<\/td><td>區域醫院、外科系、1 歲病童（非 MDC15），RW 1.2、SPR 53,793<\/td><td>1.2 × 53,793 ×（1＋6.1%＋21%）＝82,045 點（醫學中心 7.1% 則為 82,691）<\/td><\/tr><tr><td>E<\/td><td>實際醫療點數低於下限臨界點（A 區）<\/td><td>依實際醫療點數核實申報（E00002）<\/td><\/tr><\/tbody><\/table><\/div><h4>題型 5：DRG Add-on 新特材<\/h4><ul><li>特材健保價 25,000、DRG 定額 50,000、上限 80,000；加計點數＝取低（25,000 × 50%，（實際 − 定額）× 70%）。<\/li><li>實際 60,000：取低（12,500，7,000）＝7,000 → 50,000＋7,000＝57,000。<\/li><li>實際 90,000：取低（12,500，（80,000 − 50,000）× 70%＝21,000）＝12,500 → 50,000＋（90,000 − 80,000）× 0.8＋12,500＝70,500。<\/li><\/ul><h4>題型 6：住院部分負擔<\/h4><ul><li>例：急性病房住院 40 天，第 1–30 天醫療費用 300,000 點、第 31–40 天 80,000 點（非免部分負擔身分）。300,000 × 10%＋80,000 × 20%＝30,000＋16,000＝46,000。<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>病房<\/th><th>5%<\/th><th>10%<\/th><th>20%<\/th><th>30%<\/th><\/tr><\/thead><tbody><tr><td>急性<\/td><td>–<\/td><td>≦30 日<\/td><td>31–60 日<\/td><td>≧61 日<\/td><\/tr><tr><td>慢性<\/td><td>≦30 日<\/td><td>31–90 日<\/td><td>91–180 日<\/td><td>≧181 日<\/td><\/tr><\/tbody><\/table><\/div><ul><li>DRG 案件同樣依實際醫療費用百分比計算；部分負擔另有每次及全年上限，講義未列，考前可查健保署最新公告。<\/li><\/ul><h4>題型 7：天數計算（算進不算出）<\/h4><ul><li>例：10/1 入院、10/5 出院。病房費、護理費（算進不算出）：10/1–10/4＝4 天；住院診察費（算進又算出）：10/1–10/5＝5 天；護理費「第一天」只有 10/1 一天。<\/li><li>例：急診留觀 5 小時離院 → 急診觀察床不得申報（需滿 6 小時）；留觀 30 小時 → 超過 24 小時，依住院病房費算進不算出計算；急診觀察床診察費自第二天起報。<\/li><\/ul><h4>題型 8：折付與合理量<\/h4><ul><li>例 A：醫院醫師支援診所，當月全國歸戶點數 14 萬點 → 100,000 × 1＋40,000 × 0.75＝130,000 點（折付 1 萬點）。<\/li><li>例 B：醫學中心藥師 1 月工作 30 天，門急診合理量每日 70 件 → 2,100 件；實際調劑 2,500 件。超過的 400 件藥事服務費依支付點數 50% 支付。醫師兼藥師親自調劑每日 &gt;50 件 → 超過部分不給付。<\/li><li>例 C：一般地區中醫診所，1 位專任中醫師當月看診 28 天、門診 1,100 人次。看診天數以 26 天計 → 1,100 ÷ 26 ≒ 43 人／日 → 1～30 人次部分 A04（220 點）、31～43 人次部分 A06（150 點）。<\/li><\/ul><h4>題型 9：急診加成判斷<\/h4><div class=\"tbl\"><table><thead><tr><th>情境<\/th><th>能否急診加成 20%？<\/th><\/tr><\/thead><tbody><tr><td>CBC 檢體 10:00 送達、10:40 正式報告<\/td><td>✅ 可（1 小時內）<\/td><\/tr><tr><td>血液培養 13016B，報告 2 天後<\/td><td>❌ 不可（超過 1 小時）<\/td><\/tr><tr><td>腹部超音波醫囑 21:00、報告 23:30<\/td><td>✅ 可（3 小時內）<\/td><\/tr><tr><td>CT 醫囑 08:00、報告 12:00<\/td><td>❌ 不可（超過 3 小時，除非詳述檢查時間過長之理由）<\/td><\/tr><tr><td>Blood gas、急診常規檢查<\/td><td>❌ 不可<\/td><\/tr><tr><td>重大外傷（ISS≧16）2 小時內緊急手術<\/td><td>重大外傷加成 +100%（2～4 小時 +60%），與一般急診加成擇一<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"fin-3","no":"F-4","title":"簡答題作答技巧","html":"<div class=\"box box--mnem\" data-key=\"1\"><span class=\"box__k\">口訣<\/span><p>簡答題用「條列＋數字」寫：先寫結論，再列 3～5 點，每點附關鍵數字（如 60 日、2.5 百分位、80%）。每題準備 3～5 個重點，3～4 分鐘內寫完。<\/p><\/div><ul><li>18 個最可能出簡答的主題與參考答案，請到「簡答閃卡」逐題練習。<\/li><\/ul>"}]}],"questions":[{"ch":"ch1","src":"112 專業 #3","stem":"Tw-DRGs 制度實施，醫療機構可透過哪些對策增進經營效益？","ans":"B","expl":"DRG 是定額包裹給付，延長住院只會增加成本；病歷完整才能正確編碼、落入正確 DRG。","opts":["平均住院日要提高","病歷記載完整","延後病人出院日","以上皆是"],"id":"q00","type":"pro"},{"ch":"ch1","src":"112 專業 #13","stem":"下列何者為 Tw-DRG 醫療效率監控之面向？","ans":"C","expl":"「效率」看的是支付點數 vs. 實際醫療點數的差異；A、D 屬費用轉移／就醫行為監控，B 屬編碼（upcoding）監控。","opts":["費用轉移至門診","嚴重度之變化","支付點數與實際醫療點數之差異","分次住院或不當轉院"],"id":"q01","type":"pro"},{"ch":"ch1","src":"112 專業 #22","stem":"有關 Tw-DRGs 名詞定義，何者為是？","ans":"C","expl":"A 是 CMI、B 是 RW、D 是 RW 的定義。","opts":["RW 為醫院收治病患疾病嚴重度指數","SPR 是某 DRG 平均每人次點數 / 全國平均每人次點數","MDC 為 PREMDC、MDC1 至 MDC24","CMI 為反映各 DRG 資源耗用情形"],"id":"q02","type":"pro"},{"ch":"ch1","src":"112 專業 #25","stem":"哪個主要診斷類別因性別因素影響 DRG 落點？","ans":"C","expl":"MDC 12 男性生殖系統（MDC 13 女性生殖系統）。","opts":["MDC 5","MDC 10","MDC 12","MDC 15"],"id":"q03","type":"pro"},{"ch":"ch1","src":"112 專業 #29","stem":"有關 Tw-DRG 現行制度，何者為是？","ans":"C","expl":"A 在 112 年出題當時並非 2023 年版，故判為錯；但現行 3.4 版已改用 2023 年版 ICD-10-CM/PCS（115 講義），今年若再考要注意版本已更新。B：1,068 項是 3.4 版；D：CMI 需 >1.1 才加成。","opts":["以美國 2023 年 ICD-10-CM/PCS 為基礎","110 年 1–6 月使用 4.0 版 1,068 項","AAD 或轉院、住院日數小於幾何平均住院日且費用介於上下限臨界點者，DRG 定額 ÷ 幾何平均住院日，論日支付","CMI >1.0 ≦1.1 加成 1%"],"id":"q04","type":"pro"},{"ch":"ch1","src":"112 專業 #36","stem":"有關 Tw-DRGs 之敘述，何者為非？","ans":"A","expl":"目前只實施到第二階段（103.7）。住院案件分類 5 = Tw-DRGs 案件。","opts":["目前實施到第三階段","限住院案件適用","Tw-DRG 碼屬已實施項目者，案件分類為 5","DRG 與論病例計酬同是包裹給付"],"id":"q05","type":"pro"},{"ch":"ch1","src":"112 專業 #43","stem":"有關 DRG 分類結果，何者為非？","ans":"D","expl":"應為組內差異小、組間差異大。","opts":["周延互斥","易於管理","組內差異小","組間差異小"],"id":"q06","type":"pro"},{"ch":"ch1","src":"112 專業 #44","stem":"實際醫療費用低於下限臨界點者，應如何申報？","ans":"B","expl":"","opts":["按比例支付","實支實付","依 DRG 定額支付","以上皆非"],"id":"q07","type":"pro"},{"ch":"ch1","src":"112 專業 #48","stem":"以疾病嚴重度校正後之平均住院費用稱之？","ans":"B","expl":"HBR = 醫院平均費用 ÷ 醫院 CMI。","opts":["SPR","HBR","RW","MDC"],"id":"q08","type":"pro"},{"ch":"ch1","src":"112 實務 #20","stem":"Tw-DRGs 支付制度設計原則適用於下列何種病人？","ans":"C","expl":"","opts":["門診","急診","住診","以上皆可"],"id":"q09","type":"prac"},{"ch":"ch1","src":"112 實務 #24","stem":"是否為有效合併症／併發症，其判斷邏輯為何？","ans":"A","expl":"","opts":["次診斷對主診斷的關係","次診斷對次診斷的關係","主診斷對次診斷的關係","以上皆是"],"id":"q10","type":"prac"},{"ch":"ch1","src":"112 專業 #27","stem":"有關健保論病例計酬之敘述，何者為非？","ans":"B","expl":"包裹給付著眼於治療個案，不會因此提高預防保健意願（論人計酬才有誘因）。","opts":["以病人疾病診斷、年齡及合併症等關係群作為給付標準","會增加醫療院所執行預防保健的意願","是一種前瞻性支付制度","鼓勵院所主動控制醫療費用、分擔財務風險"],"id":"q11","type":"pro"},{"ch":"ch2","src":"自擬練習 1","stem":"依個資法，下列何者不屬於特種個資？","ans":"D","expl":"婚姻屬一般個資。特種個資：病歷、醫療、基因、性生活、健康檢查、犯罪前科。","opts":["病歷","基因","健康檢查","婚姻狀況"],"id":"q12","type":"self"},{"ch":"ch2","src":"自擬練習 2","stem":"資訊安全 CIA 三要素中，「數位簽章」主要用來確保何者？","ans":"B","expl":"講義將數位簽章列為完整性範例；機密性＝驗證授權加密；可用性＝重複建置、容錯移轉。","opts":["機密性","完整性","可用性","不可否認性"],"id":"q13","type":"self"},{"ch":"ch2","src":"自擬練習 3","stem":"依 2023 年修正之個資法第 48 條，非公務機關未採行適當安全措施，情節重大者處多少罰鍰？","ans":"C","expl":"一般違反：2 萬～200 萬＋限期改正；屆期未改正或情節重大：15 萬～1,500 萬。","opts":["2 萬～20 萬","2 萬～200 萬","15 萬～1,500 萬","50 萬～5,000 萬"],"id":"q14","type":"self"},{"ch":"ch2","src":"自擬練習 4","stem":"「3-2-1 備份原則」何者正確？","ans":"B","expl":"","opts":["3 種媒體、2 份備份、1 份雲端","至少 3 份、2 種媒體、1 份存放異地","3 天一次、2 週檢查、1 月還原","以上皆非"],"id":"q15","type":"self"},{"ch":"ch2","src":"自擬練習 5","stem":"個資法第 29 條，非公務機關的民事賠償責任屬於？","ans":"B","expl":"非公務機關能證明無故意或過失才免責；公務機關才是無過失責任。","opts":["無過失責任","舉證責任倒置的過失責任","僅故意才負責","不負民事責任"],"id":"q16","type":"self"},{"ch":"ch2","src":"自擬練習 6","stem":"委外廠商需要遠端連線維護醫院系統，下列何者錯誤？","ans":"C","expl":"開放期間以短天期為限。","opts":["採「原則禁止、例外允許」","採多因子驗證","為方便維護，長期開放並使用金鑰免密碼登入","結束後關閉連線並更換 VPN 密碼"],"id":"q17","type":"self"},{"ch":"ch3","src":"112 專業 #10","stem":"有關 ICD-10-CM 分類代碼的構造，何者為是？","ans":"D","expl":"","opts":["包括字母及數字組成的 3 位代碼，及第 4 至 6 位小數碼，最多至 7 位碼","類目碼 A00 至 Z99，大多依解剖學為主軸，腫瘤以病因學為主軸","代碼有第 7 位碼而未編至第 7 位碼時，即不是有效代碼","以上皆是"],"id":"q18","type":"pro"},{"ch":"ch3","src":"112 專業 #23","stem":"ICD-10-PCS 由 7 位碼組成，下列何者為非？","ans":"B","expl":"第 3 碼是 Root Operation；Body Part 是第 4 碼。口訣：章、系、術、部、途、裝、修。","opts":["第 1 位碼 SECTION","第 3 位碼 BODY PART","第 5 位碼 APPROACH","第 6 位碼 DEVICE"],"id":"q19","type":"pro"},{"ch":"ch3","src":"112 專業 #26","stem":"美國 2021 年版 ICD 編碼多增加的章節？","ans":"D","expl":"PCS Section X = New Technology。","opts":["中醫","洗腎","牙醫","新增科技"],"id":"q20","type":"pro"},{"ch":"ch3","src":"112 專業 #49","stem":"死因統計使用哪種分類系統？","ans":"A","expl":"死因用 WHO 的 ICD-10（2008 年起）；ICD-10-CM 是健保疾病申報用。","opts":["ICD-10","ICD-10-CM","ICD-9","ICD-9-CM"],"id":"q21","type":"p  5、7 章","a":["審查辦法第 2 條：程序審查、專業審查、事前審查、實地審查、檔案分析","程序審查＝電腦檢核；專業審查＝病歷抽樣由審查醫藥專家依醫學原理、病情需要、治療緩急、醫療能力認定","隨機抽樣：依比例抽樣，核減結果等比例回推母體","立意抽樣：針對異常或高風險案件抽審，不回推","依分析結果得免除抽審、減少隨機、增加立意、加重審查或全審（第 22 條）"]},{"q":"申復與爭議審議的程序與期限","src":"第 7 章","a":["收到核減通知後 60 日內，列舉理由、備齊文件向健保署申復（第 32 條）","健保署受理後 60 日內核定；不得交原審查醫藥專家複審；不得就同一案件再追扣同一費用（第 33 條）","仍有異議 → 核定通知到達次日起 60 日內向爭審會申請爭議審議，應檢送原送審病歷","爭審會原則 3 個月內審定，必要時延長一次最長 3 個月","不服 → 訴願 → 行政訴訟；期限以通知日／送達日起算，電子送達以 VPN 點閱時間為準"]},{"q":"多元支付制度（論量、論病例、總額、論質、論日、論人）的優缺點","src":"第 4 章","a":["論量：反映個案複雜度、品質較高、資料透明 ｜ 缺乏節約誘因、過度提供服務、申報繁雜","論病例：控制費用、縮短住院日 ｜ 疾病歸類困難、醫療人球、減少必要服務","總額：精確執行預算、減少以量制價、同儕制約 ｜ 需完整推估協調、劣幣逐良幣、協商不易","論質：團隊照護減少併發症、優良者獲獎勵 ｜ 表現差者無改善誘因、指標達成不易","論日：申報簡單、減少浪費、風險轉嫁院所 ｜ 未考慮嚴重度，傾向收輕症、延長住院","論人：重視預防保健、預算易控 ｜ 選擇健康個案、拒收複雜個案、減少必要服務"]},{"q":"支出上限制 vs. 支出目標制；浮動點值公式","src":"第 4 章","a":["支出目標制（Target）：容許超出目標預算，超出部分打折支付","支出上限制（Cap，全民健保採用）：不容超出，點值回溯計價；P × Q ＝ E，申報點數愈多點值愈低","浮動點值＝（醫療給付費用總額 − 固定點值總金額）÷ 浮動總點數","平均點值＝醫療給付費用總額 ÷ 總醫療點數","固定點值（每點 1 元）：藥費、藥服費、手術、麻醉、血品、預防保健、專款專用等"]},{"q":"同一療程的定義（醫療辦法第 8 條）","src":"第 6、8 章","a":["簡單傷口：二日內換藥","首次治療日起 30 日內：血液／腹膜透析、精神社區復健及心理、活動、職能治療、癌症放射線、高壓氧、減敏、居家照護","首次治療日起 30 日內、6 次以內：西醫復健、皮症照光、非化療同一針劑注射、同牙位洗牙／補牙／拔牙、術後拆線、中醫針灸傷科脫臼整復等","9 歲以下兒童西醫復健：首次治療日起至次月底前、6 次以內；牙醫同部位根管治療：60 日內","同一療程僅登錄可累計就醫序號一次，診察費原則限報一次；最後治療日逢例假日順延"]},{"q":"手術通則：同一手術野、同類手術、附帶手術、併發症手術","src":"第 6 章","a":["同一手術野或病巢：同一手術區內不同器官因同一病灶影響須同時手術；對稱器官除特殊規定外指兩側","支付成數：同類或兩側 1、0.5、0.5、0；不同類 1、1、0.5、0","同類手術：支付標準手術章同一「項」內之手術","附帶手術：為達手術最終目的之切開、剝離、摘除、吻合、切片、縫合、灌洗，不得另報；附加非治療必須之手術不給付","併發症手術：依點數一半計算且只算一項；第一次手術在他院者不受限；一般材料費未表列者按 53% 計"]},{"q":"急診加成時限與不得加成情形","src":"第 5、6 章","a":["病情緊急需立即檢查且立即得到結果 → 檢查費加算 20%","實驗室檢驗：接收檢體至正式報告 1 小時內","超音波、內視鏡、特殊造影：醫囑至報告 3 小時內","不得加成：有醫囑未立即施行；報告超時（細菌、血液培養）；臨床無急迫意義；Blood gas；急診常規檢查","申報需填執行起迄至時分，未填不予給付加成"]},{"q":"個資法的特種個資與例外；CIA 三要素","src":"第 2 章","a":["特種個資（第 6 條）：病歷、醫療、基因、性生活、健康檢查、犯罪前科，原則不得蒐集處理利用","例外：① 法律明文規定 ② 執行法定職務或義務所必要且有安全維護措施 ③ 當事人自行公開或已合法公開 ④ 公務或學研機構統計研究、無從識別當事人 ⑤ 經當事人書面同意","機密性：僅授權者可取用（驗證、授權、加密）","完整性：僅授權者可更改（數位簽章）","可用性：授權者隨時可存取（重複建置、容錯移轉     var s = SESSION;
    var h = '<section class="sheet"><div class="qbar"><div><span class="micro">' + (s.mode === 'mock' ? 'Mock exam' : 'Practice') + '</span><div class="h2">' + esc(s.title) + '</div></div>' +
      (s.mode === 'mock' && !s.done ? '<span class="timer" id="timer"></span><button class="btn" type="button" data-act="submit">交卷</button>' : '') +
      '<button class="btn btn--ghost" type="button" data-act="leave">' + (s.done || s.mode !== 'mock' ? '回測驗選單' : '放棄這次') + '</button></div>';
    if (s.done) h += '<div class="score"><div class="score__big">' + s.score + '</div><div class="count__meta"><b>答對 ' + s.right + ' / ' + s.list.length + ' 題</b><span class="micro">' + (s.kind === 'pro' ? '每題 2 分 · 滿分 100 · 及格 60' : '每題 2 分 · 單選滿分 50') + '</span></div></div>';
    if (!s.list.length) h += '<p class="empty">這裡目前沒有題目。</p>';
    h += '<div id="sess">' + quizHtml(s.list, s.mode === 'mock' ? 'mock' : 'session') + '</div></section>';
    return h;
  }
  function afterSession() {
    var s = SESSION, root = $('#sess'); if (!root) return;
    $$('.q', root).forEach(function (box) {
      var q = QS.filter(function (x) { return x.id === box.dataset.q; })[0];
      if (s.mode === 'mock' && s.done) { reveal(box, q, s.picks[q.id] === undefined ? -1 : s.picks[q.id]); return; }
      if (s.mode === 'mock') {
        if (s.picks[q.id] !== undefined) $('#o-' + q.id + '-' + s.picks[q.id]).classList.add('is-pick');
        $$('.opt', box).forEach(function (b) { b.addEventListener('click', function () { s.picks[q.id] = +b.dataset.o; $$('.opt', box).forEach(function (x) { x.classList.toggle('is-pick', x === b); }); }); });
      } else {
        if (s.picks[q.id] !== undefined) { box.dataset.done = 1; reveal(box, q, s.picks[q.id]); return; }
        $$('.opt', box).forEach(function (b) { b.addEventListener('click', function () { if (box.dataset.done) return; box.dataset.done = 1; var pick = +b.dataset.o; s.picks[q.id] = pick; record(q, pick); reveal(box, q, pick); save(); }); });
      }
    });
    clearInterval(TIMER);
    if (s.mode === 'mock' && !s.done) {
      var tick = function () {
        var left = Math.max(0, Math.round((s.end - Date.now()) / 1000)); var t = $('#timer');
        if (t) { t.textContent = Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2); t.classList.toggle('low', left < 300); }
        if (left <= 0) submit();
      };
      tick(); TIMER = setInterval(tick, 1000);
    }
  }
  function submit() {
    var s = SESSION; if (!s || s.done) return;
    clearInterval(TIMER);
    s.right = 0;
    s.list.forEach(function (q) { var p = s.picks[q.id]; if (p === undefined) return; record(q, p); if (p === L.indexOf(q.ans)) s.right++; });
    s.score = s.right * 2; s.done = true; save(); route(); window.scrollTo(0, 0);
  }

  // cards
  var CI = 0, SHOW = false, CFILTER = 'all';
  function cardList() { return CARDS.map(function (c, i) { return i; }).filter(function (i) { return CFILTER === 'all' || S.cards[i] !== 'ok'; }); }
  function viewCards() {
    var list = cardList(); if (CI >= list.length) CI = 0;
    var ok = CARDS.filter(function (c, i) { return S.cards[i] === 'ok'; }).length;
    var h = '<section class="sheet fc"><div class="head" style="margin:0"><div class="ribbon">簡答閃卡</div><div class="chips">' +
      '<button class="chip" type="button" data-cf="all" aria-pressed="' + (CFILTER === 'all') + '">全部 ' + CARDS.length + '</button>' +
      '<button class="chip" type="button" data-cf="todo" aria-pressed="' + (CFILTER === 'todo') + '">還不熟 ' + (CARDS.length - ok) + '</button></div></div>';
    if (!list.length) return h + '<p class="empty">18 張都標記「會了」。考前可以切回「全部」再整體複習一輪。</p></section>';
    var i = list[CI], c = CARDS[i];
    h += '<div class="fc__card"><div class="head" style="margin:0"><span class="fc__no">' + ('0' + (i + 1)).slice(-2) + '′</span><span class="micro">' + esc(c.src) + '</span></div><p class="fc__q">' + esc(c.q) + '</p>' +
      (SHOW ? '<ol class="fc__a">' + c.a.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>' : '<p class="micro">先在心裡或紙上寫出 3～5 個重點，再翻面對答案。</p>') + '</div>';
    h += '<div class="fc__ctl"><div class="chips"><button class="btn btn--ghost" type="button" data-act="cprev">◂ 上一張</button><button class="btn btn--ghost" type="button" data-act="cnext">下一張 ▸</button></div><div class="chips">' +
      (SHOW ? '<button class="btn btn--ghost" type="button" data-act="cno">還不熟</button><button class="btn" type="button" data-act="cok">會了 ✦</button>' : '<button class="btn" type="button" data-act="flip">翻面看答案</button>') + '</div></div>';
    h += '<div class="dots" aria-label="閃卡狀態">' + CARDS.map(function (x, j) { return '<button class="dot' + (S.cards[j] === 'ok' ? ' ok' : S.cards[j] === 'no' ? ' no' : '') + (j === i ? ' cur' : '') + '" type="button" data-cj="' + j + '" aria-label="第 ' + (j + 1) + ' 張">' + (j + 1) + '</button>'; }).join('') + '</div>';
    h += '<div class="legend"><span>● 綠：會了</span><span>● 粉：還不熟</span><span>○ 未標記</span></div></section>';
    return h;
  }

  // calendar
  var VIEWM = new Date(Math.min(Math.max(TODAY, new Date(2026, 9, 1)), new Date(2026, 11, 1)));
  VIEWM = new Date(VIEWM.getFullYear(), VIEWM.getMonth(), 1);
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function viewCal() {
    var m = VIEWM, h = '<section class="sheet"><div class="calhead"><div><div class="month">' + MON[m.getMonth()] + '<small>' + m.getFullYear() + ' · 復習日曆</small></div></div>' +
      '<div class="chips">' + checkBtn() + '<div class="calnav"><button type="button" data-act="mprev"' + (m.getMonth() <= 9 ? ' disabled' : '') + '>◂ PREV</button><button type="button" data-act="mnext"' + (m.getMonth() >= 11 ? ' disabled' : '') + '>NEXT ▸</button></div></div></div>';
    h += '<div class="grid">' + ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
    var first = new Date(m.getFullYear(), m.getMonth(), 1), d = new Date(first); d.setDate(1 - first.getDay());
    for (var i = 0; i < 42; i++) {
      var k = dkey(d), p = PLAN[k], cls = 'day', mark = '';
      if (d.getMonth() !== m.getMonth()) cls += ' is-out';
      if (k === dkey(TODAY)) cls += ' is-today';
      if (k === dkey(EXAM)) cls += ' is-exam';
      if (S.checkins[k]) mark = '✦';
      else if (p && d < TODAY && d < EXAM) { cls += ' is-miss'; mark = '<span class="micro" style="color:var(--rose-ink)">未簽</span>'; }
      var inner = '<span class="day__n">' + d.getDate() + '<i>' + mark + '</i></span><span class="day__t">' + (p ? esc(p.t) : '') + '</span>';
      h += p && k !== dkey(EXAM) ? '<a class="' + cls + '" href="' + hrefFor(p.to) + '"' + (p.to.indexOf('must:') === 0 ? ' data-must="1"' : '') + '>' + inner + '</a>' : '<div class="' + cls + '">' + inner + '</div>';
      d.setDate(d.getDate() + 1);
      if (i === 34 && d.getMonth() !== m.getMonth()) break;
    }
    var done = Object.keys(S.checkins).length;
    h += '</div><div class="legend"><span>✦ 已簽到</span><span><span class="dia"></span> 今天</span><span>未簽：計畫日沒簽到</span><span>■ 考試日</span><span>點日期直接跳到當天內容</span></div></section>';
    h += '<section class="sheet"><div class="head"><div class="ribbon">讀書計畫</div><span class="micro">已簽到 ' + done + ' / ' + PLAN_DAYS + ' 天 · 連續 ' + streak() + ' 天</span></div><div class="phases">' +
      PHASES.map(function (p) { return '<div class="phase"><b>' + p[0] + '</b><span>' + p[1] + '</span></div>'; }).join('') + '</div>' +
      '<div class="foot" style="margin-top:14px"><span>依筆記「倒數 8 週讀書建議」排定，起點調整為 10/29。</span><span class="script">Keep going</span></div></section>';
    return h;
  }

  // ---------- router ----------
  function route() {
    var h = (location.hash || '#home').slice(1), tab = 'home', html;
    if (h.indexOf('notes-') === 0) { tab = 'notes'; html = viewNotes(h.slice(6)); }
    else if (h === 'quiz') { tab = 'quiz'; html = viewQuiz(); }
    else if (h === 'cards') { tab = 'cards'; html = viewCards(); }
    else if (h === 'calendar') { tab = 'calendar'; html = viewCal(); }
    else html = viewHome();
    $('#app').innerHTML = html;
    $$('.tab').forEach(function (t) { if (t.dataset.tab === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
    if (tab === 'notes') afterNotes();
    if (tab === 'quiz' && SESSION) afterSession();
  }
  var lastHash = location.hash;
  window.addEventListener('hashchange', function () {
    if (lastHash.indexOf('#quiz') === 0 && location.hash !== '#quiz' && SESSION && SESSION.mode !== 'mock') SESSION = null;
    lastHash = location.hash; route(); window.scrollTo(0, 0);
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-read],[data-start],[data-cf],[data-cj],a[data-must]');
    if (!t) return;
    if (t.matches('a[data-must]')) { PREF.mustOnly = true; lsSet(LS_PREF, PREF); return; }
    if (t.dataset.read) { var id = t.dataset.read; if (S.read[id]) delete S.read[id]; else S.read[id] = 1; save(); var on = !!S.read[id]; t.setAttribute('aria-pressed', on); t.textContent = on ? '✦ 本節已讀' : '標記本節已讀'; var ta = $('.toc [data-jump="' + id + '"]'); if (ta) ta.classList.toggle('done', on); return; }
    if (t.dataset.start) { startSession(t.dataset.start, t.dataset.arg); return; }
    if (t.dataset.cf) { CFILTER = t.dataset.cf; CI = 0; SHOW = false; route(); return; }
    if (t.dataset.cj) { CFILTER = 'all'; CI = +t.dataset.cj; SHOW = false; route(); return; }
    var a = t.dataset.act, n = cardList().length;
    if (a === 'check') toggleCheck();
    else if (a === 'must') { PREF.mustOnly = !PREF.mustOnly; lsSet(LS_PREF, PREF); $('#chap').classList.toggle('must-only', PREF.mustOnly); t.setAttribute('aria-pressed', PREF.mustOnly); }
    else if (a === 'submit') submit();
    else if (a === 'leave') { clearInterval(TIMER); SESSION = null; route(); }
    else if (a === 'flip') { SHOW = true; route(); }
    else if (a === 'cprev') { CI = (CI - 1 + n) % n; SHOW = false; route(); }
    else if (a === 'cnext') { CI = (CI + 1) % n; SHOW = false; route(); }
    else if (a === 'cok' || a === 'cno') { var idx = cardList()[CI]; S.cards[idx] = a === 'cok' ? 'ok' : 'no'; save(); SHOW = false; if (CFILTER === 'all' || a === 'cno') CI = (CI + 1) % n; route(); }
    else if (a === 'mprev') { VIEWM = new Date(VIEWM.getFullYear(), VIEWM.getMonth() - 1, 1); route(); }
    else if (a === 'mnext') { VIEWM = new Date(VIEWM.getFullYear(), VIEWM.getMonth() + 1, 1); route(); }
  });
  route();
})();
</script>

</body>
